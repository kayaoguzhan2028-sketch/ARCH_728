<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/webp" href="must-images/favicon/06Başkent.webp">
<title>Map — ARCH 728</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root { --black:#0a0a0a; --white:#f5f2eb; --mid:#d4cebc; --accent:#c9b8a8; --border:rgba(245,242,235,0.1); --font:'EB Garamond',Georgia,serif; }
  html,body { background:var(--black); color:var(--white); font-family:var(--font); height:100%; overflow:hidden; }

  nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 2.5rem; height:52px; border-bottom:1px solid var(--border); background:var(--black); }
  .nav-back { font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.6; transition:opacity 0.2s; }
  .nav-back:hover { opacity:1; }
  .nav-tag { font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; opacity:0.25; border:1px solid rgba(245,242,235,0.2); padding:0.2em 0.7em; }

  .map-viewport { position:fixed; top:52px; left:0; right:0; bottom:0; overflow:hidden; background:var(--black); cursor:default; user-select:none; }
  .map-viewport.pan-ready { cursor:grab; }
  .map-viewport.panning { cursor:grabbing; }

  .map-canvas { position:absolute; top:0; left:0; width:3938.05px; height:2784.65px; will-change:transform; }
  .map-canvas img, .map-canvas .map-hotspot { position:absolute; top:0; left:0; width:100%; height:100%; display:block; }
  #map-base, .map-layer { pointer-events:none; -webkit-user-drag:none; }
  .map-layer { opacity:0; transition:opacity 0.3s ease; }
  .map-hotspot { pointer-events:none; }
  .map-hotspot svg { width:100%; height:100%; display:block; }
  .map-hotspot path, .map-hotspot polygon { fill:transparent; pointer-events:all; cursor:pointer; }
  .map-viewport.pan-ready .map-hotspot path, .map-viewport.pan-ready .map-hotspot polygon { pointer-events:none; }
</style>
</head>
<body>
<nav>
  <a href="project-2026-7.html" class="nav-back">← 2026</a>
  <span class="nav-tag">Field Report</span>
</nav>

<div class="map-viewport" id="map-viewport">
  <div class="map-canvas" id="map-canvas">

    <img id="map-base" src="2026-images/2026-p7/Map/map-base.webp" alt="Map">

    <img class="map-layer" data-layer="nomad" src="2026-images/2026-p7/Map/map-nomad.webp" alt="">
    <img class="map-layer" data-layer="barbarian" src="2026-images/2026-p7/Map/map-barbarian.webp" alt="">
    <img class="map-layer" data-layer="vagabond" src="2026-images/2026-p7/Map/map-vagabond.webp" alt="">
    <img class="map-layer" data-layer="proletairat" src="2026-images/2026-p7/Map/map-proletairat.webp" alt="">

    <div class="map-hotspot" data-layer="nomad" data-svg="2026-images/2026-p7/Map/nomad.svg"></div>
    <div class="map-hotspot" data-layer="barbarian" data-svg="2026-images/2026-p7/Map/barbarian.svg"></div>
    <div class="map-hotspot" data-layer="vagabond" data-svg="2026-images/2026-p7/Map/vagabond.svg"></div>
    <div class="map-hotspot" data-layer="proletairat" data-svg="2026-images/2026-p7/Map/proletairat.svg"></div>

  </div>
</div>

<script>
  const viewport = document.getElementById('map-viewport');
  const canvas = document.getElementById('map-canvas');

  // circle-maxview.svg: center + radius (derived from its bezier-circle path)
  const CIRCLE = { cx: 1969.02, cy: 1392.33, r: 1002.03 };

  // vx,vy = canvas-space point currently shown at the viewport center
  let vx = CIRCLE.cx;
  let vy = CIRCLE.cy;

  function clampCenter() {
    const dx = vx - CIRCLE.cx;
    const dy = vy - CIRCLE.cy;
    const dist = Math.hypot(dx, dy);
    if (dist > CIRCLE.r) {
      const scale = CIRCLE.r / dist;
      vx = CIRCLE.cx + dx * scale;
      vy = CIRCLE.cy + dy * scale;
      return true;
    }
    return false;
  }

  function bounceBack() {
    canvas.style.transition = 'transform 0.35s cubic-bezier(0.33,1,0.68,1)';
    vx += (CIRCLE.cx - vx) * 0.06;
    vy += (CIRCLE.cy - vy) * 0.06;
    applyTransform();
    setTimeout(() => { canvas.style.transition = ''; }, 350);
  }

  function applyTransform() {
    const tx = viewport.clientWidth / 2 - vx;
    const ty = viewport.clientHeight / 2 - vy;
    canvas.style.transform = `translate(${tx}px, ${ty}px)`;
  }

  applyTransform();
  window.addEventListener('resize', applyTransform);

  // ── Pan: only while Space or the middle mouse button is held ─────────────
  let panKey = false;
  let dragging = false;
  let atBoundary = false;
  let lastX = 0, lastY = 0;

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !panKey) {
      panKey = true;
      viewport.classList.add('pan-ready');
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') {
      panKey = false;
      viewport.classList.remove('pan-ready');
    }
  });

  viewport.addEventListener('mousedown', (e) => {
    if (panKey || e.button === 1) {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      viewport.classList.add('panning');
      e.preventDefault();
    }
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    vx -= (e.clientX - lastX);
    vy -= (e.clientY - lastY);
    lastX = e.clientX;
    lastY = e.clientY;
    atBoundary = clampCenter();
    applyTransform();
  });
  window.addEventListener('mouseup', () => {
    dragging = false;
    viewport.classList.remove('panning');
    if (atBoundary) {
      bounceBack();
      atBoundary = false;
    }
  });

  // ── Hotspots: hover = half-open, click = stay open (toggle) ──────────────
  const LAYERS = ['nomad', 'barbarian', 'vagabond', 'proletairat'];

  LAYERS.forEach((name) => {
    const overlay = document.querySelector(`.map-hotspot[data-layer="${name}"]`);
    const layer = document.querySelector(`.map-layer[data-layer="${name}"]`);
    let hovering = false;
    let locked = false;

    const update = () => {
      layer.style.opacity = locked ? '1' : (hovering ? '0.5' : '0');
    };

    fetch(overlay.dataset.svg)
      .then((res) => res.text())
      .then((svg) => {
        overlay.innerHTML = svg;
        overlay.querySelectorAll('path, polygon').forEach((shape) => {
          shape.addEventListener('mouseenter', () => { hovering = true; update(); });
          shape.addEventListener('mouseleave', () => { hovering = false; update(); });
          shape.addEventListener('click', () => { locked = !locked; update(); });
        });
      });
  });
</script>
</body>
</html>
