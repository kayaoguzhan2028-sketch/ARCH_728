<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/webp" href="must-images/favicon/06Başkent.webp">
<title>Map — ARCH 728</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black:#0a0a0a; --white:#f5f2eb; --mid:#d4cebc; --accent:#c9b8a8; --border:rgba(245,242,235,0.1); --font:'EB Garamond',Georgia,serif; }
  html, body { width: 100%; height: 100%; background: var(--black); color: var(--white); font-family: var(--font); }

  nav { position:fixed; top:0; left:0; right:0; z-index:1000; display:flex; align-items:center; justify-content:space-between; padding:0 2.5rem; height:52px; border-bottom:1px solid var(--border); background:var(--black); }
  .nav-back { font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.6; transition:opacity 0.2s; }
  .nav-back:hover { opacity:1; }
  .nav-links { display:flex; align-items:center; gap:0.8rem; }
  .nav-link { font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; opacity:0.45; border:1px solid rgba(245,242,235,0.2); padding:0.2em 0.7em; color:var(--white); text-decoration:none; transition:opacity 0.2s,border-color 0.2s; }
  .nav-link:hover { opacity:1; border-color:rgba(245,242,235,0.5); }

  #map { position:fixed; top:52px; left:0; right:0; bottom:0; z-index:0; background:var(--black); }
  #map.dimmed .leaflet-tile-pane { filter: brightness(0.32) contrast(0.85) saturate(0.5); transition: filter 0.4s; }
  #map .leaflet-tile-pane { transition: filter 0.4s; }

  #slider-panel {
    position:fixed; bottom:2rem; left:50%; transform:translateX(-50%);
    z-index:900; background:rgba(10,10,10,0.78); border:1px solid var(--border);
    padding:0.9rem 1.6rem 0.8rem;
    display:flex; flex-direction:column; align-items:center; gap:0.5rem;
    min-width:320px;
  }
  #year-label { font-size:1.4rem; letter-spacing:0.08em; color:var(--white); opacity:0.9; }
  #demolition-counter {
    font-size:0.62rem; letter-spacing:0.16em; text-transform:uppercase;
    color:#ff6b5b; opacity:0.85; transition:opacity 0.2s;
  }
  #demolition-counter .count { font-size:0.8rem; letter-spacing:0; font-weight:600; }
  #demolition-counter.flash { animation: demolition-flash 0.9s ease-out; }
  @keyframes demolition-flash {
    0%   { opacity:1; text-shadow:0 0 12px rgba(255,107,91,0.9); }
    100% { opacity:0.85; text-shadow:none; }
  }
  .demolition-pulse {
    position:relative; pointer-events:none;
  }
  .demolition-pulse::before {
    content:''; position:absolute; top:50%; left:50%;
    width:14px; height:14px; margin:-7px 0 0 -7px;
    border-radius:50%; background:rgba(255,107,91,0.9);
    box-shadow:0 0 0 0 rgba(255,107,91,0.7);
    animation: demolition-pulse-ring 1.2s ease-out forwards;
  }
  @keyframes demolition-pulse-ring {
    0%   { transform:scale(0.4); opacity:1; box-shadow:0 0 0 0 rgba(255,107,91,0.7); }
    70%  { transform:scale(1.6); opacity:0.6; box-shadow:0 0 0 16px rgba(255,107,91,0); }
    100% { transform:scale(2.2); opacity:0; box-shadow:0 0 0 16px rgba(255,107,91,0); }
  }
  .road-pulse {
    position:relative; pointer-events:none;
  }
  .road-pulse::before {
    content:''; position:absolute; top:50%; left:50%;
    width:14px; height:14px; margin:-7px 0 0 -7px;
    border-radius:50%; background:rgba(168,224,99,0.9);
    box-shadow:0 0 0 0 rgba(168,224,99,0.7);
    animation: road-pulse-ring 1.2s ease-out forwards;
  }
  @keyframes road-pulse-ring {
    0%   { transform:scale(0.4); opacity:1; box-shadow:0 0 0 0 rgba(168,224,99,0.7); }
    70%  { transform:scale(1.6); opacity:0.6; box-shadow:0 0 0 16px rgba(168,224,99,0); }
    100% { transform:scale(2.2); opacity:0; box-shadow:0 0 0 16px rgba(168,224,99,0); }
  }
  .vagabond-canvas { animation: vagabond-pulse 3s ease-in-out infinite; }
  @keyframes vagabond-pulse {
    0%   { opacity:0.3; }
    50%  { opacity:0.9; }
    100% { opacity:0.3; }
  }
  .civilized-canvas { opacity:0; animation: civilized-pop 2.2s ease-out forwards; }
  @keyframes civilized-pop {
    0%   { opacity:0; }
    55%  { opacity:0.8; }
    100% { opacity:0.5; }
  }
  .hafriyat-square { pointer-events:none; }
  .hafriyat-square div {
    width:100%; height:100%;
    background:#e05c2a; opacity:0.85;
    box-shadow:0 0 4px rgba(224,92,42,0.6);
  }
  .proletariat-square { pointer-events:none; }
  .proletariat-square div {
    width:100%; height:100%;
    background:#d4a843; opacity:0.9;
    box-shadow:0 0 4px rgba(212,168,67,0.6);
  }
  .building-pulse {
    position:relative; pointer-events:none;
  }
  .building-pulse::before {
    content:''; position:absolute; top:50%; left:50%;
    width:14px; height:14px; margin:-7px 0 0 -7px;
    border-radius:50%; background:rgba(255,209,102,0.9);
    box-shadow:0 0 0 0 rgba(255,209,102,0.7);
    animation: building-pulse-ring 1.2s ease-out forwards;
  }
  @keyframes building-pulse-ring {
    0%   { transform:scale(0.4); opacity:1; box-shadow:0 0 0 0 rgba(255,209,102,0.7); }
    70%  { transform:scale(1.6); opacity:0.6; box-shadow:0 0 0 16px rgba(255,209,102,0); }
    100% { transform:scale(2.2); opacity:0; box-shadow:0 0 0 16px rgba(255,209,102,0); }
  }
  #year-slider {
    width:100%; cursor:pointer; appearance:none; height:2px;
    background:rgba(245,242,235,0.2); outline:none;
  }
  #year-slider::-webkit-slider-thumb {
    appearance:none; width:14px; height:14px;
    border-radius:50%; background:var(--white); cursor:pointer;
  }
  .slider-ticks {
    display:flex; justify-content:space-between; width:100%;
    font-size:0.52rem; letter-spacing:0.1em; color:var(--white); opacity:0.3; user-select:none;
  }

  #layer-panel {
    position:fixed; top:62px; right:1rem; z-index:900;
    background:rgba(10,10,10,0.78); border:1px solid var(--border);
    padding:0.8rem 1rem; display:flex; flex-direction:column; gap:0.5rem; min-width:170px;
  }
  .layer-btn {
    display:flex; align-items:center; gap:0.6rem;
    font-size:0.62rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--white); background:none; border:none; cursor:pointer;
    opacity:0.6; transition:opacity 0.2s; padding:0; text-align:left; font-family:var(--font);
  }
  .layer-btn.active { opacity:1; }
  .layer-dot { width:10px; height:10px; border-radius:2px; flex-shrink:0; }

  .leaflet-control-attribution { font-size:0.55rem !important; background:rgba(10,10,10,0.6) !important; color:rgba(245,242,235,0.4) !important; }
  .leaflet-control-attribution a { color:rgba(245,242,235,0.55) !important; }

  .map-label { font-family:var(--font); font-size:0.62rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--white); opacity:0.75; text-shadow:0 0 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.7); white-space:nowrap; pointer-events:none; }
</style>
</head>
<body>

<nav>
  <a href="project-2026-7.html" class="nav-back">← 2026</a>
  <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;opacity:0.4;">In Progress</span>
  <div class="nav-links">
    <a href="project-2026-7.html" class="nav-link">Main</a>
    <a href="project-2026-7-timeline.html" class="nav-link">The Timeline</a>
  </div>
</nav>

<div id="map"></div>

<div id="slider-panel">
  <span id="year-label">2010</span>
  <span id="demolition-counter"><span class="count">0</span> gecekondu yıkıldı</span>
  <input id="year-slider" type="range" min="2010" max="2026" step="1" value="2010">
  <div class="slider-ticks">
    <span>2010</span><span>2012</span><span>2014</span><span>2016</span>
    <span>2018</span><span>2020</span><span>2022</span><span>2024</span><span>2026</span>
  </div>
</div>

<div id="layer-panel"></div>

<script src="2026-images/2026-p7/Map/harita/js/sketch.js"></script>
<script src="2026-images/2026-p7/Map/harita/js/animation.js"></script>
<script src="2026-images/2026-p7/Map/harita/js/proletariat.js"></script>
<script src="2026-images/2026-p7/Map/harita/js/layers.js"></script>

<script>
  const CIRCLE_CENTER = L.latLng(39.8572724, 32.8407268);
  const CIRCLE_RADIUS = 2000; // metre

  const mapEl = document.getElementById('map');
  mapEl.classList.add('dimmed');

  const map = L.map('map', { center: CIRCLE_CENTER, zoom: 15 });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> katkıda bulunanlar © <a href="https://carto.com/attributions">CARTO</a>',
  }).addTo(map);

  // data path'ini harita/data/ olarak override et
  const _origDataPath = p => `2026-images/2026-p7/Map/harita/data/${p}`;

  LayerManager.init(map);
  HafriyatAnimation.init(map);
  ProletariatAnimation.init(map);
  LayerManager.loadStaticLayers(_origDataPath);

  // ── Yıkım sayacı + "yeni yıkım" flaş efekti ──────────────────────────────
  const demolitionCounter = document.getElementById('demolition-counter');
  const demolitionCount   = demolitionCounter.querySelector('.count');

  function flashNewDemolitions(geojson, year) {
    const features = (geojson && geojson.features) || [];
    demolitionCount.textContent = features.length;

    const isNew = f => f.properties && f.properties.year_demolished === year;
    const newOnes = features.filter(isNew);
    if (!newOnes.length) return;

    demolitionCounter.classList.remove('flash');
    requestAnimationFrame(() => demolitionCounter.classList.add('flash'));

    newOnes.forEach(f => {
      const ring = f.geometry.coordinates[0];
      const lat = ring.reduce((s, c) => s + c[1], 0) / ring.length;
      const lng = ring.reduce((s, c) => s + c[0], 0) / ring.length;
      const pulse = L.divIcon({ className: 'demolition-pulse', iconSize: [1, 1] });
      const marker = L.marker([lat, lng], { icon: pulse, interactive: false }).addTo(map);
      setTimeout(() => map.removeLayer(marker), 1200);
    });
  }

  // ── Yeni açılan yollar için "inşa" flaş efekti ───────────────────────────
  // Roads tek referans (roads_2025) üzerinden maskelenip yıllara dağıtıldığı için
  // bir yolun "yeni" olması = önceki yüklenen yılda maskeliyken bu yıl maskeden çıkmış olması.
  let previousRoadsKeys = null;

  function flashNewRoads(geojson, year) {
    const features = (geojson && geojson.features) || [];
    const currentKeys = new Set(features.map(f => JSON.stringify(f.geometry.coordinates)));

    if (previousRoadsKeys) {
      features.forEach(f => {
        const key = JSON.stringify(f.geometry.coordinates);
        if (previousRoadsKeys.has(key)) return;
        const coords = f.geometry.coordinates;
        const mid = coords[Math.floor(coords.length / 2)];
        const pulse = L.divIcon({ className: 'road-pulse', iconSize: [1, 1] });
        const marker = L.marker([mid[1], mid[0]], { icon: pulse, interactive: false }).addTo(map);
        setTimeout(() => map.removeLayer(marker), 1200);
      });
    }

    previousRoadsKeys = currentKeys;
  }

  // ── Yeni eklenen binalar için "inşa" flaş efekti ─────────────────────────
  let previousBuildingsKeys = null;

  function flashNewBuildings(geojson, year) {
    const features = (geojson && geojson.features) || [];
    const currentKeys = new Set(features.map(f => JSON.stringify(f.geometry.coordinates)));

    if (previousBuildingsKeys) {
      features.forEach(f => {
        const key = JSON.stringify(f.geometry.coordinates);
        if (previousBuildingsKeys.has(key)) return;
        const ring = f.geometry.coordinates[0];
        const lat = ring.reduce((s, c) => s + c[1], 0) / ring.length;
        const lng = ring.reduce((s, c) => s + c[0], 0) / ring.length;
        const pulse = L.divIcon({ className: 'building-pulse', iconSize: [1, 1] });
        const marker = L.marker([lat, lng], { icon: pulse, interactive: false }).addTo(map);
        setTimeout(() => map.removeLayer(marker), 1200);
      });
    }

    previousBuildingsKeys = currentKeys;
  }

  LayerManager.loadYear(2010, _origDataPath).then(({ demolition, roads, buildings }) => {
    flashNewDemolitions(demolition, 2010);
    flashNewRoads(roads, 2010);
    flashNewBuildings(buildings, 2010);
  });

  // Yer adları katmanı (mahalle/semt isimleri) — statik, tek seferlik veri
  const labelsLayer = L.layerGroup();
  fetch(_origDataPath('labels.geojson'), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : { features: [] })
    .catch(() => ({ features: [] }))
    .then(geojson => {
      (geojson.features || []).forEach(f => {
        const [lng, lat] = f.geometry.coordinates;
        L.marker([lat, lng], {
          icon: L.divIcon({ className: 'map-label', html: f.properties.name, iconSize: null }),
          interactive: false,
        }).addTo(labelsLayer);
      });
    });
  labelsLayer.addTo(map);

  const layerPanel = document.getElementById('layer-panel');
  ['buildings','roads','greenspace','water','demolition_zones','gecekondu','hafriyat_guzergah','vagabond','proletariat','civilized'].forEach(key => {
    const cfg = LayerManager.getConfig(key);
    const btn = document.createElement('button');
    btn.className = 'layer-btn active';
    btn.innerHTML = `<span class="layer-dot" style="background:${cfg.color}"></span>${cfg.label}`;
    btn.addEventListener('click', () => btn.classList.toggle('active', LayerManager.toggle(key)));
    layerPanel.appendChild(btn);
  });

  let labelsVisible = true;
  const labelsBtn = document.createElement('button');
  labelsBtn.className = 'layer-btn active';
  labelsBtn.innerHTML = '<span class="layer-dot" style="background:#f5f2eb"></span>Yer Adları';
  labelsBtn.addEventListener('click', () => {
    labelsVisible = !labelsVisible;
    labelsBtn.classList.toggle('active', labelsVisible);
    if (labelsVisible) labelsLayer.addTo(map); else map.removeLayer(labelsLayer);
  });
  layerPanel.appendChild(labelsBtn);

  map.on('moveend', function() {
    if (map.getCenter().distanceTo(CIRCLE_CENTER) > CIRCLE_RADIUS) {
      map.flyTo(CIRCLE_CENTER, 15, { duration: 0.8 });
    }
  });

  const slider    = document.getElementById('year-slider');
  const yearLabel = document.getElementById('year-label');
  slider.addEventListener('input', () => {
    const y = parseInt(slider.value);
    yearLabel.textContent = y === 2026 ? '2026 (canlı)' : y;
    mapEl.classList.toggle('dimmed', y < 2026);
    if (y >= 2026) {
      LayerManager.clearYearLayers();
      demolitionCount.textContent = 0;
      previousRoadsKeys = null;
      previousBuildingsKeys = null;
    } else {
      LayerManager.loadYear(y, _origDataPath).then(({ demolition, roads, buildings }) => {
        flashNewDemolitions(demolition, y);
        flashNewRoads(roads, y);
        flashNewBuildings(buildings, y);
      });
    }
  });
</script>

</body>
</html>
