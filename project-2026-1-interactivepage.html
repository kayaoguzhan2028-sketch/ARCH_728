<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/webp" href="must-images/favicon/06Başkent.webp">
<title>Çayırhan Ash Lake — ARCH 728</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black:#0a0a0a; --white:#f5f2eb; --mid:#d4cebc; --accent:#c9b8a8; --border:rgba(245,242,235,0.1); --font:'EB Garamond',Georgia,serif; }
  html, body { min-height: 100%; background: var(--black); color: var(--white); font-family: var(--font); }

  nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 2.5rem; height:52px; border-bottom:1px solid var(--border); background:var(--black); }
  .nav-back { font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.6; transition:opacity 0.2s; }
  .nav-back:hover { opacity:1; }
  .nav-tag { font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; opacity:0.25; border:1px solid rgba(245,242,235,0.2); padding:0.2em 0.7em; }

  .nav-title { position:absolute; left:50%; transform:translateX(-50%); font-size:0.7rem; letter-spacing:0.2em; text-transform:uppercase; opacity:0.5; }

  .wrap { max-width:1800px; margin:0 auto; padding:4rem 1.5rem 4rem; }

  .view-toggle { position:absolute; top:1.2rem; left:50%; transform:translateX(-50%); z-index:10; display:flex; width:max-content; border:1px solid var(--accent); background:rgba(10,10,10,0.6); backdrop-filter:blur(6px); }
  .toggle-btn { font-size:0.68rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--white); background:transparent; border:none; padding:0.6em 1.8em; cursor:pointer; font-family:var(--font); opacity:0.6; transition:opacity 0.2s ease, background 0.2s ease, color 0.2s ease; }
  .toggle-btn + .toggle-btn { border-left:1px solid var(--accent); }
  .toggle-btn:hover { opacity:1; }
  .toggle-btn.active { opacity:1; background:var(--accent); color:var(--black); }

  .img-wrap { position:relative; }
  #main-img, #main-img-2 { display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; }
  #main-img-2 { display:none; }
  #overlay-svg { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:visible; }

  .overlay-img { opacity:0; transition:filter 0.3s ease, opacity 0.2s ease; }
  .overlay-img.hover { opacity:1; filter:drop-shadow(0 0 6px rgba(245,220,140,0.55)); }
  .overlay-img.active { opacity:1; filter:drop-shadow(0 0 14px rgba(245,220,140,1)) drop-shadow(0 0 32px rgba(245,200,80,0.7)); }
</style>
</head>
<body>

<nav>
  <a href="2026.html" class="nav-back">← 2026</a>
  <span class="nav-title">Interactive Page</span>
  <span class="nav-tag">Field Report</span>
</nav>

<div class="wrap">

  <div class="img-wrap">
    <div class="view-toggle">
      <button class="toggle-btn active" id="toggle-current" type="button">Current</button>
      <button class="toggle-btn" id="toggle-future" type="button">Future</button>
    </div>
    <img id="main-img" src="2026-images/2026-p1/2-interactive-page/2026-1-çayırhanmainphoto_03.01.webp" draggable="false" alt="">
    <svg id="overlay-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2579 1383"></svg>
    <img id="main-img-2" src="2026-images/2026-p1/2-interactive-page/2026-1-728-INTERACTIVEPAGE_2NDIMAGE.webp" draggable="false" alt="">
  </div>

</div>

<script>
  const img     = document.getElementById('main-img');
  const img2    = document.getElementById('main-img-2');
  const svgEl   = document.getElementById('overlay-svg');
  const svgNS   = 'http://www.w3.org/2000/svg';

  const toggleCurrent = document.getElementById('toggle-current');
  const toggleFuture  = document.getElementById('toggle-future');

  toggleCurrent.addEventListener('click', () => {
    if (toggleCurrent.classList.contains('active')) return;
    toggleCurrent.classList.add('active');
    toggleFuture.classList.remove('active');
    img2.style.display = 'none';
    img.style.display = 'block';
    svgEl.style.display = '';
  });

  toggleFuture.addEventListener('click', () => {
    if (toggleFuture.classList.contains('active')) return;
    toggleFuture.classList.add('active');
    toggleCurrent.classList.remove('active');
    img.style.display = 'none';
    svgEl.style.display = 'none';
    img2.style.display = 'block';
  });

  const BASE = '2026-images/2026-p1/2-interactive-page/SVG/';

  const FILES = [
    { id:'microclimate', svg:'2026-1-cayirhanmainphoto_03.01-onecikanlar-microclimate.svg', webp:'2026-1-cayirhanmainphoto_03.01-onecikanlar-microclimate.webp' },
    { id:'fabrika',      svg:'2026-1-cayirhanmainphoto_03.01-onecikanlarfabrika.svg',        webp:'2026-1-cayirhanmainphoto_03.01-onecikanlarfabrika.webp'        },
    { id:'golet',        svg:'2026-1-cayirhanmainphoto_03.01-onecikanlargolet.svg',          webp:'2026-1-cayirhanmainphoto_03.01-onecikanlargolet.webp'          },
    { id:'kus',          svg:'2026-1-cayirhanmainphoto_03.01-onecikanlarkus.svg',            webp:'2026-1-cayirhanmainphoto_03.01-onecikanlarkus.webp'            },
    { id:'toprak',       svg:'2026-1-cayirhanmainphoto_03.01-onecikanlartoprak.svg',         webp:'2026-1-cayirhanmainphoto_03.01-onecikanlartoprak.webp'         },
    { id:'yapi',         svg:'2026-1-cayirhanmainphoto_03.01-onecikanlaryapi.svg',           webp:'2026-1-cayirhanmainphoto_03.01-onecikanlaryapi.webp'           },
  ];

  FILES.forEach(cfg => {
    fetch(encodeURI(BASE + cfg.svg))
      .then(r => r.text())
      .then(svgText => {
        const parser = new DOMParser();
        const parsed = parser.parseFromString(svgText, 'image/svg+xml');

        const g = document.createElementNS(svgNS, 'g');
        g.id = 'overlay-' + cfg.id;
        g.classList.add('overlay-img');

        const vis = document.createElementNS(svgNS, 'image');
        vis.setAttribute('href', encodeURI(BASE + cfg.webp));
        vis.setAttribute('x', '0');
        vis.setAttribute('y', '0');
        vis.setAttribute('width', '2579');
        vis.setAttribute('height', '1383');
        vis.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        vis.setAttribute('pointer-events', 'none');
        g.appendChild(vis);

        Array.from(parsed.documentElement.childNodes).forEach(node => {
          if (node.nodeType === 1) g.appendChild(document.importNode(node, true));
        });

        g.querySelectorAll('polygon, path, rect, circle, ellipse, polyline').forEach(shape => {
          shape.setAttribute('pointer-events', 'all');
          shape.style.cursor = 'pointer';
          if (cfg.id === 'fabrika') {
            shape.addEventListener('mouseenter', () => g.classList.add('active'));
            shape.addEventListener('mouseleave', () => g.classList.remove('active'));
            shape.addEventListener('click', () => {
              window.location.href = 'project-2026-1-powerplant.html';
            });
          } else if (cfg.id === 'kus') {
            shape.addEventListener('mouseenter', () => g.classList.add('active'));
            shape.addEventListener('mouseleave', () => g.classList.remove('active'));
            shape.addEventListener('click', () => {
              window.location.href = 'project-2026-1-bird.html';
            });
          } else if (cfg.id === 'microclimate') {
            shape.addEventListener('mouseenter', () => g.classList.add('active'));
            shape.addEventListener('mouseleave', () => g.classList.remove('active'));
            shape.addEventListener('click', () => {
              window.location.href = 'project-2026-1-microclimatichange.html';
            });
          } else if (cfg.id === 'golet') {
            shape.addEventListener('mouseenter', () => g.classList.add('active'));
            shape.addEventListener('mouseleave', () => g.classList.remove('active'));
            shape.addEventListener('click', () => {
              window.location.href = 'project-2026-1-ashlake.html';
            });
          } else if (cfg.id === 'toprak') {
            shape.addEventListener('mouseenter', () => g.classList.add('active'));
            shape.addEventListener('mouseleave', () => g.classList.remove('active'));
            shape.addEventListener('click', () => {
              window.location.href = 'project-2026-1-soil.html';
            });
          } else if (cfg.id === 'yapi') {
            shape.addEventListener('mouseenter', () => g.classList.add('active'));
            shape.addEventListener('mouseleave', () => g.classList.remove('active'));
            shape.addEventListener('click', () => {
              window.location.href = 'project-2026-1-infrastructure.html';
            });
          } else {
            shape.addEventListener('mouseenter', () => {
              if (!g.classList.contains('active')) g.classList.add('hover');
            });
            shape.addEventListener('mouseleave', () => g.classList.remove('hover'));
            shape.addEventListener('click', () => {
              g.classList.toggle('active');
              g.classList.remove('hover');
            });
          }
        });

        svgEl.appendChild(g);
      });
  });
</script>
</body>
</html>
