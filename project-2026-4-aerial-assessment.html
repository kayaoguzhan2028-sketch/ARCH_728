<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/webp" href="must-images/favicon/06Başkent.webp">
<title>Project 2026-4 — ARCH 728</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black:#0a0a0a; --white:#f5f2eb; --mid:#d4cebc; --accent:#c9b8a8; --border:rgba(245,242,235,0.1); --font:'EB Garamond',Georgia,serif; }
  html,body { background:var(--black); color:var(--white); font-family:var(--font); min-height:100vh; }

  nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 2.5rem; height:52px; border-bottom:1px solid var(--border); background:var(--black); }
  .nav-back { font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.6; transition:opacity 0.2s; }
  .nav-back:hover { opacity:1; }
  .nav-tag { font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; opacity:0.25; border:1px solid rgba(245,242,235,0.2); padding:0.2em 0.7em; }

  .wrap { max-width:620px; margin:0 auto; padding:8rem 2rem 6rem; }
  .label { font-size:0.68rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--accent); opacity:0.7; margin-bottom:2rem; display:block; }
  h1 { font-size:clamp(2.2rem,5vw,3.8rem); font-weight:400; line-height:1.15; letter-spacing:0.04em; margin-bottom:0.8rem; }
  .subtitle { font-size:1.05rem; font-style:italic; color:var(--mid); margin-bottom:3.5rem; line-height:1.6; }
  .rule { border:none; border-top:1px solid var(--border); margin-bottom:3.5rem; }
  .body { font-size:1.1rem; line-height:1.95; opacity:0.82; }
  .body p { margin-bottom:1.6rem; }
  .body p:last-child { margin-bottom:0; }
  .body h2 { font-size:1.25rem; font-weight:400; margin:3rem 0 1rem; letter-spacing:0.04em; }
  .body blockquote { border-left:1px solid var(--accent); padding-left:1.4rem; margin:2.5rem 0; font-style:italic; opacity:0.75; }
  .body img { max-width:100%; margin:2.5rem 0; opacity:0.88; }
  .aerial-grid { display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:auto; gap:1rem; margin:0 0 2.5rem; }
  .aerial-item { display:flex; align-items:stretch; gap:0.6rem; }
  .aerial-item img { flex:1; min-width:0; width:100%; display:block; margin:0; opacity:0.88; }
  .aerial-caption { display:flex; align-items:center; justify-content:center; font-size:0.62rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white); writing-mode:vertical-rl; transform:rotate(180deg); white-space:nowrap; flex-shrink:0; }
  .aerial-caption.left { order:-1; }
  .aerial-item.full { flex-direction:column; align-items:flex-start; }
  .aerial-caption.bottom { writing-mode:horizontal-tb; transform:none; justify-content:flex-start; }
  @media (max-width:640px) {
    .aerial-grid { grid-template-columns:1fr; }
  }
  .meta { margin-top:5rem; padding-top:2rem; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:2.5rem; }
  .meta-item { display:flex; flex-direction:column; gap:0.3rem; }
  .meta-item dt { font-size:0.62rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--mid); opacity:0.5; }
  .meta-item dd { font-size:0.88rem; opacity:0.65; }
</style>
</head>
<body>
<nav>
  <a href="2026.html" class="nav-back">← 2026</a>

</nav>
<div class="wrap">
  <div class="body">

    <section class="aerial-grid">
      <figure class="aerial-item">
        <img src="2026-images/2026-p4/webp/_2.aerial assessment/2.1.2007 - 2023 Superposed Izohips.webp" alt="2007-2023 Superposed Izohips">
        <figcaption class="aerial-caption left">2.1.2007 - 2023 Superposed Izohips</figcaption>
      </figure>
      <figure class="aerial-item">
        <img src="2026-images/2026-p4/webp/_2.aerial assessment/2.2.2007-2023-Superposed-Izohips-3D-view-with-section-lines.webp" alt="2007-2023 Superposed Izohips 3D view with section lines">
        <figcaption class="aerial-caption right">2.2.2007-2023-Superposed-Izohips-3D-view-with-section-lines</figcaption>
      </figure>
      <figure class="aerial-item">
        <img src="2026-images/2026-p4/webp/_2.aerial assessment/2.3.2007-Superposed-Izohips-3D-view.webp" alt="2007 Superposed Izohips 3D view">

      <figure class="aerial-item">

        <figcaption class="aerial-caption right">2.4.2023-izohips-3D-view</figcaption>
      </figure>
      <figure class="aerial-item">
        <img src="2026-images/2026-p4/webp/_2.aerial assessment/2.5.2007-2023-Superposed-Izohips-3D-view.webp" alt="2007-2023 Superposed Izohips 3D view">
        <figcaption class="aerial-caption left">2.5.2007-2023-Superposed-Izohips-3D-view</figcaption>
      </figure>
      <figure class="aerial-item">
        <img src="2026-images/2026-p4/webp/_2.aerial assessment/2.6.2007-2023-Superposed-Izohips-3D-view-fractured-from-section-lines.webp" alt="2007-2023 Superposed Izohips 3D view fractured from section lines">
        <figcaption class="aerial-caption right">2.6.2007-2023-Superposed-Izohips-3D-view-fractured-from-section-lines</figcaption>
      </figure>
      <figure class="aerial-item full" style="grid-column:1 / -1;">
        <img src="2026-images/2026-p4/webp/_2.aerial assessment/2.7.Section lines on real time map.webp" alt="Section lines on real time map">
        <figcaption class="aerial-caption bottom">2.7.Section lines on real time map</figcaption>
      </figure>
    </section>
  </div>
  <dl class="meta">
    <div class="meta-item"><dt>Dönem</dt><dd>Spring 2026</dd></div>
  </dl>
</div>
</body>
</html>
