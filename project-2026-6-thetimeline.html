<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/webp" href="must-images/favicon/06Başkent.webp">
<title>Project 2026-6 — ARCH 728</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black:#0a0a0a; --white:#f5f2eb; --mid:#d4cebc; --accent:#c9b8a8; --border:rgba(245,242,235,0.1); --font:'EB Garamond',Georgia,serif; }
  html,body { background:var(--black); color:var(--white); font-family:var(--font); min-height:100vh; height:100%; overflow:hidden; }

  nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 2.5rem; height:52px; border-bottom:1px solid var(--border); background:var(--black); }
  .nav-back { font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.6; transition:opacity 0.2s; }
  .nav-back:hover { opacity:1; }
  .nav-title { position:absolute; left:50%; transform:translateX(-50%); font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; opacity:0.55; pointer-events:none; }
  .nav-tag { font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; opacity:0.25; border:1px solid rgba(245,242,235,0.2); padding:0.2em 0.7em; }
  .nav-links { display:flex; align-items:center; gap:1.8rem; }
  .nav-links a { font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.6; transition:opacity 0.2s; display:flex; align-items:center; gap:0.5em; }
  .nav-links a:hover { opacity:1; }

  .stage { position:fixed; inset:0; padding-top:52px; display:flex; align-items:center; justify-content:center; padding:6rem 2rem 2rem; }
  .interactive-image { position:relative; width:min(94%, calc(88vh * 1920 / 1080)); aspect-ratio:1920/1080; }
  .interactive-image img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }

  .hotspot-overlay { position:absolute; inset:0; }
  .hotspot-overlay svg { width:100%; height:100%; display:block; }

  .hotspot-overlay.hover-layer path,
  .hotspot-overlay.hover-layer circle,
  .hotspot-overlay.hover-layer polygon,
  .hotspot-overlay.hover-layer rect { fill:var(--accent); opacity:0; pointer-events:fill; cursor:default; transition:opacity 0.25s ease; }
  .hotspot-overlay.hover-layer path:hover,
  .hotspot-overlay.hover-layer circle:hover,
  .hotspot-overlay.hover-layer polygon:hover,
  .hotspot-overlay.hover-layer rect:hover { opacity:0.3; }

  .hotspot-overlay.click-layer path,
  .hotspot-overlay.click-layer circle,
  .hotspot-overlay.click-layer polygon,
  .hotspot-overlay.click-layer rect { fill:var(--accent); opacity:0; pointer-events:fill; cursor:pointer; transition:opacity 0.25s ease; }
  .hotspot-overlay.click-layer path:hover,
  .hotspot-overlay.click-layer circle:hover,
  .hotspot-overlay.click-layer polygon:hover,
  .hotspot-overlay.click-layer rect:hover { opacity:0.3; }

  .legend-label { position:fixed; top:70px; left:2rem; max-width:320px; padding:0.8em 1.2em; border:1px solid var(--border); background:rgba(10,10,10,0.8); opacity:0; transform:translateY(-6px); transition:opacity 0.25s ease, transform 0.25s ease; pointer-events:none; z-index:60; }
  .legend-label.active { opacity:1; transform:translateY(0); }
  .legend-label h3 { font-size:0.78rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); margin-bottom:0.5em; font-weight:400; }
  .legend-label p { font-size:0.85rem; line-height:1.6; opacity:0.85; }

  .modal-overlay { position:fixed; inset:0; z-index:300; background:rgba(10,10,10,0.96); display:none; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal-close { position:absolute; top:1.5rem; right:1.5rem; width:42px; height:42px; border-radius:50%; background:rgba(245,242,235,0.06); border:1px solid var(--border); color:var(--white); font-size:1.5rem; line-height:1; font-family:var(--font); cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0.6; transition:opacity 0.2s,background 0.2s; }
  .modal-close:hover { opacity:1; background:rgba(245,242,235,0.14); }
  .modal-image { width:100%; max-width:1000px; max-height:88vh; overflow-y:auto; display:flex; flex-direction:column; align-items:center; gap:4rem; padding:4rem 1.5rem; }
  .modal-slide { display:flex; flex-direction:column; align-items:center; gap:1rem; width:100%; }
  .modal-slide img { max-width:100%; max-height:58vh; object-fit:contain; display:block; }
  .modal-gallery { width:100%; max-width:640px; display:flex; flex-direction:column; align-items:center; gap:1rem; }
  .modal-gallery-img-wrap { position:relative; width:100%; display:flex; align-items:center; justify-content:center; }
  .modal-gallery-img-wrap img { max-width:100%; max-height:54vh; object-fit:contain; display:block; }
  .modal-gallery-arrow { position:absolute; top:50%; transform:translateY(-50%); width:42px; height:42px; border-radius:50%; background:rgba(10,10,10,0.5); border:1px solid var(--border); color:var(--white); font-size:1.3rem; line-height:1; font-family:var(--font); cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0.6; transition:opacity 0.2s,background 0.2s; }
  .modal-gallery-arrow:hover { opacity:1; background:rgba(245,242,235,0.14); }
  .modal-gallery-arrow.prev { left:0.5rem; }
  .modal-gallery-arrow.next { right:0.5rem; }
  .modal-gallery-counter { font-size:0.78rem; letter-spacing:0.1em; opacity:0.45; }
  .modal-slide h2 { font-size:1.3rem; font-weight:400; letter-spacing:0.06em; color:var(--accent); }
  .modal-slide p { max-width:620px; font-size:0.95rem; line-height:1.85; opacity:0.82; text-align:center; }
  .modal-slide .modal-links { display:flex; flex-direction:column; gap:0.4rem; align-items:center; }
  .modal-slide .modal-links a { font-size:0.82rem; color:var(--accent); opacity:0.75; text-decoration:none; word-break:break-all; }
  .modal-slide .modal-links a:hover { opacity:1; text-decoration:underline; }

  @media (max-width:720px) {
    html,body { overflow:auto; }
    .stage { position:static; padding:6rem 1rem 3rem; }
    .legend-label { left:1rem; right:1rem; text-align:center; }
  }
</style>
</head>
<body>
<nav>
  <a href="2026.html" class="nav-back">← 2026</a>
  <span class="nav-title">Imrahor Valley</span>
  <div class="nav-links">
    <a href="project-2026-6-thefactories.html">← The Factory</a>
    <a href="project-2026-6-thestoryline.html">The Storyline →</a>
  </div>
</nav>

<div class="stage">
  <div class="interactive-image">
    <img src="2026-images/2026-p6/3-The Timeline/2026-6-the timeline-1.webp" alt="The Timeline — Main Visual">

    <div class="hotspot-overlay hover-layer" data-svg="2026-images/2026-p6/3-The Timeline/THE TIMELINE SVG/2026-6-the timeline-lejant_(in)visibility-svg.svg" data-label="(In)Visibility" data-desc="Change in soil's visibility."></div>
    <div class="hotspot-overlay hover-layer" data-svg="2026-images/2026-p6/3-The Timeline/THE TIMELINE SVG/2026-6-the timeline-lejant_alteration-svg.svg" data-label="Alteration" data-desc="Changing the structure of the soil by removing the top soil."></div>
    <div class="hotspot-overlay hover-layer" data-svg="2026-images/2026-p6/3-The Timeline/THE TIMELINE SVG/2026-6-the timeline-lejant_decomposition-svg.svg" data-label="Decomposition" data-desc="Brick to soil process."></div>
    <div class="hotspot-overlay hover-layer" data-svg="2026-images/2026-p6/3-The Timeline/THE TIMELINE SVG/2026-6-the timeline-lejant_dumping-svg.svg" data-label="Dumping" data-desc="Waste and excavation dumping to the pits."></div>
    <div class="hotspot-overlay hover-layer" data-svg="2026-images/2026-p6/3-The Timeline/THE TIMELINE SVG/2026-6-the timeline-lejant_existing water volume-svg.svg" data-label="Existing Water Volume" data-desc="Change in water through excavation pits."></div>
    <div class="hotspot-overlay hover-layer" data-svg="2026-images/2026-p6/3-The Timeline/THE TIMELINE SVG/2026-6-the timeline-lejant_extraction-svg.svg" data-label="Extraction" data-desc="Excavation works in the valley of the factories."></div>
    <div class="hotspot-overlay hover-layer" data-svg="2026-images/2026-p6/3-The Timeline/THE TIMELINE SVG/2026-6-the timeline-lejant_recomposition-svg.svg" data-label="Recomposition" data-desc="Soil to brick process."></div>

    <div class="hotspot-overlay click-layer" data-svg="2026-images/2026-p6/3-The Timeline/THE TIMELINE SVG/2026-6-the timeline-30lar-svg.svg" data-decade="30lar"></div>
    <div class="hotspot-overlay click-layer" data-svg="2026-images/2026-p6/3-The Timeline/THE TIMELINE SVG/2026-6-the timeline-60lar-svg.svg" data-decade="60lar"></div>
    <div class="hotspot-overlay click-layer" data-svg="2026-images/2026-p6/3-The Timeline/THE TIMELINE SVG/2026-6-the timeline-90lar-svg.svg" data-decade="90lar"></div>
    <div class="hotspot-overlay click-layer" data-svg="2026-images/2026-p6/3-The Timeline/THE TIMELINE SVG/2026-6-the timeline-2020ler-svg.svg" data-decade="2020ler"></div>
  </div>
</div>

<div class="legend-label" id="legend-label"></div>

<div class="modal-overlay" id="decade-modal">
  <button class="modal-close" id="modal-close" aria-label="Close">×</button>
  <div class="modal-image" id="modal-content"></div>
</div>

<script>
  const legendLabel = document.getElementById('legend-label');
  const decadeModal = document.getElementById('decade-modal');
  const modalContent = document.getElementById('modal-content');

  const TIMELINE_BASE = '2026-images/2026-p6/3-The Timeline/';

  const decadeContent = {
    '30lar': [
      {
        img: TIMELINE_BASE + '2026-6-the timeline-slice1-pic1.webp',
        title: '1930s',
        caption: "Start of the first brick production in the valley. The solid brick production process was semi-handcrafted (harman tuğla). Clay was poured into molds, dried in the sun, and fired in kilns to become bricks or tiles.",
      },
      {
        img: TIMELINE_BASE + '2026-6-The Timeline-Slice1-Pic2.webp',
        caption: "Initially, the soil was relatively homogeneous. With the establishment of brick factories, small amounts of brick fragments and residues began to appear in the soil.",
      },
      {
        img: TIMELINE_BASE + '2026-6-The Timeline-Slice1-Pic3.webp',
        caption: "An old newspaper ad about bricks from İmrahor. 1931/12/19, Hakimiyeti Milliye, Page 8.",
      },
    ],
    '60lar': [
      {
        img: TIMELINE_BASE + '2026-6-the timeline-slice2-pic1.webp',
        title: '1960s-1970s',
        caption: "17 brick factories were established between 1965 and 1976. Handmade production of solid bricks stopped and switched to cored bricks (blok tuğla). Heavy excavation and pond formation began in the valley.",
      },
      {
        img: TIMELINE_BASE + '2026-6-The Timeline-Slice2-Pic2.webp',
        caption: "During the 1970s, the structure of the soil started to change significantly with the start of the intense excavations.",
      },
      {
        img: TIMELINE_BASE + '2026-6-The Timeline-Slice2-Pic3.webp',
        caption: "An old news about the brick workers who did not receive their salary. 1966/07/14, Milliyet.",
      },
      {
        img: TIMELINE_BASE + '2026-6-The Timeline-Slice2-Pic4.webp',
        title: 'Comments of the Locals',
        links: [
          'https://www.facebook.com/share/p/1DCvDxquUs/',
          'https://www.facebook.com/share/p/1BS7VGwqWe/',
          'https://www.facebook.com/share/p/1JPE2wu67Q/',
        ],
      },
    ],
    '90lar': [
      {
        img: TIMELINE_BASE + '2026-6-the timeline-slice3-pic1.webp',
        title: '1990s-2000s',
        caption: "The factories closed down between 1996 and 1999 when their licenses were revoked. Waste dumping in the ponds highly increased. The natural structure of the valley has been damaged by the discarded waste of the brick factories and by the dumping of debris.",
      },
      {
        img: TIMELINE_BASE + '2026-6-The Timeline-Slice3-Pic2.webp',
        caption: "During the 1990s, the amount of brick debris present in the soil increased significantly.",
      },
      {
        gallery: [
          { img: TIMELINE_BASE + '2026-6-The Timeline-Slice3-Pic3.webp' },
          { img: TIMELINE_BASE + '2026-6-The Timeline-Slice3-Pic4.webp' },
          { img: TIMELINE_BASE + '2026-6-The Timeline-Slice3-Pic5.webp' },
        ],
      },
      {
        img: TIMELINE_BASE + '2026-6-The Timeline-Slice3-Pic6.webp',
      },
    ],
    '2020ler': [
      {
        img: TIMELINE_BASE + '2026-6-the timeline-slice4-pic1.webp',
        title: 'Today',
        caption: "Today, brick production has disappeared from İmrahor Valley. Following the closure of the last remaining factory only a few years ago, several abandoned industrial structures remain scattered across the valley. While production has ceased, its material legacy persists as an industrial residue embedded in the valley's soil.",
      },
      {
        img: TIMELINE_BASE + '2026-6-the timeline-slice4-pic2.webp',
        caption: "Today, the soil contains dense brick residues mixed with excavation spoil and waste materials.",
      },
      {
        gallery: [
          { img: TIMELINE_BASE + '2026-6-The Timeline-Slice4-Pic3.webp', caption: "An abandoned factory in the valley." },
          { img: TIMELINE_BASE + '2026-6-The Timeline-Slice4-Pic4.webp', caption: "Noticeable changes in soil color and composition due to brick fragments." },
          { img: TIMELINE_BASE + '2026-6-The Timeline-Slice4-Pic5.webp', caption: "Dense accumulations of brick debris near the factory that most recently functioned (until the 2020s)." },
          { img: TIMELINE_BASE + '2026-6-The Timeline-Slice4-Pic6.webp', caption: "Soil or brick?" },
          { img: TIMELINE_BASE + '2026-6-The Timeline-Slice4-Pic7.webp', caption: "Remains of an abandoned factory." },
          { img: TIMELINE_BASE + '2026-6-The Timeline-Slice4-Pic8.webp', caption: "Soil containing dense brick residues." },
          { img: TIMELINE_BASE + '2026-6-The Timeline-Slice4-Pic9.webp', caption: "Soil containing dense brick residues." },
        ],
      },
    ],
  };

  function openDecadeModal(decade) {
    const slides = decadeContent[decade];
    if (!slides) return;

    modalContent.innerHTML = '';
    slides.forEach((slide) => {
      const slideEl = document.createElement('div');
      slideEl.className = 'modal-slide';

      if (slide.gallery) {
        const gallery = document.createElement('div');
        gallery.className = 'modal-gallery';

        const wrap = document.createElement('div');
        wrap.className = 'modal-gallery-img-wrap';
        const img = document.createElement('img');
        img.alt = '';
        const prev = document.createElement('button');
        prev.className = 'modal-gallery-arrow prev';
        prev.textContent = '‹';
        prev.setAttribute('aria-label', 'Previous');
        const next = document.createElement('button');
        next.className = 'modal-gallery-arrow next';
        next.textContent = '›';
        next.setAttribute('aria-label', 'Next');
        wrap.appendChild(prev);
        wrap.appendChild(img);
        wrap.appendChild(next);

        const caption = document.createElement('p');
        const counter = document.createElement('div');
        counter.className = 'modal-gallery-counter';

        let index = 0;
        const update = () => {
          const item = slide.gallery[index];
          img.src = item.img;
          caption.textContent = item.caption || '';
          counter.textContent = `${index + 1} / ${slide.gallery.length}`;
        };
        prev.addEventListener('click', () => {
          index = (index - 1 + slide.gallery.length) % slide.gallery.length;
          update();
        });
        next.addEventListener('click', () => {
          index = (index + 1) % slide.gallery.length;
          update();
        });
        update();

        gallery.appendChild(wrap);
        gallery.appendChild(caption);
        gallery.appendChild(counter);
        slideEl.appendChild(gallery);
      } else if (slide.img) {
        const img = document.createElement('img');
        img.src = slide.img;
        img.alt = '';
        slideEl.appendChild(img);
      }

      if (slide.title) {
        const h2 = document.createElement('h2');
        h2.textContent = slide.title;
        slideEl.appendChild(h2);
      }

      if (slide.caption) {
        const p = document.createElement('p');
        p.textContent = slide.caption;
        slideEl.appendChild(p);
      }

      if (slide.links) {
        const linksEl = document.createElement('div');
        linksEl.className = 'modal-links';
        const superscripts = ['¹', '²', '³', '⁴', '⁵', '⁶', '⁷', '⁸', '⁹'];
        slide.links.forEach((url, i) => {
          const a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = `${superscripts[i] || (i + 1)} ${url}`;
          linksEl.appendChild(a);
        });
        slideEl.appendChild(linksEl);
      }

      modalContent.appendChild(slideEl);
    });

    modalContent.scrollTop = 0;
    decadeModal.classList.add('open');
  }

  document.getElementById('modal-close').addEventListener('click', () => {
    decadeModal.classList.remove('open');
  });

  document.querySelectorAll('.hotspot-overlay').forEach((overlay) => {
    fetch(overlay.dataset.svg)
      .then((res) => res.text())
      .then((svg) => {
        overlay.innerHTML = svg;
        const shapes = overlay.querySelectorAll('path, circle, polygon, rect');

        if (overlay.classList.contains('hover-layer')) {
          shapes.forEach((shape) => {
            shape.removeAttribute('class');
            shape.addEventListener('mouseenter', () => {
              legendLabel.innerHTML = `<h3>${overlay.dataset.label}</h3><p>${overlay.dataset.desc}</p>`;
              legendLabel.classList.add('active');
            });
            shape.addEventListener('mouseleave', () => {
              legendLabel.classList.remove('active');
            });
          });
        }

        if (overlay.classList.contains('click-layer')) {
          shapes.forEach((shape) => {
            shape.removeAttribute('class');
            shape.addEventListener('click', () => {
              openDecadeModal(overlay.dataset.decade);
            });
          });
        }
      });
  });
</script>
</body>
</html>
