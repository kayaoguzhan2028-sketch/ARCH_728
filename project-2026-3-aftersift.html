<style>

  html.hash-nav body { visibility:hidden; }

  nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 2.5rem; height:52px; border-bottom:1px solid var(--border); background:var(--black); }
  .nav-back { font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.6; transition:opacity 0.2s; }
  .nav-back:hover { opacity:1; }
  .nav-title { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:0.7rem; letter-spacing:0.18em; text-transform:uppercase; opacity:0.5; white-space:nowrap; }
  .nav-tag { font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; opacity:0.25; border:1px solid rgba(245,242,235,0.2); padding:0.2em 0.7em; color:var(--white); text-decoration:none; transition:opacity 0.2s; }
  .nav-tag:hover { opacity:0.6; }

  .wrap { max-width:1600px; margin:0 auto; padding:52px 2rem 6rem; }
  .body { font-size:1.1rem; line-height:1.95; opacity:0.82; }

  .section { scroll-margin-top:52px; min-height:calc(100vh - 52px); height:calc(100vh - 52px); overflow:hidden; display:flex; flex-direction:column; justify-content:center; }
  .img-row { display:flex; align-items:center; justify-content:space-between; }
  .img-row > img { flex:0 0 auto; height:auto; display:block; max-width:calc(100% - 120px); }
  .img-row > img.img-common { width:var(--img-w); }
  .img-row > img.img-portrait { width:auto; height:calc((100vh - 52px - 4rem) * 0.9); max-width:none; }
  .img-arrow { flex:0 0 auto; width:44px; height:44px; border-radius:50%; background:rgba(245,242,235,0.06); border:1px solid var(--border); color:var(--white); cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0.5; transition:opacity 0.2s,background 0.2s; }
  .img-arrow:hover { opacity:1; background:rgba(245,242,235,0.14); }
  .placeholder-box { flex:0 0 auto; width:var(--img-w); max-width:calc(100% - 120px); height:calc(var(--img-w) / 1.518); border:1px dashed var(--border); opacity:0.35; font-size:0.68rem; letter-spacing:0.18em; text-transform:uppercase; display:flex; align-items:center; justify-content:center; text-align:center; }
  .scroll-nav { position:fixed; right:2rem; z-index:150; width:44px; height:44px; border-radius:50%; background:rgba(245,242,235,0.06); border:1px solid var(--border); color:var(--white); cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0.5; transition:opacity 0.2s,background 0.2s; }
  .scroll-nav:hover { opacity:1; background:rgba(245,242,235,0.14); }
  .scroll-nav-up { top:6.5rem; }
  .scroll-nav-down { bottom:2.5rem; }
  @media (max-width:600px) {
    .scroll-nav { width:38px; height:38px; right:1.2rem; }
    .scroll-nav-up { top:4.5rem; }
    .scroll-nav-down { bottom:1.5rem; }
    .img-arrow { width:38px; height:38px; }
    .img-row > img { max-width:calc(100% - 100px); }
    .placeholder-box { max-width:calc(100% - 100px); }
  }

  .meta { margin-top:5rem; padding-top:2rem; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:2.5rem; }
  .meta-item { display:flex; flex-direction:column; gap:0.3rem; }
  .meta-item dt { font-size:0.62rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--mid); opacity:0.5; }
  .meta-item dd { font-size:0.88rem; opacity:0.65; }
</style>
</head>
<body>

</button>
<div class="wrap">
  <div class="body">

    <div class="section" id="section-1">

        <img class="img-common" src="2026-images/2026-p3/5 after sift page-5/after sift-5.1.webp" alt="After Sift 5.1">
        <button class="img-arrow" id="as1-next" aria-label="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>

<script>
  if (location.hash) {
    const target = document.querySelector(location.hash);
    if (target) target.scrollIntoView({ behavior: 'auto', block: 'start' });
  }
  document.documentElement.classList.remove('hash-nav');

  const sections = document.querySelectorAll('.body .section');
  const sectionOffset = 52;

  function currentSectionIndex() {
    let idx = 0;
    sections.forEach((sec, i) => {
      if (sec.getBoundingClientRect().top <= sectionOffset + 1) idx = i;
    });
    return idx;
  }

  function scrollToSection(index) {
    const clamped = Math.max(0, Math.min(sections.length - 1, index));
    if (clamped === 0) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      sections[clamped].scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  document.getElementById('scroll-up').addEventListener('click', () => scrollToSection(currentSectionIndex() - 1));
  document.getElementById('scroll-down').addEventListener('click', () => scrollToSection(currentSectionIndex() + 1));

  document.getElementById('as1-prev').addEventListener('click', () => { window.location.href = 'project-2026-3-siftingwhatdetectingerrors.html#section-1'; });
  document.getElementById('as1-next').addEventListener('click', () => { window.location.href = 'project-2026-3-soilscenesifters.html#section-1'; });
  document.getElementById('as2-prev').addEventListener('click', () => { window.location.href = 'project-2026-3-siftingwhatdetectingerrors.html#section-2'; });
  document.getElementById('as2-next').addEventListener('click', () => { window.location.href = 'project-2026-3-soilscenesifters.html#section-2'; });
  document.getElementById('as3-prev').addEventListener('click', () => { window.location.href = 'project-2026-3-siftingwhatdetectingerrors.html#section-3'; });
  document.getElementById('as3-next').addEventListener('click', () => { window.location.href = 'project-2026-3-soilscenesifters.html#section-3'; });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); scrollToSection(currentSectionIndex() + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); scrollToSection(currentSectionIndex() - 1); }
  });
</script>
