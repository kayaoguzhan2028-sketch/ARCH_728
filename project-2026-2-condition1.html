<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/webp" href="must-images/favicon/06Başkent.webp">
<title>Condition 1 — Hıdırlık Tepe — ARCH 728</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black:#0a0a0a; --white:#f5f2eb; --border:rgba(245,242,235,0.1); --font:'EB Garamond',Georgia,serif; }
  html, body { background: var(--black); color: var(--white); font-family: var(--font); min-height: 100vh; }

  nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 2.5rem; height:52px; border-bottom:1px solid var(--border); background:var(--black); }
  .nav-back { font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.6; transition:opacity 0.2s; }
  .nav-back:hover { opacity:1; }
  .nav-tag { font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; opacity:0.25; border:1px solid rgba(245,242,235,0.2); padding:0.2em 0.7em; }

  .page { padding: 5rem 4rem 6rem; max-width: 1100px; margin: 0 auto; }

  .pair-group { margin-bottom: 4.5rem; }
  .pair-label { font-size:0.58rem; letter-spacing:0.25em; text-transform:uppercase; opacity:0.28; margin-bottom:0.7rem; display:block; }

  .condition-row { display:flex; gap:2rem; margin-bottom:4.5rem; flex-wrap:wrap; }
  .condition-row .pair-group { flex:1; min-width:240px; margin-bottom:0; }

  /* stacked images */
  .stack {
    position: relative;
    width: 100%;
    line-height: 0;
  }
  .stack img, .stack video {
    width: 100%;
    max-height: 580px;
    object-fit: contain;
    object-position: center top;
    display: block;
  }
  .stack .img-sonrasi {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    object-position: center top;
    opacity: 0;
  }

  /* slider */
  .slider-wrap { padding: 1rem 0 0; }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 1px;
    outline: none;
    cursor: pointer;
    border-radius: 0;
    background: rgba(245,242,235,0.15);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--white);
    cursor: pointer;
    margin-top: 0;
  }
  input[type="range"]::-moz-range-thumb {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--white);
    border: none;
    cursor: pointer;
  }
</style>
</head>
<body>
<nav>
  <a href="project-2026-2.html" class="nav-back">← Hıdırlık Tepe</a>
  <span class="nav-tag">Condition 1</span>
</nav>

<div class="page">

  <div class="pair-group">
    <div class="stack">
      <video autoplay loop muted playsinline>
        <source src="2026-images/2026-p2/conditions/condition1.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <div class="condition-row">

    <div class="pair-group">
      <span class="pair-label">a</span>
      <div class="stack" id="stack-a">
        <img src="2026-images/2026-p2/conditions/condition-oncesi-01-a.webp" alt="öncesi a">
        <img class="img-sonrasi" src="2026-images/2026-p2/conditions/condition-sonrasi-01-a.webp" alt="sonrası a">
      </div>
      <div class="slider-wrap">
        <input type="range" min="0" max="100" value="0" data-stack="stack-a">
      </div>
    </div>

    <div class="pair-group">
      <span class="pair-label">b</span>
      <div class="stack" id="stack-b">
        <img src="2026-images/2026-p2/conditions/condition-oncesi-01-b.webp" alt="öncesi b">
        <img class="img-sonrasi" src="2026-images/2026-p2/conditions/condition-sonrasi-01-b.webp" alt="sonrası b">
      </div>
      <div class="slider-wrap">
        <input type="range" min="0" max="100" value="0" data-stack="stack-b">
      </div>
    </div>

    <div class="pair-group">
      <span class="pair-label">c</span>
      <div class="stack" id="stack-c">
        <img src="2026-images/2026-p2/conditions/condition-oncesi-01-c.webp" alt="öncesi c">
        <img class="img-sonrasi" src="2026-images/2026-p2/conditions/condition-sonrasi-01-c.webp" alt="sonrası c">
      </div>
      <div class="slider-wrap">
        <input type="range" min="0" max="100" value="0" data-stack="stack-c">
      </div>
    </div>

  </div>

</div>

<script>
  document.querySelectorAll('input[type="range"]').forEach(slider => {
    const stack = document.getElementById(slider.dataset.stack);
    const sonrasi = stack.querySelector('.img-sonrasi');

    function update() {
      const v = slider.value;
      sonrasi.style.opacity = v / 100;
      slider.style.background =
        `linear-gradient(to right, rgba(245,242,235,0.65) ${v}%, rgba(245,242,235,0.15) ${v}%)`;
    }

    slider.addEventListener('input', update);
    update();
  });
</script>
</body>
</html>
