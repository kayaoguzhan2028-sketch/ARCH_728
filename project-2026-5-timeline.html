<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/webp" href="must-images/favicon/06Başkent.webp">
<title>Reverse Section — ARCH 728</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black:#0a0a0a; --white:#f5f2eb; --mid:#d4cebc; --accent:#c9b8a8; --orange:#d97a3f; --border:rgba(245,242,235,0.1); --font:'EB Garamond',Georgia,serif; }
  html,body { background:var(--black); color:var(--white); font-family:var(--font); min-height:100vh; }

  nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 2.5rem; height:52px; border-bottom:1px solid var(--border); background:var(--black); }
  .nav-back { font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.6; transition:opacity 0.2s; }
  .nav-back:hover { opacity:1; }
  .page-nav { display:flex; gap:0.8rem; }
  .page-nav-link { font-size:0.66rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--white); text-decoration:none; border:1px solid rgba(245,242,235,0.2); padding:0.4em 1em; opacity:0.5; transition:opacity 0.2s,border-color 0.2s; }
  .page-nav-link:hover { opacity:1; border-color:rgba(245,242,235,0.45); }

  .wrap { max-width:1000px; margin:0 auto; padding:8rem 2rem 6rem; }
  .label { font-size:0.68rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--accent); opacity:0.7; margin-bottom:2rem; display:block; }
  h1 { font-size:clamp(2.2rem,5vw,3.8rem); font-weight:400; line-height:1.15; letter-spacing:0.04em; margin-bottom:0.8rem; color:var(--orange); }
  .subtitle { font-size:1.05rem; font-style:italic; color:var(--mid); margin-bottom:3.5rem; line-height:1.6; }
  .rule { border:none; border-top:1px solid var(--border); margin-bottom:3.5rem; }
  .body { font-size:1.1rem; line-height:1.95; opacity:0.82; }
  .body p { margin-bottom:1.6rem; }
  .body p:last-child { margin-bottom:0; }
  .body h2 { font-size:1.25rem; font-weight:400; margin:3rem 0 1rem; letter-spacing:0.04em; }
  .body blockquote { border-left:1px solid var(--accent); padding-left:1.4rem; margin:2.5rem 0; font-style:italic; opacity:0.75; }
  .body img { max-width:100%; margin:2.5rem 0; opacity:0.88; }

  .interactive-image { position:relative; width:100%; margin:2.5rem 0; }
  .interactive-image img { width:100%; display:block; margin:0; opacity:0.9; }
  .hotspot-overlay { position:absolute; top:0; left:0; width:100%; height:100%; }
  .hotspot-zone { fill:var(--accent); opacity:0; pointer-events:fill; cursor:pointer; transition:opacity 0.25s ease; }
  .hotspot-zone:hover { opacity:0.25; }
  .hotspot-zone.active { opacity:0.35; }

  .timeline-result { display:none; flex-direction:column; gap:1.5rem; margin-top:3.5rem; padding-top:3rem; border-top:1px solid var(--border); scroll-margin-top:5rem; }
  .timeline-result.active { display:flex; }
  .timeline-result h3 { font-size:0.72rem; font-weight:400; letter-spacing:0.2em; text-transform:uppercase; color:var(--accent); opacity:0.7; margin:0; }
  .timeline-result img { max-width:100%; max-height:60vh; width:auto; display:block; margin:0 auto; opacity:0.92; }
  .timeline-result p { font-size:1.1rem; line-height:1.95; opacity:0.82; margin:0; }
  .meta { margin-top:5rem; padding-top:2rem; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:2.5rem; }
  .meta-item { display:flex; flex-direction:column; gap:0.3rem; }
  .meta-item dt { font-size:0.62rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--mid); opacity:0.5; }
  .meta-item dd { font-size:0.88rem; opacity:0.65; }
</style>
</head>
<body>
<nav>
  <a href="2026.html" class="nav-back">← 2026</a>
  <div class="page-nav">
    <a href="project-2026-5.html" class="page-nav-link">← Main Page</a>
    <a href="project-2026-5-microsection.html" class="page-nav-link">Microsections →</a>
  </div>
</nav>
<div class="wrap">
  <h1>Reverse Section</h1>
  <hr class="rule">
  <div class="body">

    <div class="interactive-image">
      <img src="2026-images/2026-p5/02-Timeline/Timeline.webp" alt="Reverse section timeline">
      <svg class="hotspot-overlay" viewBox="0 0 5303 850" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <circle class="hotspot-zone" cx="164.74" cy="485.93" r="30.84"/>
        <circle class="hotspot-zone" cx="1121.39" cy="485.93" r="30.84"/>
        <circle class="hotspot-zone" cx="2458.85" cy="487.93" r="30.84"/>
      </svg>
    </div>

    <div class="timeline-result" id="timeline-result">
      <h3 id="timeline-result-title"></h3>
      <img id="timeline-result-img" src="" alt="">
      <p id="timeline-result-text"></p>
    </div>

  </div>
  <dl class="meta">
    <div class="meta-item"><dt>Dönem</dt><dd>Spring 2026</dd></div>
  </dl>
</div>

<script>
  const timelineData = [
    { img: '2026-images/2026-p5/02-Timeline/Current-Extended.webp', title: 'Initiation Phase', text: 'In the first years after abandonment, the carbonation process began in the reinforced concrete structural elements, and due to the effects of rain and groundwater, calcium components in the concrete seeped into the surrounding soil, causing localized alkalization. Although visible deterioration in the building materials was limited during this period, the weakening of the protective concrete layer initiated the initial stages of corrosion in the reinforcing steel, and the chemical interaction between the structure and the soil gradually increased.' },
    { img: '2026-images/2026-p5/02-Timeline/Stage-1-Extended.webp', title: 'Activation Phase', text: 'During this phase, the structure transitions from a completely dormant state to an "activation" process where environmental impacts intensify and material degradation accelerates. Cracks deepen in the concrete surfaces, reinforcement corrosion becomes more visible, and chemical components carried by rainwater spread over a wider area in the soil. In this process, the structure ceases to be merely a physical remnant, it expands its spatial impact by establishing an active exchange of substances with the surrounding soil system.' },
    { img: '2026-images/2026-p5/02-Timeline/Stage-2-Extended.webp', title: 'Fragmentation Phase', text: 'At this stage, the structure undergoes a transformation process where it loses a significant degree of structural integrity, and disintegration becomes permanent. The load-bearing systems weaken considerably, the concrete masses disintegrate into brittle blocks, and the reinforcing elements are completely exposed and rapidly corrode. Atmospheric effects and water infiltration, along with continuous disintegration of the material, cause it to mix with the surrounding soil. In this process, the structure integrates into the environmental system not as a stable form, but as an expanding debris field and a heterogeneous material distribution.' }
  ];

  const timelineResult = document.getElementById('timeline-result');
  const timelineResultImg = document.getElementById('timeline-result-img');
  const timelineResultTitle = document.getElementById('timeline-result-title');
  const timelineResultText = document.getElementById('timeline-result-text');
  const hotspotZones = document.querySelectorAll('.hotspot-zone');

  hotspotZones.forEach((zone, i) => {
    zone.addEventListener('click', () => {
      timelineResultTitle.textContent = timelineData[i].title;
      timelineResultText.textContent = timelineData[i].text;
      timelineResult.classList.add('active');
      hotspotZones.forEach((z, j) => z.classList.toggle('active', j === i));

      const scrollToResult = () => timelineResult.scrollIntoView({ behavior: 'smooth', block: 'start' });
      timelineResultImg.onload = scrollToResult;
      timelineResultImg.src = timelineData[i].img;
      if (timelineResultImg.complete) scrollToResult();
    });
  });
</script>
</body>
</html>
