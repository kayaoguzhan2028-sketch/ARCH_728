</div>

<script>
const timelineLightbox        = document.getElementById('timeline-lightbox');
const timelineLightboxContent = document.getElementById('timeline-lightbox-content');
const timelineLightboxClose   = document.getElementById('timeline-lightbox-close');
const TIMELINE_BASE  = '2026-images/2026-p7/Timeline/';
const LIGHTBOX1_BASE = '2026-images/2026-p7/Timeline/Lightbox1/';

const EXTRA_IMAGES = {
  '1': [{ file: '1-dikmen-vadisi-1977.webp', caption: 'Dikmen Vadisi - 1977\nFoto : Aydın Kılcıoğlu' }],
  '2': [{ file: '2-dikmen-vadisi-source.webp', caption: 'Güngör, Z. ANKARA DIKMEN VADISI.' }],
  '3': [{ file: '3.0-dikmen-vadisi-1989.webp', caption: 'Dikmen Vadisi 1989: gecekondu evleri\nKaynak: personal archive of Kenan Ozdemir.' }, { file: '3.1-dikmen-vadisi-source2.webp', caption: 'Güngör, Z. ANKARA DIKMEN VADISI.' }],
  '4': [{ file: '4.0-gecekondu-yikimi.webp', caption: 'Source: <a href="https://www.haberler.com/dikmen-vadisinde-gecekondu-yikimi-3531306-haberi/" target="_blank" rel="noopener">https://www.haberler.com/dikmen-vadisinde-gecekondu-yikimi-3531306-haberi/</a>' }],
  '6': [{ file: '6.0.webp' }, { file: '6.1-reference.webp' }, { file: '6.2-ankara-koz-oran.webp' }, { file: '6.3-reference.jpg' }],
};

const EXTRA_TEXT = {
  '5': `
    <h3>Dikmen Valley, what it was and how it fell</h3>
    <p>Dikmen Valley runs across about 250 hectares of Ankara, from Oran to Dikmen, and for more than thirty years it was a gecekondu neighborhood. From the 1970s, migrants built their own houses here on what had once been the village pasture. There was no electricity, no water, no sewage. They carried the bricks on their backs and raised the rooms one by one, over years. The streets grew like a labyrinth, against the symmetry of the city's boulevards and towers, and these streets carried a life and an organism of their own.</p>
    <p>In 2006 the municipality opened the fourth and fifth stages of an urban transformation project over the valley. Residents, with papers or without, were told to sign the contracts and leave within seven days. About twelve hundred households left. Six hundred refused, unable to pay for what was offered, or unwilling to be moved. Then the pressure turned material. Water was cut for days, electricity went out, rubble was dumped across the roads, and the demolition crews pulled down stairs and poles along with the houses. One of the oldest residents said he was being forced back into a wandering life. The valley turned from a place people had built into a place they were made to leave. (Kaya, 2011)</p>
    <h3>Who lives in the ruins now</h3>
    <p>By 2018 the demolitions were still going, carried on by one mayor after another. The fourth and fifth stages were being cleared by the metropolitan municipality, and the people left among the ruins were now Syrian refugees. They lived in tents pitched in the debris, with no water and no electricity, and made a living collecting paper. A mother said her children slept on wet blankets and were sick almost every day. They had lived in a gecekondu higher up the slope until they were told to find themselves a house, because this one was coming down.</p>
    <p>They were told what the others had been told: big buildings are coming, so leave. For the poorest, nothing was waiting on the other side. A fifteen-year-old boy shined shoes instead of going to school, and filled water jugs from the one gecekondu line that had not yet been cut; his family was already planning to move again, this time to Gebze. The residents remembered the elections. Before the vote, people came and promised to fix everything. After it, no one came, and no one asking for a vote had ever said the word demolition. Winter was close, and they asked whether a person is really put out the door in the cold. (Alan, 2018)</p>
    <div class="references">
      <h3>References</h3>
      <p>Alan, Serkan. "Dikmenliler: Oy isterken kimse yıkım demiyor." Gazete Duvar, 19 October 2018 (updated 16 November 2020). <a href="https://www.gazeteduvar.com.tr/gundem/2018/10/19/dikmenliler-oy-isterken-kimse-yikim-demiyor" target="_blank" rel="noopener">gazeteduvar.com.tr</a></p>
      <p>Kaya, Tuğba. "Ankara Dikmen Vadisi gecekondularında son beş yılda gündelik yaşamdaki değişim: Yıkıma karşı dayanışma." Birikim, 10 June 2011. Republished on sendika.org. <a href="https://sendika.org/2011/06/ankara-dikmen-vadisi-gecekondularinda-son-bes-yilda-gundelik-yasamdaki-degisim-yikima-karsi-dayanisma-tugba-kaya-birikim" target="_blank" rel="noopener">sendika.org</a></p>
    </div>
  `,
};

function addLightboxImage(src, caption) {
  const figure = document.createElement('figure');
  const img = document.createElement('img');
  img.src = encodeURI(src);
  figure.appendChild(img);
  if (caption) {
    const figcaption = document.createElement('figcaption');
    figcaption.innerHTML = caption.split('\n').map(line => line).join('<br>');
    figure.appendChild(figcaption);
  }
  timelineLightboxContent.appendChild(figure);
}

function addLightboxText(html) {
  const block = document.createElement('div');
  block.className = 'text-block';
  block.innerHTML = html;
  timelineLightboxContent.appendChild(block);
}

document.querySelectorAll('.map-hotspot').forEach(svg => {
  const id = svg.dataset.layer;
  const layer = document.querySelector(`.map-layer[data-layer="${id}"]`);
  svg.querySelectorAll('path').forEach(path => {
    path.addEventListener('mouseenter', () => layer.classList.add('active'));
    path.addEventListener('mouseleave', () => layer.classList.remove('active'));
    path.addEventListener('click', () => {
      timelineLightboxContent.innerHTML = '';
      addLightboxImage(TIMELINE_BASE + id + '-lightbox-map.webp');
      (EXTRA_IMAGES[id] || []).forEach(item => addLightboxImage(LIGHTBOX1_BASE + item.file, item.caption));
      if (EXTRA_TEXT[id]) addLightboxText(EXTRA_TEXT[id]);
      timelineLightbox.classList.add('open');
    });
  });
});

timelineLightboxClose.addEventListener('click', () => timelineLightbox.classList.remove('open'));
timelineLightbox.addEventListener('click', e => { if (e.target === timelineLightbox) timelineLightbox.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') timelineLightbox.classList.remove('open'); });
</script>
