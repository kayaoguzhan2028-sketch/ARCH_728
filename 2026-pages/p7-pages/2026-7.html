  .node-label { position:absolute; bottom:calc(100% + 14px); left:50%; transform:translateX(-50%) translateY(8px); white-space:nowrap; font-family:var(--font); font-size:0.58rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--white); opacity:0; pointer-events:none; transition:opacity 0.35s ease,transform 0.35s ease; }
  .node-label::after { content:''; position:absolute; top:calc(100% + 4px); left:50%; width:1px; height:10px; background:rgba(245,242,235,0.3); transform:translateX(-50%) scaleY(0); transform-origin:top; transition:transform 0.3s ease 0.05s; }
  .node:hover .node-dot { opacity:0.95; transform:scale(1.6); }
  .node:hover .node-dot::after { opacity:0.3; transform:translate(-50%,-50%) scale(1); }
  .node:hover .node-label { opacity:0.9; transform:translateX(-50%) translateY(0); }
  .node:hover .node-label::after { transform:translateX(-50%) scaleY(1); }
  .node-preview { position:absolute; bottom:calc(100% + 52px); left:50%; transform:translateX(-50%) translateY(10px); width:62px; height:62px; border:1px solid rgba(245,242,235,0.25); overflow:hidden; opacity:0; pointer-events:none; transition:opacity 0.35s ease,transform 0.35s ease; }
  .node-preview img { width:100%; height:100%; object-fit:cover; display:block; }

  #hover-icon { position:fixed; top:0; left:0; z-index:200; display:flex; flex-direction:column; align-items:center; pointer-events:none; opacity:0; transform:translate(24px,24px); transition:opacity 0.2s ease; }

  <div class="map-inner">

    <img id="map-main" src="../../2026-images/2026-p7/opening-page/axon-all/01-trailmap-son.webp" alt="Project 2026-7">

    <img class="map-layer" data-layer="04" src="../../2026-images/2026-p7/opening-page/axon-all/04-genericbuildingsetmap.webp" alt="">

    <object class="map-hotspot" data-layer="07" type="image/svg+xml" data="../../2026-images/2026-p7/opening-page/axon-all/07-nomadicearthmap.svg"></object>
    <object class="map-hotspot" data-layer="02" type="image/svg+xml" data="../../2026-images/2026-p7/opening-page/axon-all/02-barbarianmap.svg"></object>
    <object class="map-hotspot" data-layer="03" type="image/svg+xml" data="../../2026-images/2026-p7/opening-page/axon-all/03-proletarianmap.svg"></object>
    <object class="map-hotspot" data-layer="04" type="image/svg+xml" data="../../2026-images/2026-p7/opening-page/axon-all/04-genericbuilding.svg"></object>
    <object class="map-hotspot" data-layer="05" type="image/svg+xml" data="../../2026-images/2026-p7/opening-page/axon-all/05-displacementmap.svg"></object>
    <object class="map-hotspot" data-layer="06" type="image/svg+xml" data="../../2026-images/2026-p7/opening-page/axon-all/06-vagabondearthmap.svg"></object>

<script>
// ── Soil-layer hover reveal ───────────────────────────────────────────────────
const soilLayers = ['07','02','03','04','05','06'].map(id => ({
  id,
  obj: document.querySelector(`.map-hotspot[data-layer="${id}"]`),
  layer: document.querySelector(`.map-layer[data-layer="${id}"]`),
  doc: null
}));

soilLayers.forEach(L => {
  L.obj.addEventListener('load', () => {
    const doc = L.obj.contentDocument;
    if (!doc) return;
    const style = doc.createElementNS('http://www.w3.org/2000/svg', 'style');
    style.textContent = '*{fill:transparent !important;stroke:none !important;} path,polygon{pointer-events:all;}';
    doc.documentElement.insertBefore(style, doc.documentElement.firstChild);
    L.doc = doc;
  });
});

// ── Hover icon for nomadic / vagabond earth layers ────────────────────────────
const HOVER_INFO = {
  '07': { icon: '../../2026-images/2026-p7/icons/ikon-nomad-metabolic-flow.webp', label: 'Nomadic Soil' },
  '06': { icon: '../../2026-images/2026-p7/icons/ikon-vagabond-1.webp', label: 'Vagabond Earth' },
  '04': { label: 'Generic Building Set' },
  '05': { label: 'Displacement' },
  '03': { icon: '../../2026-images/2026-p7/icons/ikon-proletarian.webp', label: 'Proletairat Earth' },
  '02': { icon: '../../2026-images/2026-p7/icons/ikon-barbarian.webp', label: 'Barbarian Earth' }
};
const hoverIcon = document.getElementById('hover-icon');
const hoverIconImg = document.getElementById('hover-icon-img');
const hoverIconLabel = document.getElementById('hover-icon-label');

const mapInner = document.querySelector('.map-inner');
let activeSoilHit = null;
let soilClearTimer = null;

function applySoilHit(hit, e) {
  activeSoilHit = hit;
  soilLayers.forEach(L => L.layer.classList.toggle('active', L === hit));
  mapInner.style.cursor = 'pointer';
  const info = HOVER_INFO[hit.id];
  if (info.icon) {
    hoverIconImg.src = info.icon;
    hoverIconImg.style.display = '';
  } else {
    hoverIconImg.style.display = 'none';
  }
  hoverIconLabel.textContent = info.label;
  hoverIcon.style.left = e.clientX + 'px';
  hoverIcon.style.top = e.clientY + 'px';
  hoverIcon.classList.add('active');
}

function clearSoilHit() {
  soilClearTimer = null;
  activeSoilHit = null;
  soilLayers.forEach(L => L.layer.classList.remove('active'));
  mapInner.style.cursor = 'default';
  hoverIcon.classList.remove('active');
}

mapInner.addEventListener('mousemove', e => {
  const rect = mapInner.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  let hit = null;
  for (let i = soilLayers.length - 1; i >= 0; i--) {
    const L = soilLayers[i];
    if (!L.doc) continue;
    const el = L.doc.elementFromPoint(x, y);
    if (el && el.matches('path,polygon')) { hit = L; break; }
  }

  if (hit) {
    if (soilClearTimer) { clearTimeout(soilClearTimer); soilClearTimer = null; }
    applySoilHit(hit, e);
  } else if (activeSoilHit && !soilClearTimer) {
    // The shapes for each soil layer are drawn as several separate pieces scattered
    // across the artwork, so the cursor briefly crosses real gaps between them while
    // moving within what still reads as the same region. Wait a beat before clearing
    // so the hover doesn't flicker off in those gaps.
    soilClearTimer = setTimeout(clearSoilHit, 150);
  }
});
mapInner.addEventListener('mouseleave', () => {
  if (soilClearTimer) { clearTimeout(soilClearTimer); soilClearTimer = null; }
  clearSoilHit();
});
let genericBuildingClicks = 0;
mapInner.addEventListener('click', () => {
  if (activeSoilHit && activeSoilHit.id === '02') {
    window.location.href = '2026-7-migrant-soil.html#barbaric';
  } else if (activeSoilHit && activeSoilHit.id === '07') {
    window.location.href = '2026-7-migrant-soil.html#nomad';
  } else if (activeSoilHit && activeSoilHit.id === '06') {
    window.location.href = '2026-7-migrant-soil.html#vagabond';
  } else if (activeSoilHit && activeSoilHit.id === '03') {
    window.location.href = '2026-7-migrant-soil.html#proletariat';
  } else if (activeSoilHit && activeSoilHit.id === '04') {
    genericBuildingClicks++;
    if (genericBuildingClicks >= 5) {
      window.location.href = '2026-7-migrant-soil.html#civilized';
    }
  }
});
</script>
