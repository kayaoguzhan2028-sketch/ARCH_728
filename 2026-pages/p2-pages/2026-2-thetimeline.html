  .image-frame {

  /* img fills the entire frame — arrows are guaranteed to land on the image */
  .frame-img {
    position:absolute; inset:0;

  // Lightbox
  const lightbox    = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  document.getElementById('lightbox-close').addEventListener('click', () => lightbox.classList.remove('open'));
  lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.classList.remove('open'); });

  const viewer = document.getElementById('viewer');

  let items   = [];
  let current = 0;

  // DOM refs built once per century load
  let frameImg, arrowPrev, arrowNext, dotsStrip, imgName, imgCaption, imgRef;

  function nameFromFile(f) { return f.replace('.webp', ''); }

  function buildViewer() {
    viewer.innerHTML = '';

    // image frame
    const frame = document.createElement('div');
    frame.className = 'image-frame';

    arrowPrev = document.createElement('button');
    arrowPrev.className = 'arrow arrow-prev';
    arrowPrev.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`;

    frameImg = document.createElement('img');
    frameImg.className = 'frame-img';
    frameImg.addEventListener('click', () => {
      lightboxImg.src = frameImg.src;
      lightboxImg.alt = frameImg.alt;
      lightbox.classList.add('open');
    });

    arrowNext = document.createElement('button');
    arrowNext.className = 'arrow arrow-next';
    arrowNext.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;

    frame.appendChild(arrowPrev);
    frame.appendChild(frameImg);
    frame.appendChild(arrowNext);
    viewer.appendChild(frame);

    // dots
    dotsStrip = document.createElement('div');
    dotsStrip.className = 'dots-strip';
    viewer.appendChild(dotsStrip);

    // text block
    const textBlock = document.createElement('div');
    textBlock.className = 'text-block';

    imgName = document.createElement('span');
    imgName.className = 'img-name';

    imgCaption = document.createElement('p');
    imgCaption.className = 'img-caption';

    imgRef = document.createElement('a');
    imgRef.className = 'img-ref';
    imgRef.target = '_blank';
    imgRef.rel = 'noopener';

    textBlock.appendChild(imgName);
    textBlock.appendChild(imgCaption);
    textBlock.appendChild(imgRef);
    viewer.appendChild(textBlock);

    arrowPrev.addEventListener('click', () => { if (current > 0) goTo(current - 1); });
    arrowNext.addEventListener('click', () => { if (current < items.length - 1) goTo(current + 1); });
  }

  function renderDots() {
    dotsStrip.innerHTML = '';
    items.forEach((_, i) => {
      const dot = document.createElement('span');
      dot.className = 'dot' + (i === current ? ' active' : '');
      dot.addEventListener('click', () => goTo(i));
      dotsStrip.appendChild(dot);
    });
  }

  const preloadCache = {};
  function preload(file) {
    if (!preloadCache[file]) {
      const img = new Image();
      img.src = BASE + file;
      preloadCache[file] = img;
    }
  }

  function goTo(index) {
    current = index;
    const item = items[current];

    frameImg.src = BASE + item.file;
    frameImg.alt = nameFromFile(item.file);

    // silently preload next image so navigation feels instant
    if (items[current + 1]) preload(items[current + 1].file);

    imgName.textContent = nameFromFile(item.file);
    imgCaption.textContent = item.caption || '';
    imgCaption.style.display = item.caption ? 'block' : 'none';

    if (item.link) {
      imgRef.href = item.link;
      imgRef.textContent = item.link;
      imgRef.style.display = 'inline-flex';
    } else {
      imgRef.style.display = 'none';
    }

    arrowPrev.disabled = current === 0;
    arrowNext.disabled = current === items.length - 1;
    renderDots();
    viewer.scrollTop = 0;
  }

  function loadCentury(key) {
    items = IMAGES[key] || [];
    current = 0;

    if (!items.length) {
      viewer.innerHTML = '<div class="empty-wrap"><span class="empty-msg">No images yet</span></div>';
      return;
    }

    buildViewer();
    goTo(0);
  }

  document.addEventListener('keydown', e => {
    if (lightbox.classList.contains('open')) {
      if (e.key === 'Escape') lightbox.classList.remove('open');
      return;
    }
    if (!items.length) return;
    if (e.key === 'ArrowLeft'  && current > 0)               goTo(current - 1);
    if (e.key === 'ArrowRight' && current < items.length - 1) goTo(current + 1);
  });

  document.querySelectorAll('.century-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.century-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadCentury(btn.dataset.key);
    });
  });

  // Auto-open century from URL hash (e.g. #2020s)
  const hashKey = location.hash.replace('#', '');
  if (hashKey && IMAGES[hashKey]) {
    const targetBtn = document.querySelector(`.century-btn[data-key="${hashKey}"]`);
    if (targetBtn) targetBtn.classList.add('active');
    loadCentury(hashKey);
  }
</script>
</body>
</html>
