<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/webp" href="../../must-images/favicon/Mimfak.webp">
<title>Project 2026-6</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black:#0a0a0a; --white:#f5f2eb; --mid:#d4cebc; --accent:#c9b8a8; --border:rgba(245,242,235,0.1); --font:'Newsreader',Georgia,serif; }
  html,body { background:var(--black); color:var(--white); font-family:var(--font); min-height:100vh; height:100%; overflow:hidden; }

  nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 2.5rem; height:52px; border-bottom:1px solid var(--border); background:var(--black); }
  .nav-back { font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.6; transition:opacity 0.2s; }
  .nav-back:hover { opacity:1; }
  .nav-center-links { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; gap:1.6rem; }
  .nav-center-links a { font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.5; padding-bottom:0.3em; border-bottom:1px solid transparent; transition:opacity 0.2s,border-color 0.2s; white-space:nowrap; }
  .nav-center-links a:hover { opacity:1; }
  .nav-center-links a.active { opacity:1; border-bottom-color:var(--white); }

  .stage { position:fixed; inset:0; padding-top:52px; display:flex; align-items:center; justify-content:center; padding:6rem 2rem 2rem; }
  .interactive-image { position:relative; width:min(94%, calc(88vh * 1920 / 1080)); aspect-ratio:1920/1080; }
  .interactive-image img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }
  .timeline-hint { position:absolute; top:0.6rem; left:50%; transform:translateX(-50%); font-size:0.72rem; font-style:italic; letter-spacing:0.02em; opacity:0.45; pointer-events:none; white-space:nowrap; z-index:5; }

  .hotspot-overlay { position:absolute; inset:0; pointer-events:none; }
  .hotspot-overlay svg { width:100%; height:100%; display:block; }

  .hotspot-overlay.hover-layer path,
  .hotspot-overlay.hover-layer circle,
  .hotspot-overlay.hover-layer polygon,
  .hotspot-overlay.hover-layer rect { fill:var(--accent); opacity:0; pointer-events:fill; cursor:default; transition:opacity 0.25s ease; }
  .hotspot-overlay.hover-layer path:hover,
  .hotspot-overlay.hover-layer circle:hover,
  .hotspot-overlay.hover-layer polygon:hover,
  .hotspot-overlay.hover-layer rect:hover { opacity:0.3; }
  .hotspot-overlay.hover-layer line { stroke:var(--accent); stroke-width:100; stroke-opacity:0; pointer-events:stroke; cursor:default; transition:stroke-opacity 0.25s ease; }
  .hotspot-overlay.hover-layer line:hover { stroke-opacity:0.3; }

  .decade-hotspot { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; pointer-events:none; transition:opacity 0.25s ease; }
  .decade-hotspot.active-hover { opacity:0.5; }

  .legend-label { position:fixed; top:100px; right:2rem; max-width:320px; padding:0.8em 1.2em; border:1px solid var(--border); background:rgba(10,10,10,0.8); opacity:0; transform:translateY(-6px); transition:opacity 0.25s ease, transform 0.25s ease; pointer-events:none; z-index:60; }
  .legend-label.active { opacity:1; transform:translateY(0); }
  .legend-label h3 { font-size:0.78rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); margin-bottom:0.5em; font-weight:400; }
  .legend-label p { font-size:0.85rem; line-height:1.6; opacity:0.85; }

  .modal-overlay { position:fixed; inset:0; z-index:300; background:rgba(10,10,10,0.96); display:none; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal-close { position:absolute; top:1.5rem; right:1.5rem; width:42px; height:42px; border-radius:50%; background:rgba(245,242,235,0.06); border:1px solid var(--border); color:var(--white); font-size:1.5rem; line-height:1; font-family:var(--font); cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0.6; transition:opacity 0.2s,background 0.2s; }
  .modal-close:hover { opacity:1; background:rgba(245,242,235,0.14); }
  .modal-image { width:100%; max-width:1000px; max-height:88vh; overflow-y:auto; display:flex; flex-direction:column; align-items:center; gap:4rem; padding:4rem 1.5rem; }
  .modal-slide { display:flex; flex-direction:column; align-items:center; gap:1rem; width:100%; }
  .modal-slide img { max-width:100%; max-height:58vh; object-fit:contain; display:block; }
  .modal-gallery { width:100%; max-width:640px; display:flex; flex-direction:column; align-items:center; gap:1rem; }
  .modal-gallery-img-wrap { position:relative; width:100%; display:flex; align-items:center; justify-content:center; }
  .modal-gallery-img-wrap img { max-width:100%; max-height:54vh; object-fit:contain; display:block; }
  .modal-gallery-arrow { position:absolute; top:50%; transform:translateY(-50%); width:42px; height:42px; border-radius:50%; background:rgba(10,10,10,0.5); border:1px solid var(--border); color:var(--white); font-size:1.3rem; line-height:1; font-family:var(--font); cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0.6; transition:opacity 0.2s,background 0.2s; }
  .modal-gallery-arrow:hover { opacity:1; background:rgba(245,242,235,0.14); }
  .modal-gallery-arrow.prev { left:0.5rem; }
  .modal-gallery-arrow.next { right:0.5rem; }
  .modal-gallery-counter { font-size:0.78rem; letter-spacing:0.1em; opacity:0.45; }
  .modal-slide h2 { font-size:1.3rem; font-weight:400; letter-spacing:0.06em; color:var(--accent); }
  .modal-slide p { max-width:620px; font-size:1.1rem; line-height:1.85; text-align:center; white-space:pre-line; }
  .modal-slide .modal-links { display:flex; flex-direction:column; gap:0.4rem; align-items:center; }
  .modal-slide .modal-links a { font-size:1rem; color:var(--accent); opacity:0.8; text-decoration:none; word-break:break-all; }
  .modal-slide .modal-links a:hover { opacity:1; text-decoration:underline; }

  @media (max-width:720px) {
    html,body { overflow:auto; }
    .stage { position:static; padding:6rem 1rem 3rem; }
    .legend-label { left:1rem; right:1rem; text-align:center; }
    nav { padding:0 1rem; }
    .nav-center-links { position:static; left:auto; top:auto; transform:none; overflow-x:auto; -webkit-overflow-scrolling:touch; justify-content:flex-start; flex:1; margin:0 2.6rem 0 0.8rem; scrollbar-width:none; }
    .nav-center-links::-webkit-scrollbar { display:none; }
  }
  .home-btn { position:fixed; top:0.6rem; right:1rem; z-index:200; width:34px; height:34px; border-radius:50%; border:1px solid rgba(245,242,235,0.35); background:rgba(10,10,10,0.65); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; color:var(--white); text-decoration:none; opacity:0.65; transition:opacity 0.2s, border-color 0.2s; }
  .home-btn:hover { opacity:1; border-color:rgba(245,242,235,0.6); }
  .home-btn svg { width:15px; height:15px; display:block; }
  @media (max-width:640px) {
    .home-btn { top:0.5rem; right:0.6rem; width:30px; height:30px; }
    .home-btn svg { width:13px; height:13px; }
  }
</style>
</head>

<div class="stage">
  <div class="interactive-image">
    <img src="../../2026-images/2026-p6/3-the-timeline/timeline-1.webp" alt="The Timeline — Main Visual">
    <span class="timeline-hint">Explore the timeline with your cursor.</span>

    <div class="hotspot-overlay hover-layer" data-svg="../../2026-images/2026-p6/3-the-timeline/SVG/in-visibility.svg" data-label="(In)Visibility" data-desc="Change in soil's visibility."></div>
    <div class="hotspot-overlay hover-layer" data-svg="../../2026-images/2026-p6/3-the-timeline/SVG/alteration.svg" data-label="Alteration" data-desc="Changing the structure of the soil by removing the top soil."></div>
    <div class="hotspot-overlay hover-layer" data-svg="../../2026-images/2026-p6/3-the-timeline/SVG/decomposition.svg" data-label="Decomposition" data-desc="Brick to soil process."></div>
    <div class="hotspot-overlay hover-layer" data-svg="../../2026-images/2026-p6/3-the-timeline/SVG/dumping.svg" data-label="Dumping" data-desc="Waste and excavation dumping to the pits."></div>
    <div class="hotspot-overlay hover-layer" data-svg="../../2026-images/2026-p6/3-the-timeline/SVG/existing-water-volume.svg" data-label="Existing Water Volume" data-desc="Change in water through excavation pits."></div>
    <div class="hotspot-overlay hover-layer" data-svg="../../2026-images/2026-p6/3-the-timeline/SVG/extraction.svg" data-label="Extraction" data-desc="Excavation works in the valley of the factories."></div>
    <div class="hotspot-overlay hover-layer" data-svg="../../2026-images/2026-p6/3-the-timeline/SVG/recomposition.svg" data-label="Recomposition" data-desc="Soil to brick process."></div>

    <img class="decade-hotspot" src="../../2026-images/2026-p6/3-the-timeline/timeline-60lar.webp" alt="" data-decade="60lar">
    <img class="decade-hotspot" src="../../2026-images/2026-p6/3-the-timeline/timeline-90lar.webp" alt="" data-decade="90lar">
    <img class="decade-hotspot" src="../../2026-images/2026-p6/3-the-timeline/timeline-2020ler.webp" alt="" data-decade="2020ler">
    <img class="decade-hotspot" src="../../2026-images/2026-p6/3-the-timeline/timeline-30lar.webp" alt="" data-decade="30lar">
  </div>
</div>

<div class="legend-label" id="legend-label"></div>

<div class="modal-overlay" id="decade-modal">
  <button class="modal-close" id="modal-close" aria-label="Close">×</button>
  <div class="modal-image" id="modal-content"></div>
</div>

<script>
  const legendLabel = document.getElementById('legend-label');
  const decadeModal = document.getElementById('decade-modal');
  const modalContent = document.getElementById('modal-content');

  function positionLegendLabel(rect) {
    if (window.innerWidth <= 720) return;
    const gap = 14;
    const labelWidth = legendLabel.offsetWidth || 320;
    let left = rect.right + gap;
    let top = rect.top;
    if (left + labelWidth > window.innerWidth - 16) left = window.innerWidth - labelWidth - 16;
    if (top < 16) top = 16;
    legendLabel.style.left = left + 'px';
    legendLabel.style.right = 'auto';
    legendLabel.style.top = top + 'px';
  }

  function resetLegendLabelPosition() {
    legendLabel.style.left = '';
    legendLabel.style.right = '';
    legendLabel.style.top = '';
  }

  const TIMELINE_BASE = '../../2026-images/2026-p6/3-the-timeline/';

  const decadeContent = {
    '30lar': [
      {
        img: TIMELINE_BASE + 'timeline-slice1-pic1.webp',
        title: '1930s',
        caption: "Start of the first brick production in the valley. The solid brick production process was semi-handcrafted (harman tuğla). Clay was poured into molds, dried in the sun, and fired in kilns to become bricks or tiles.",
      },
      {
        img: TIMELINE_BASE + 'timeline-slice1-pic2.webp',
        caption: "Initially, the soil was relatively homogeneous. With the establishment of brick factories, small amounts of brick fragments and residues began to appear in the soil.",
      },
      {
        img: TIMELINE_BASE + 'timeline-slice1-pic3.webp',
        caption: "An old newspaper ad about bricks from İmrahor. 1931/12/19, Hakimiyeti Milliye, Page 8.",
      },
    ],
    '60lar': [
      {
        img: TIMELINE_BASE + 'timeline-slice2-pic1.webp',
        title: '1960s-1970s',
        caption: "17 brick factories were established between 1965 and 1976. Handmade production of solid bricks stopped and switched to cored bricks (blok tuğla). Heavy excavation and pond formation began in the valley.",
      },
      {
        img: TIMELINE_BASE + 'timeline-slice2-pic2.webp',
        caption: "During the 1970s, the structure of the soil started to change significantly with the start of the intense excavations.",
      },
      {
        img: TIMELINE_BASE + 'timeline-slice2-pic3.webp',
        caption: "An old news about the brick workers who did not receive their salary. 1966/07/14, Milliyet.",
      },
      {
        img: TIMELINE_BASE + 'timeline-1960s-1970s-comments-of-the-locals.webp',
        title: 'Comments of the Locals',
        caption: "G.M.: ''That's where we used to excavate for brickmaking, that's our pond.'' ¹\nF.A.: \"We used to catch a lot of fish in the small ponds around the old brick kilns. We'd cook them right by the stream and eat them there. They were full of bones, but the experience was something else.''²\nB.Ş.: \"In the 1980s, we used to catch a lot of fish in this stream. The ponds left behind by the brick kilns were full of fish.\"³",
        links: [
          'https://www.facebook.com/share/p/1DCvDxquUs/',
          'https://www.facebook.com/share/p/1BS7VGwqWe/',
          'https://www.facebook.com/share/p/1JPE2wu67Q/',
        ],
      },
    ],
    '90lar': [
      {
        img: TIMELINE_BASE + 'timeline-slice3-pic1.webp',
        title: '1990s-2000s',
        caption: "The factories closed down between 1996 and 1999 when their licenses were revoked. Waste dumping in the ponds highly increased. The natural structure of the valley has been damaged by the discarded waste of the brick factories and by the dumping of debris.",
      },
      {
        img: TIMELINE_BASE + 'timeline-slice3-pic2.webp',
        caption: "During the 1990s, the amount of brick debris present in the soil increased significantly.",
      },
      {
        gallery: [
          { img: TIMELINE_BASE + 'timeline-slice3-pic3.webp' },
          { img: TIMELINE_BASE + 'timeline-slice3-pic4.webp' },
          { img: TIMELINE_BASE + 'timeline-slice3-pic5.webp' },
        ],
      },
      {
        img: TIMELINE_BASE + 'timeline-slice3-pic6.webp',
        imgWidth: 80,
      },
    ],
    '2020ler': [
      {
        img: TIMELINE_BASE + 'timeline-slice4-pic1.webp',
        title: 'Today',
        caption: "Today, brick production has disappeared from İmrahor Valley. Following the closure of the last remaining factory only a few years ago, several abandoned industrial structures remain scattered across the valley. While production has ceased, its material legacy persists as an industrial residue embedded in the valley's soil.",
      },
      {
        img: TIMELINE_BASE + 'timeline-slice4-pic2.webp',
        caption: "Today, the soil contains dense brick residues mixed with excavation spoil and waste materials.",
      },
      {
        gallery: [
          { img: TIMELINE_BASE + 'timeline-slice4-pic3.webp', caption: "An abandoned factory in the valley." },
          { img: TIMELINE_BASE + 'timeline-slice4-pic4.webp', caption: "Noticeable changes in soil color and composition due to brick fragments." },
          { img: TIMELINE_BASE + 'timeline-slice4-pic5.webp', caption: "Dense accumulations of brick debris near the factory that most recently functioned (until the 2020s)." },
          { img: TIMELINE_BASE + 'timeline-slice4-pic6.webp', caption: "Soil or brick?" },
          { img: TIMELINE_BASE + 'timeline-slice4-pic7.webp', caption: "Remains of an abandoned factory." },
          { img: TIMELINE_BASE + 'timeline-slice4-pic8.webp', caption: "Soil containing dense brick residues." },
          { img: TIMELINE_BASE + 'timeline-slice4-pic9.webp', caption: "Soil containing dense brick residues." },
        ],
      },
    ],
  };

  function openDecadeModal(decade) {
    const slides = decadeContent[decade];
    if (!slides) return;

    modalContent.innerHTML = '';
    slides.forEach((slide) => {
      const slideEl = document.createElement('div');
      slideEl.className = 'modal-slide';

      if (slide.gallery) {
        const gallery = document.createElement('div');
        gallery.className = 'modal-gallery';

        const wrap = document.createElement('div');
        wrap.className = 'modal-gallery-img-wrap';
        const img = document.createElement('img');
        img.alt = '';
        const prev = document.createElement('button');
        prev.className = 'modal-gallery-arrow prev';
        prev.textContent = '‹';
        prev.setAttribute('aria-label', 'Previous');
        const next = document.createElement('button');
        next.className = 'modal-gallery-arrow next';
        next.textContent = '›';
        next.setAttribute('aria-label', 'Next');
        wrap.appendChild(prev);
        wrap.appendChild(img);
        wrap.appendChild(next);

        const caption = document.createElement('p');
        const counter = document.createElement('div');
        counter.className = 'modal-gallery-counter';

        let index = 0;
        const update = () => {
          const item = slide.gallery[index];
          img.src = item.img;
          caption.textContent = item.caption || '';
          counter.textContent = `${index + 1} / ${slide.gallery.length}`;
        };
        prev.addEventListener('click', () => {
          index = (index - 1 + slide.gallery.length) % slide.gallery.length;
          update();
        });
        next.addEventListener('click', () => {
          index = (index + 1) % slide.gallery.length;
          update();
        });
        update();

        gallery.appendChild(wrap);
        gallery.appendChild(caption);
        gallery.appendChild(counter);
        slideEl.appendChild(gallery);
      } else if (slide.img) {
        const img = document.createElement('img');
        img.src = slide.img;
        img.alt = '';
        if (slide.imgWidth) img.style.maxWidth = slide.imgWidth + '%';
        slideEl.appendChild(img);
      }

      if (slide.title) {
        const h2 = document.createElement('h2');
        h2.textContent = slide.title;
        slideEl.appendChild(h2);
      }

      if (slide.caption) {
        const p = document.createElement('p');
        p.textContent = slide.caption;
        slideEl.appendChild(p);
      }

      if (slide.links) {
        const linksEl = document.createElement('div');
        linksEl.className = 'modal-links';
        const superscripts = ['¹', '²', '³', '⁴', '⁵', '⁶', '⁷', '⁸', '⁹'];
        slide.links.forEach((url, i) => {
          const a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = `${superscripts[i] || (i + 1)} ${url}`;
          linksEl.appendChild(a);
        });
        slideEl.appendChild(linksEl);
      }

      modalContent.appendChild(slideEl);
    });

    modalContent.scrollTop = 0;
    decadeModal.classList.add('open');
  }

  document.getElementById('modal-close').addEventListener('click', () => {
    decadeModal.classList.remove('open');
  });

  document.querySelectorAll('.hotspot-overlay').forEach((overlay) => {
    fetch(overlay.dataset.svg)
      .then((res) => res.text())
      .then((svg) => {
        overlay.innerHTML = svg;

        const styleEl = overlay.querySelector('style');
        const hiddenClasses = new Set();
        if (styleEl) {
          (styleEl.textContent.match(/\.[\w-]+\s*\{[^}]*\}/g) || []).forEach((rule) => {
            if (/display\s*:\s*none/.test(rule)) hiddenClasses.add(rule.match(/\.([\w-]+)/)[1]);
          });
          styleEl.remove();
        }

        const shapes = overlay.querySelectorAll('path, circle, polygon, line');
        shapes.forEach((shape) => {
          if (hiddenClasses.has(shape.getAttribute('class'))) { shape.remove(); return; }
          shape.removeAttribute('class');
          shape.addEventListener('mouseenter', () => {
            legendLabel.innerHTML = `<h3>${overlay.dataset.label}</h3><p>${overlay.dataset.desc}</p>`;
            positionLegendLabel(shape.getBoundingClientRect());
            legendLabel.classList.add('active');
          });
          shape.addEventListener('mouseleave', () => {
            legendLabel.classList.remove('active');
          });
        });
      });
  });

  const decadeHotspots = Array.from(document.querySelectorAll('.decade-hotspot'));
  const interactiveImage = document.querySelector('.interactive-image');
  const hitCanvas = document.createElement('canvas');
  const hitCtx = hitCanvas.getContext('2d', { willReadFrequently: true });
  let activeDecadeImg = null;

  decadeHotspots.forEach((img) => {
    const readPixels = () => {
      hitCanvas.width = img.naturalWidth;
      hitCanvas.height = img.naturalHeight;
      hitCtx.clearRect(0, 0, hitCanvas.width, hitCanvas.height);
      hitCtx.drawImage(img, 0, 0);
      img._hitData = hitCtx.getImageData(0, 0, hitCanvas.width, hitCanvas.height).data;
      img._hitW = hitCanvas.width;
      img._hitH = hitCanvas.height;
    };
    if (img.complete && img.naturalWidth) readPixels();
    else img.addEventListener('load', readPixels);
  });

  function decadeAt(clientX, clientY) {
    const rect = interactiveImage.getBoundingClientRect();
    const xRatio = (clientX - rect.left) / rect.width;
    const yRatio = (clientY - rect.top) / rect.height;
    if (xRatio < 0 || yRatio < 0 || xRatio > 1 || yRatio > 1) return null;
    for (let i = decadeHotspots.length - 1; i >= 0; i--) {
      const img = decadeHotspots[i];
      if (!img._hitData) continue;
      const px = Math.floor(xRatio * img._hitW);
      const py = Math.floor(yRatio * img._hitH);
      if (px < 0 || py < 0 || px >= img._hitW || py >= img._hitH) continue;
      const alpha = img._hitData[(py * img._hitW + px) * 4 + 3];
      if (alpha > 10) return img;
    }
    return null;
  }

  const decadeLabels = {
    '30lar': '1930s',
    '60lar': '1960s–1970s',
    '90lar': '1990s–2000s',
    '2020ler': 'Today',
  };

  interactiveImage.addEventListener('mousemove', (e) => {
    const found = decadeAt(e.clientX, e.clientY);
    if (found !== activeDecadeImg) {
      if (activeDecadeImg) activeDecadeImg.classList.remove('active-hover');
      if (found) {
        found.classList.add('active-hover');
        resetLegendLabelPosition();
        legendLabel.innerHTML = `<h3>${decadeLabels[found.dataset.decade]}</h3><p>Click to view details.</p>`;
        legendLabel.classList.add('active');
      } else {
        legendLabel.classList.remove('active');
      }
      activeDecadeImg = found;
      interactiveImage.style.cursor = found ? 'pointer' : '';
    }
  });

  interactiveImage.addEventListener('mouseleave', () => {
    if (activeDecadeImg) activeDecadeImg.classList.remove('active-hover');
    activeDecadeImg = null;
    legendLabel.classList.remove('active');
    interactiveImage.style.cursor = '';
  });

  interactiveImage.addEventListener('click', (e) => {
    const found = decadeAt(e.clientX, e.clientY);
    if (found) openDecadeModal(found.dataset.decade);
  });
</script>
</body>
