<html lang="en">
<head>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black:#0a0a0a; --white:#f5f2eb; --mid:#d4cebc; --accent:#c9b8a8; --orange:#d97a3f; --border:rgba(245,242,235,0.1); --font:'Newsreader',Georgia,serif; }
  html,body { background:var(--black); color:var(--white); font-family:var(--font); min-height:100vh; }

  nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 2.5rem; height:52px; border-bottom:1px solid var(--border); background:var(--black); }
  .nav-back { font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.6; transition:opacity 0.2s; }
  .nav-back:hover { opacity:1; }
  .nav-center-links { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; gap:1.6rem; }
  .nav-center-links a { font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.5; padding-bottom:0.3em; border-bottom:1px solid transparent; transition:opacity 0.2s,border-color 0.2s; white-space:nowrap; }
  .nav-center-links a:hover { opacity:1; }
  .nav-center-links a.active { opacity:1; border-bottom-color:var(--white); }

  .wrap { max-width:1000px; margin:0 auto; padding:8rem 2rem 6rem; }
  .label { font-size:0.68rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--accent); opacity:0.7; margin-bottom:2rem; display:block; }
  h1 { font-size:clamp(2.2rem,5vw,3.8rem); font-weight:400; line-height:1.15; letter-spacing:0.04em; margin-bottom:0.8rem; color:var(--orange); }
  .subtitle { font-size:1.05rem; font-style:italic; color:var(--mid); margin-bottom:3.5rem; line-height:1.6; }
  .rule { border:none; border-top:1px solid var(--border); margin-bottom:3.5rem; }
  .body { font-size:1.1rem; line-height:1.95; opacity:0.82; }
  .body p { margin-bottom:1.6rem; }
  .body p:last-child { margin-bottom:0; }
  .body h2 { font-size:1.25rem; font-weight:400; margin:3rem 0 1rem; letter-spacing:0.04em; }
  .body blockquote { border-left:1px solid var(--accent); padding-left:1.4rem; margin:2.5rem 0; font-style:italic; opacity:0.75; }
  .body img { max-width:100%; margin:2.5rem 0; opacity:0.88; }

  .interactive-image { position:relative; width:100%; max-width:930px; margin:2.5rem auto; }
  .interactive-image img { width:100%; display:block; margin:0; opacity:0.9; cursor:pointer; }
  .hotspot-overlay { position:absolute; top:0; left:0; width:100%; height:100%; }
  .hotspot-zone { fill:var(--accent); opacity:0; pointer-events:fill; cursor:pointer; transition:opacity 0.25s ease; }
  .hotspot-zone:hover { opacity:0.25; }
  .hotspot-zone.active { opacity:0.35; }
  .hotspot-pulse { fill:none; stroke:var(--accent); stroke-width:22; opacity:1; pointer-events:none; transform-box:fill-box; transform-origin:center; animation:hotspot-pulse 2.2s ease-out infinite; }
  .hotspot-pulse.visited { animation:none; opacity:0; }
  @keyframes hotspot-pulse { 0% { transform:scale(0.75); opacity:1; } 100% { transform:scale(2.1); opacity:0; } }

  .timeline-result { display:none; flex-direction:column; gap:1.5rem; margin-top:3.5rem; padding-top:3rem; border-top:1px solid var(--border); scroll-margin-top:5rem; }
  .timeline-result.active { display:flex; }
  .timeline-result h3 { font-size:0.72rem; font-weight:400; letter-spacing:0.2em; text-transform:uppercase; color:var(--accent); opacity:0.7; margin:0 auto; max-width:620px; }
  .timeline-result img { max-width:620px; max-height:60vh; width:auto; display:block; margin:0 auto; opacity:0.92; cursor:pointer; }
  .timeline-result p { font-size:1.1rem; line-height:1.95; opacity:0.82; margin:0 auto; max-width:620px; }
  .meta { margin-top:5rem; padding-top:2rem; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:2.5rem; }
  .meta-item { display:flex; flex-direction:column; gap:0.3rem; }
  .meta-item dt { font-size:0.62rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--mid); opacity:0.5; }
  .meta-item dd { font-size:0.88rem; opacity:0.65; }

  .panel-overlay { position:fixed; inset:0; z-index:300; background:rgba(10,10,10,0.92); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.25s ease; }
  .panel-overlay.open { opacity:1; pointer-events:auto; }
  .panel-overlay img { max-width:90vw; max-height:90vh; display:block; }
  .panel-close { position:fixed; top:1.2rem; right:1.5rem; width:2.2rem; height:2.2rem; display:flex; align-items:center; justify-content:center; font-size:1.4rem; line-height:1; color:var(--white); background:none; border:1px solid var(--accent); cursor:pointer; opacity:0.7; transition:opacity 0.2s ease,background 0.2s ease,color 0.2s ease; }
  .panel-close:hover { opacity:1; background:var(--accent); color:var(--black); }

  #expand-tooltip { position:fixed; background:var(--black); color:var(--white); font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; white-space:nowrap; padding:0.5em 0.9em; border:1px solid rgba(245,242,235,0.25); opacity:0; pointer-events:none; transition:opacity 0.15s; z-index:400; transform:translate(-50%,-140%); }
  #expand-tooltip.show { opacity:1; }
  @media (max-width:640px) {
    nav { padding:0 1rem; }
    .nav-center-links { position:static; left:auto; top:auto; transform:none; overflow-x:auto; -webkit-overflow-scrolling:touch; justify-content:flex-start; flex:1; margin:0 2.6rem 0 0.8rem; scrollbar-width:none; }
    .nav-center-links::-webkit-scrollbar { display:none; }
    .wrap { padding-left:1.4rem; padding-right:1.4rem; }
  }
  .home-btn { position:fixed; top:0.6rem; right:1rem; z-index:200; width:34px; height:34px; border-radius:50%; border:1px solid rgba(245,242,235,0.35); background:rgba(10,10,10,0.65); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; color:var(--white); text-decoration:none; opacity:0.65; transition:opacity 0.2s, border-color 0.2s; }
  .home-btn:hover { opacity:1; border-color:rgba(245,242,235,0.6); }
  .home-btn svg { width:15px; height:15px; display:block; }
  @media (max-width:640px) {
    .home-btn { top:0.5rem; right:0.6rem; width:30px; height:30px; }
    .home-btn svg { width:13px; height:13px; }
  }
</style>

<div class="wrap">
  <h1>Timeline</h1>
  <hr class="rule">
  <div class="body">

    <div class="interactive-image">
      <img src="../../2026-images/2026-p5/02-Timeline/timeline.webp" alt="Reverse section timeline">
      <svg class="hotspot-overlay" viewBox="0 0 5303 850" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <circle class="hotspot-pulse" cx="164.74" cy="485.93" r="30.84" style="animation-delay:0s;"/>
        <circle class="hotspot-pulse" cx="1121.39" cy="485.93" r="30.84" style="animation-delay:0.5s;"/>
        <circle class="hotspot-pulse" cx="2458.85" cy="487.93" r="30.84" style="animation-delay:1s;"/>
        <circle class="hotspot-zone" cx="164.74" cy="485.93" r="30.84"/>
        <circle class="hotspot-zone" cx="1121.39" cy="485.93" r="30.84"/>
        <circle class="hotspot-zone" cx="2458.85" cy="487.93" r="30.84"/>
      </svg>
    </div>

    <div class="timeline-result" id="timeline-result">
      <h3 id="timeline-result-title"></h3>
      <img id="timeline-result-img-top" src="" alt="">
      <p id="timeline-result-text"></p>
      <img id="timeline-result-img-bottom" src="" alt="">
    </div>

  </div>
  <dl class="meta">
    <div class="meta-item"><dt>Dönem</dt><dd>Spring 2026</dd></div>
  </dl>

<div class="panel-overlay" id="panel-overlay">
  <button class="panel-close" id="panel-close" aria-label="Close">×</button>
  <img id="panel-img" src="" alt="">
</div>

<div id="expand-tooltip">Click To Expand</div>

<script>
  const timelineData = [
    { imgTop: '../../2026-images/2026-p5/02-Timeline/current-up.webp', imgBottom: '../../2026-images/2026-p5/02-Timeline/current-bottom.webp', title: 'Initiation Phase', text: 'In the first years after abandonment, the carbonation process began in the reinforced concrete structural elements, and due to the effects of rain and groundwater, calcium components in the concrete seeped into the surrounding soil, causing localized alkalization. Although visible deterioration in the building materials was limited during this period, the weakening of the protective concrete layer initiated the initial stages of corrosion in the reinforcing steel, and the chemical interaction between the structure and the soil gradually increased.' },
    { imgTop: '../../2026-images/2026-p5/02-Timeline/stage-1-up.webp', imgBottom: '../../2026-images/2026-p5/02-Timeline/stage-1-bottom.webp', title: 'Activation Phase', text: 'During this phase, the structure transitions from a completely dormant state to an "activation" process where environmental impacts intensify and material degradation accelerates. Cracks deepen in the concrete surfaces, reinforcement corrosion becomes more visible, and chemical components carried by rainwater spread over a wider area in the soil. In this process, the structure ceases to be merely a physical remnant, it expands its spatial impact by establishing an active exchange of substances with the surrounding soil system.' },
    { imgTop: '../../2026-images/2026-p5/02-Timeline/stage-2-up.webp', imgBottom: '../../2026-images/2026-p5/02-Timeline/stage-2-bottom.webp', title: 'Fragmentation Phase', text: 'At this stage, the structure undergoes a transformation process where it loses a significant degree of structural integrity, and disintegration becomes permanent. The load-bearing systems weaken considerably, the concrete masses disintegrate into brittle blocks, and the reinforcing elements are completely exposed and rapidly corrode. Atmospheric effects and water infiltration, along with continuous disintegration of the material, cause it to mix with the surrounding soil. In this process, the structure integrates into the environmental system not as a stable form, but as an expanding debris field and a heterogeneous material distribution.' }
  ];

  const timelineResult = document.getElementById('timeline-result');
  const timelineResultImgTop = document.getElementById('timeline-result-img-top');
  const timelineResultImgBottom = document.getElementById('timeline-result-img-bottom');
  const timelineResultTitle = document.getElementById('timeline-result-title');
  const timelineResultText = document.getElementById('timeline-result-text');
  const hotspotZones = document.querySelectorAll('.hotspot-zone');
  const hotspotPulses = document.querySelectorAll('.hotspot-pulse');

  const panelOverlay = document.getElementById('panel-overlay');
  const panelImg     = document.getElementById('panel-img');

  function openPanel(src) {
    panelImg.src = src;
    panelOverlay.classList.add('open');
  }
  document.getElementById('panel-close').addEventListener('click', () => panelOverlay.classList.remove('open'));
  panelOverlay.addEventListener('click', e => { if (e.target === panelOverlay) panelOverlay.classList.remove('open'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') panelOverlay.classList.remove('open'); });

  document.querySelectorAll('.interactive-image img').forEach(img => {
    img.addEventListener('click', () => openPanel(img.src));
  });
  document.addEventListener('click', e => {
    if (e.target.matches('.timeline-result img')) openPanel(e.target.src);
  });

  const expandTooltip = document.getElementById('expand-tooltip');
  document.addEventListener('mouseenter', e => {
    if (e.target.matches && e.target.matches('.interactive-image img, .timeline-result img')) {
      expandTooltip.classList.add('show');
    }
  }, true);
  document.addEventListener('mousemove', e => {
    if (e.target.matches && e.target.matches('.interactive-image img, .timeline-result img')) {
      expandTooltip.style.left = e.clientX + 'px';
      expandTooltip.style.top = e.clientY + 'px';
    }
  });
  document.addEventListener('mouseleave', e => {
    if (e.target.matches && e.target.matches('.interactive-image img, .timeline-result img')) {
      expandTooltip.classList.remove('show');
    }
  }, true);

  hotspotZones.forEach((zone, i) => {
    zone.addEventListener('click', () => {
      timelineResultTitle.textContent = timelineData[i].title;
      timelineResultText.textContent = timelineData[i].text;
      timelineResult.classList.add('active');
      hotspotZones.forEach((z, j) => z.classList.toggle('active', j === i));
      hotspotPulses[i].classList.add('visited');

      const scrollToResult = () => timelineResult.scrollIntoView({ behavior: 'smooth', block: 'start' });
      timelineResultImgTop.onload = scrollToResult;
      timelineResultImgTop.src = timelineData[i].imgTop;
      timelineResultImgBottom.src = timelineData[i].imgBottom;
      if (timelineResultImgTop.complete) scrollToResult();
    });
  });
</script>
</body>
