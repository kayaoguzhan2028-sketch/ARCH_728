<title>2027 — ARCH 728</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root { --black:#0a0a0a; --white:#f5f2eb; --mid:#d4cebc; --border:rgba(245,242,235,0.1); --font:'EB Garamond',Georgia,serif; }
  html,body { width:100%; background:var(--black); color:var(--white); font-family:var(--font); }
  .hero-screen { position:relative; width:100%; height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .hero-content { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .hero-eyebrow { font-size:0.72rem; letter-spacing:0.22em; text-transform:uppercase; opacity:0.35; margin-bottom:1.2rem; }
  .hero-title { font-size:clamp(4rem,14vw,10rem); font-weight:600; letter-spacing:0.12em; text-transform:uppercase; line-height:1; color:var(--white); margin-bottom:0.6rem; }
  .hero-subtitle { font-size:clamp(0.9rem,2vw,1.15rem); font-style:italic; color:var(--mid); letter-spacing:0.04em; margin-bottom:3rem; }
  .project-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; width:min(480px,90vw); }
  .btn-project { display:flex; align-items:center; justify-content:center; height:52px; border:1px solid rgba(245,242,235,0.35); color:var(--white); font-family:var(--font); font-size:0.88rem; letter-spacing:0.2em; text-decoration:none; position:relative; overflow:hidden; transition:border-color 0.3s; }
  .btn-project::before { content:''; position:absolute; inset:0; background:var(--white); transform:translateY(101%); transition:transform 0.32s cubic-bezier(0.4,0,0.2,1); z-index:0; }
  .btn-project span { position:relative; z-index:1; transition:color 0.32s; }
  .btn-project:hover { border-color:var(--white); }
  .btn-project:hover::before { transform:translateY(0); }
  .btn-project:hover span { color:var(--black); }
  .scroll-hint { position:absolute; bottom:2rem; left:50%; transform:translateX(-50%); font-size:0.65rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--white); opacity:0.2; z-index:1; }
  .nav-back { position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:0 2.5rem; height:52px; border-bottom:1px solid var(--border); background:rgba(10,10,10,0.8); backdrop-filter:blur(6px); }
  .nav-back a { font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.5; transition:opacity 0.2s; }
  .nav-back a:hover { opacity:1; }
  .nav-back-tag { font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; opacity:0.2; }
  footer { border-top:1px solid var(--border); padding:2rem 2.5rem; text-align:center; font-size:0.78rem; opacity:0.35; letter-spacing:0.05em; line-height:2; }
</style>
</head>
