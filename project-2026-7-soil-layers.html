<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soil Layers — ARCH 728</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root { --black:#0a0a0a; --white:#f5f2eb; --mid:#d4cebc; --accent:#c9b8a8; --border:rgba(245,242,235,0.1); --font:'EB Garamond',Georgia,serif; }
  html,body { background:var(--black); color:var(--white); font-family:var(--font); min-height:100vh; }
  nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 2.5rem; height:52px; border-bottom:1px solid var(--border); background:var(--black); }
  .nav-back { font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.6; transition:opacity 0.2s; }
  .nav-back:hover { opacity:1; }
  .nav-tag { font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; opacity:0.25; border:1px solid rgba(245,242,235,0.2); padding:0.2em 0.7em; }
  .wrap { max-width:620px; margin:0 auto; padding:8rem 2rem 6rem; }
  .label { font-size:0.68rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--accent); opacity:0.7; margin-bottom:2rem; display:block; }
  h1 { font-size:clamp(2.2rem,5vw,3.8rem); font-weight:400; line-height:1.15; letter-spacing:0.04em; margin-bottom:0.8rem; }
  .subtitle { font-size:1.05rem; font-style:italic; color:var(--mid); margin-bottom:3.5rem; line-height:1.6; }
  .rule { border:none; border-top:1px solid var(--border); margin-bottom:3.5rem; }
  .body { font-size:1.1rem; line-height:1.95; opacity:0.82; }
  .body p { margin-bottom:1.6rem; }
  .body p:last-child { margin-bottom:0; }
  .body h2 { font-size:1.25rem; font-weight:400; margin:3rem 0 1rem; letter-spacing:0.04em; }
  .body blockquote { border-left:1px solid var(--accent); padding-left:1.4rem; margin:2.5rem 0; font-style:italic; opacity:0.75; }
  .body img { max-width:100%; margin:2.5rem 0; opacity:0.88; }
  /* Kolaj stack */
  .kolaj-wrap { margin:0 0 3.5rem; }
  .kolaj-stack { position:relative; width:100%; line-height:0; }
  .kolaj-img { display:block; width:100%; height:auto; -webkit-user-drag:none; user-select:none; }
  .kolaj-img:not(:first-child) { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
  .kolaj-slider { padding:1.2rem 0 0; }
  .kolaj-track { position:relative; height:1px; background:rgba(245,242,235,0.15); cursor:pointer; }
  .kolaj-fill { position:absolute; top:0; left:0; height:100%; width:0%; background:rgba(245,242,235,0.45); pointer-events:none; }
  .kolaj-tick { position:absolute; top:-4px; transform:translateX(-50%); width:1px; height:9px; background:rgba(245,242,235,0.35); pointer-events:none; }
  .kolaj-thumb { position:absolute; top:50%; left:0%; transform:translate(-50%,-50%); width:9px; height:9px; border-radius:50%; background:var(--white); cursor:grab; transition:transform 0.12s ease; }
  .kolaj-thumb.dragging { cursor:grabbing; transform:translate(-50%,-50%) scale(1.35); }
  .meta { margin-top:5rem; padding-top:2rem; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:2.5rem; }
  .meta-item { display:flex; flex-direction:column; gap:0.3rem; }
  .meta-item dt { font-size:0.62rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--mid); opacity:0.5; }
  .meta-item dd { font-size:0.88rem; opacity:0.65; }
</style>
</head>
<body>
<nav>
  <a href="project-2026-7.html" class="nav-back">← Project</a>
  <span class="nav-tag">Field Report</span>
</nav>
<div class="wrap">
  <span class="label">ARCH 728 · Spring 2026</span>
  <h1>Soil Layers</h1>
  <hr class="rule">

  <div class="kolaj-wrap">
    <div class="kolaj-stack">
      <img class="kolaj-img" src="2026-images/2026-p7/KOLAJ 1.webp" alt="Kolaj 1">
      <img class="kolaj-img" src="2026-images/2026-p7/KOLAJ 2.webp" alt="Kolaj 2">
      <img class="kolaj-img" src="2026-images/2026-p7/KOLAJ 3.webp" alt="Kolaj 3">
      <img class="kolaj-img" src="2026-images/2026-p7/KOLAJ 4.webp" alt="Kolaj 4">
    </div>
    <div class="kolaj-slider">
      <div class="kolaj-track">
        <div class="kolaj-fill"></div>
        <div class="kolaj-tick" style="left:33.33%"></div>
        <div class="kolaj-tick" style="left:66.66%"></div>
        <div class="kolaj-thumb"></div>
      </div>
    </div>
  </div>

  <div class="body"></div>

  <dl class="meta">
    <div class="meta-item"><dt>Dönem</dt><dd>Spring 2026</dd></div>
  </dl>
</div>
<script>
(function(){
  const imgs  = document.querySelectorAll('.kolaj-img');
  const track = document.querySelector('.kolaj-track');
  const thumb = document.querySelector('.kolaj-thumb');
  const fill  = document.querySelector('.kolaj-fill');
  const STOPS = [0, 1/3, 2/3, 1];
  const SNAP  = 0.04;
  let val = 0, dragging = false;

  function setVal(v) {
    v = Math.max(0, Math.min(1, v));
    for (let i = 1; i < STOPS.length - 1; i++) {
      if (Math.abs(v - STOPS[i]) < SNAP) { v = STOPS[i]; break; }
    }
    val = v;
    thumb.style.left = (val * 100) + '%';
    fill.style.width  = (val * 100) + '%';
    imgs[0].style.opacity = Math.max(0, 1 - val * 3);
    imgs[1].style.opacity = Math.max(0, 1 - Math.abs(val - 1/3) * 3);
    imgs[2].style.opacity = Math.max(0, 1 - Math.abs(val - 2/3) * 3);
    imgs[3].style.opacity = Math.max(0, (val - 2/3) * 3);
  }

  function posFromEvent(e) {
    const r = track.getBoundingClientRect();
    return (e.clientX - r.left) / r.width;
  }

  track.addEventListener('mousedown', e => { dragging = true; thumb.classList.add('dragging'); setVal(posFromEvent(e)); e.preventDefault(); });
  document.addEventListener('mousemove', e => { if (!dragging) return; setVal(posFromEvent(e)); });
  document.addEventListener('mouseup', () => { dragging = false; thumb.classList.remove('dragging'); });
  track.addEventListener('touchstart', e => { dragging = true; setVal(posFromEvent(e.touches[0])); e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', e => { if (!dragging) return; setVal(posFromEvent(e.touches[0])); }, { passive: true });
  document.addEventListener('touchend', () => { dragging = false; });

  setVal(0);
})();
</script>
</body>
</html>
