<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/webp" href="2026-images/favicon/06Başkent.webp">
<title>The Timeline — Hıdırlık Tepe — ARCH 728</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black:#0a0a0a; --white:#f5f2eb; --mid:#d4cebc; --accent:#c9b8a8; --border:rgba(245,242,235,0.1); --font:'EB Garamond',Georgia,serif; }
  html,body { background:var(--black); color:var(--white); font-family:var(--font); height:100%; overflow:hidden; }

  nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 2.5rem; height:52px; border-bottom:1px solid var(--border); background:var(--black); }
  .nav-back { font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.6; transition:opacity 0.2s; }
  .nav-back:hover { opacity:1; }
  .nav-tag { font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; opacity:0.25; border:1px solid rgba(245,242,235,0.2); padding:0.2em 0.7em; }

  .century-list {
    position:fixed; top:52px; left:0; bottom:0; width:160px;
    display:flex; flex-direction:column; justify-content:center; gap:0.55rem;
    padding:0 0 0 3rem; z-index:10;
    border-right:1px solid var(--border);
  }

  .century-btn {
    background:none; border:none; color:var(--white); font-family:var(--font);
    font-size:0.72rem; letter-spacing:0.2em; text-transform:uppercase;
    text-align:left; cursor:pointer; opacity:0.25; transition:opacity 0.2s; padding:0.15rem 0;
  }
  .century-btn:hover { opacity:0.65; }
  .century-btn.active { opacity:1; }

  .image-panel {
    position:fixed; top:52px; left:160px; right:0; bottom:0;
    overflow-y:auto; padding:3.5rem 5rem 5rem;
  }
  .image-panel::-webkit-scrollbar { width:4px; }
  .image-panel::-webkit-scrollbar-track { background:transparent; }
  .image-panel::-webkit-scrollbar-thumb { background:rgba(245,242,235,0.12); }

  .image-entry { margin-bottom:3.5rem; }
  .image-year {
    font-size:0.62rem; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--accent); opacity:0.6; margin-bottom:0.8rem; display:block;
  }
  .image-entry img { max-width:100%; display:block; opacity:0.88; }

  .panel-empty {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:0.68rem; letter-spacing:0.2em; text-transform:uppercase; opacity:0.18;
  }
</style>
</head>
<body>

<nav>
  <a href="project-2026-2.html" class="nav-back">← Hıdırlık Tepe</a>
  <span class="nav-tag">The Timeline</span>
</nav>

<div class="century-list" id="century-list">
  <button class="century-btn" data-key="1400s">1400's</button>
  <button class="century-btn" data-key="1500s">1500's</button>
  <button class="century-btn" data-key="1700s">1700's</button>
  <button class="century-btn" data-key="1800s">1800's</button>
  <button class="century-btn" data-key="1900s">1900's</button>
  <button class="century-btn" data-key="2000s">2000's</button>
  <button class="century-btn" data-key="2010s">2010's</button>
  <button class="century-btn" data-key="2020s">2020's</button>
</div>

<div class="image-panel" id="image-panel">
  <span class="panel-empty" id="panel-empty">Select a century</span>
</div>

<script>
  const BASE = '2026-images/2026-p2/thetimeline/';

  const IMAGES = {
    '1400s': ['timeline-1400s-01-1402.webp'],
    '1500s': ['timeline-1500s-01.webp'],
    '1700s': ['timeline-1700s-01.webp','timeline-1700s-02.webp','timeline-1700s-03-1714.webp','timeline-1700s-04-1717.webp','timeline-1700s-05-1727.webp'],
    '1800s': ['timeline-1800s-01-1839.webp','timeline-1800s-02-1889.webp','timeline-1800s-03.webp','timeline-1800s-04.webp'],
    '1900s': ['timeline-1900s-01-1924.webp','timeline-1900s-02-1926.webp','timeline-1900s-03-1928.webp','timeline-1900s-04.webp','timeline-1900s-05-1932.webp','timeline-1900s-06-1932.webp','timeline-1900s-07-1933.webp','timeline-1900s-08-1937.webp','timeline-1900s-09-1942.webp','timeline-1900s-10-1944.webp','timeline-1900s-11-1944.webp','timeline-1900s-12-1944.webp','timeline-1900s-13-1952.webp','timeline-1900s-14.webp','timeline-1900s-15-1976.webp','timeline-1900s-16-1984.webp','timeline-1900s-17-1984.webp','timeline-1900s-18-1984.webp','timeline-1900s-19.webp'],
    '2000s': ['timeline-2000s-01.webp','timeline-2000s-02-2002.webp','timeline-2000s-03-2007.webp','timeline-2000s-04-2009.webp','timeline-2000s-05-2012.webp','timeline-2000s-06-2016.webp','timeline-2000s-07-2017.webp','timeline-2000s-08-2019.webp','timeline-2000s-09-2023.webp','timeline-2000s-10-2026.webp'],
    '2010s': [],
    '2020s': ['timeline-2020s-01-2023.webp','timeline-2020s-02-2023.webp','timeline-2020s-03-2023.webp','timeline-2020s-04-2023.webp','timeline-2020s-05-2025.webp','timeline-2020s-06-2025.webp'],
  };

  function extractYear(filename) {
    const m = filename.match(/-(\d{4})\.webp$/);
    return m ? m[1] : null;
  }

  const panel = document.getElementById('image-panel');
  const empty = document.getElementById('panel-empty');
  const buttons = document.querySelectorAll('.century-btn');

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const key = btn.dataset.key;
      const files = IMAGES[key] || [];

      panel.innerHTML = '';
      panel.scrollTop = 0;

      if (!files.length) {
        const msg = document.createElement('span');
        msg.className = 'panel-empty';
        msg.textContent = 'No images yet';
        panel.appendChild(msg);
        return;
      }

      files.forEach(filename => {
        const entry = document.createElement('div');
        entry.className = 'image-entry';

        const year = extractYear(filename);
        if (year) {
          const lbl = document.createElement('span');
          lbl.className = 'image-year';
          lbl.textContent = year;
          entry.appendChild(lbl);
        }

        const img = document.createElement('img');
        img.src = BASE + filename;
        img.alt = filename.replace('.webp', '');
        entry.appendChild(img);

        panel.appendChild(entry);
      });
    });
  });
</script>
</body>
</html>
