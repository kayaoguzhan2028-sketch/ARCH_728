  <g id="timeline-text">
    <text class="tl-year" x="73.014" y="96.0" dominant-baseline="central" text-anchor="start">1953</text>
    <text class="tl-year" x="233" y="156.07" dominant-baseline="central" text-anchor="end">1956</text>
    <text class="tl-year" x="73.014" y="298.31" dominant-baseline="central" text-anchor="start">1967</text>
    <text class="tl-year" x="233" y="393.99" dominant-baseline="central" text-anchor="end">1976</text>
    <text class="tl-year" x="74.014" y="526.01" dominant-baseline="central" text-anchor="start">1979</text>
    <text class="tl-year" x="233" y="652.51" dominant-baseline="central" text-anchor="end">2000</text>
    <text class="tl-year" x="73.014" y="806.2" dominant-baseline="central" text-anchor="start">2025</text>

    <foreignObject x="19.878" y="108.828" width="132.122" height="132.122">
      <div xmlns="http://www.w3.org/1999/xhtml" class="tl-text tl-right">
        <p class="tl-title">1953 – Discovery of Lignite Reserves</p>
        <p>The story of Çayırhan’s mining industry began in 1953–1954 when contractor Mustafa Murtazaoğlu, while constructing a bridge on the Ankara–Nallıhan road, accidentally discovered lignite deposits. He subsequently obtained exploration and operating licenses and initiated small-scale mining activities in the area.<sup>1</sup></p>
      </div>
    </foreignObject>

    <foreignObject x="155" y="169.89" width="132.125" height="132.122">
      <div xmlns="http://www.w3.org/1999/xhtml" class="tl-text tl-left">
        <p class="tl-title">1956 – The Impact of Sarıyar Dam</p>
        <p>The opening of the Sarıyar Dam in 1956 submerged a significant portion of the village’s agricultural land and settlement area. At the same time, the growing mining industry introduced as a new economic opportunity and transformed local livelihoods.<sup>1</sup></p>
      </div>
    </foreignObject>

    <foreignObject x="19.878" y="311.368" width="132.122" height="132.122">
      <div xmlns="http://www.w3.org/1999/xhtml" class="tl-text tl-right">
        <p class="tl-title">1967 – State-Led Mining Operations</p>
        <p>In 1967, the mining enterprise was acquired by the Turkish Coal Enterprises (TKİ). The establishment of the Central Anatolian Lignite Çayırhan Operation marked the beginning of more organised, large-scale, and efficient mining activities.<sup>1</sup></p>
      </div>
    </foreignObject>

    <foreignObject x="155" y="407.844" width="132.125" height="132.125">
      <div xmlns="http://www.w3.org/1999/xhtml" class="tl-text tl-left">
        <p class="tl-title">1976 – Municipal Status and Power Plant Development</p>
        <p>Çayırhan was granted municipal status in 1976. On November 14 of the same year, construction began on the Çayırhan Thermal Power Plant. Completed in 1978, the facility has since undergone several expansions and remains one of the region’s key industrial assets.<sup>2</sup></p>
      </div>
    </foreignObject>

    <foreignObject x="19.875" y="539.969" width="132.125" height="132.125">
      <div xmlns="http://www.w3.org/1999/xhtml" class="tl-text tl-right">
        <p class="tl-title">1979 – Emergence of an Industrial Center</p>
        <p>With the thermal power plant becoming fully operational, Çayırhan experienced rapid growth. What had once been a small settlement evolved into an important mining and energy production center.<sup>2</sup></p>
      </div>
    </foreignObject>

    <foreignObject x="155" y="665.094" width="132.125" height="132.125">
      <div xmlns="http://www.w3.org/1999/xhtml" class="tl-text tl-left">
        <p class="tl-title">2000 – Privatization Process</p>
        <p>After decades of state operation, the Çayırhan Thermal Power Plant became the first thermal power plant in Türkiye to be transferred to the private sector.<sup>3</sup> In 2000, operational rights were transferred to Park Termik, a company owned by Turgay Ciner. Upon the expiration of the 20-year Operating Rights Transfer Agreement on June 30, 2020, the facility returned to state control.<sup>4</sup></p>
      </div>
    </foreignObject>

    <foreignObject x="19.878" y="820.558" width="132.122" height="132.122">
      <div xmlns="http://www.w3.org/1999/xhtml" class="tl-text tl-right">
        <p class="tl-title">2025 – New Operating Agreement</p>
        <p>In 2025, Akçadağ İnşaat Enerji Madencilik A.Ş. won the tender to operate the Çayırhan Thermal Power Plant and Mining Site. The company will hold operating rights until 2059.<sup>5</sup></p>
      </div>
    </foreignObject>
  </g>
</svg>
