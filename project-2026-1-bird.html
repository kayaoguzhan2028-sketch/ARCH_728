<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/webp" href="must-images/favicon/06Başkent.webp">
<title>Bird — Çayırhan Ash Lake — ARCH 728</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black:#0a0a0a; --white:#f5f2eb; --mid:#d4cebc; --accent:#c9b8a8; --border:rgba(245,242,235,0.1); --font:'EB Garamond',Georgia,serif; }
  html,body { background:var(--black); color:var(--white); font-family:var(--font); min-height:100vh; }

  nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 2.5rem; height:52px; border-bottom:1px solid var(--border); background:var(--black); }
  .nav-back { font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white); text-decoration:none; opacity:0.6; transition:opacity 0.2s; }
  .nav-back:hover { opacity:1; }
  .nav-tag { font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; opacity:0.25; border:1px solid rgba(245,242,235,0.2); padding:0.2em 0.7em; }
  .nav-title { position:absolute; left:50%; transform:translateX(-50%); font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; opacity:0.55; pointer-events:none; }

  .img-stage { position:relative; width:100%; height:calc(100vh - 52px); margin-top:52px; background:var(--black); overflow:hidden; }
  .img-stage > img { width:100%; height:100%; object-fit:contain; display:block; }
  .svg-layer { position:absolute; pointer-events:none; overflow:visible; }
  .overlay-img { opacity:0; transition:filter 0.3s ease, opacity 0.2s ease; cursor:pointer; }
  .overlay-img.hover { opacity:1; filter:drop-shadow(0 0 6px rgba(245,220,140,0.55)); }
  .overlay-img.active { opacity:1; filter:drop-shadow(0 0 14px rgba(245,220,140,1)) drop-shadow(0 0 32px rgba(245,200,80,0.7)); }

  .wrap { max-width:960px; margin:0 auto; padding:5rem 2rem 8rem; }
  .sec { margin-bottom:6rem; }
  .sec-head { font-size:0.62rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--accent); opacity:0.6; padding-top:2rem; border-top:1px solid var(--border); margin-bottom:2.5rem; display:block; }
  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:2.5rem; align-items:start; }
  .three-col { display:grid; grid-template-columns:1fr 1fr 1fr; gap:1.5rem; }
  .fig img { width:100%; height:auto; display:block; margin:0; }
  figcaption { font-size:0.56rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--mid); opacity:0.4; margin-top:0.5rem; }
  .sec-text { font-size:0.95rem; line-height:1.9; opacity:0.7; }
  .sec-text p { margin-bottom:1rem; }
  @media (max-width:680px) { .two-col,.three-col { grid-template-columns:1fr; } }
  .body { font-size:1.1rem; line-height:1.95; }
  .body p { margin-bottom:1.6rem; }
  .body p:last-child { margin-bottom:0; }
  .body h2 { font-size:1.25rem; font-weight:400; margin:3rem 0 1rem; letter-spacing:0.04em; }
  .body blockquote { border-left:1px solid var(--accent); padding-left:1.4rem; margin:2.5rem 0; font-style:italic; opacity:0.75; }
  .body img { max-width:100%; margin:2.5rem 0; }
  .meta { margin-top:5rem; padding-top:2rem; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:2.5rem; }
  .meta-item { display:flex; flex-direction:column; gap:0.3rem; }
  .meta-item dt { font-size:0.62rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--mid); opacity:0.5; }
  .meta-item dd { font-size:0.88rem; opacity:0.65; }
</style>
</head>
<body>
<nav>
  <a href="project-2026-1.html" class="nav-back">← Çayırhan Ash Lake</a>
  <span class="nav-title">Bird</span>
  <span class="nav-tag">Field Report</span>
</nav>

<div class="img-stage">
  <img src="2026-images/2026-p1/bird/birdmigrationroute.webp" alt="Bird Migration Route" fetchpriority="high" id="main-img">
  <div class="svg-layer" id="svg-layer"></div>
</div>

<div class="wrap">
  <div class="body">

    <div class="sec">
      <span class="sec-head">Section</span>
      <div class="sec-text"><p></p></div>
    </div>

    <div class="sec">
      <span class="sec-head">References</span>
      <div class="sec-text"><p></p></div>
    </div>

  </div>
  <dl class="meta">
    <div class="meta-item"><dt>Dönem</dt><dd>Spring 2026</dd></div>
  </dl>
</div>

<script>
  const BASE    = '2026-images/2026-p1/bird/';
  const mainImg = document.getElementById('main-img');
  const stage   = document.querySelector('.img-stage');
  const layer   = document.getElementById('svg-layer');

  const svgNS = 'http://www.w3.org/2000/svg';
  const svgEl = document.createElementNS(svgNS, 'svg');
  svgEl.setAttribute('viewBox', '0 0 2752 1536');
  svgEl.setAttribute('width', '100%');
  svgEl.setAttribute('height', '100%');
  svgEl.style.position = 'absolute';
  svgEl.style.inset = '0';
  layer.appendChild(svgEl);

  const FILES = [
    { id: 'birdmigrationroute', svg: 'birdmigrationroute.svg', webp: 'birdmigrationroute.webp' },
  ];

  FILES.forEach(cfg => {
    fetch(BASE + cfg.svg)
      .then(r => r.text())
      .then(svgText => {
        const parser = new DOMParser();
        const parsed = parser.parseFromString(svgText, 'image/svg+xml');
        const g = document.createElementNS(svgNS, 'g');
        g.id = 'overlay-' + cfg.id;
        g.classList.add('overlay-img');

        const vis = document.createElementNS(svgNS, 'image');
        vis.setAttribute('href', BASE + cfg.webp);
        vis.setAttribute('x', '0');
        vis.setAttribute('y', '0');
        vis.setAttribute('width', '2752');
        vis.setAttribute('height', '1536');
        vis.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        vis.setAttribute('pointer-events', 'none');
        g.appendChild(vis);

        Array.from(parsed.documentElement.childNodes).forEach(node => {
          if (node.nodeType === 1) g.appendChild(document.importNode(node, true));
        });

        g.querySelectorAll('polygon, path, rect, circle, ellipse, polyline').forEach(shape => {
          shape.setAttribute('pointer-events', 'all');
          shape.style.cursor = 'pointer';
          shape.addEventListener('mouseenter', () => {
            if (!g.classList.contains('active')) g.classList.add('hover');
          });
          shape.addEventListener('mouseleave', () => g.classList.remove('hover'));
          shape.addEventListener('click', () => {
            g.classList.toggle('active');
            g.classList.remove('hover');
          });
        });

        svgEl.appendChild(g);
      });
  });

  function fitLayer() {
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const iw = mainImg.naturalWidth  || 2752;
    const ih = mainImg.naturalHeight || 1536;
    const imageAR = iw / ih, stageAR = sw / sh;
    let w, h, l, t;
    if (imageAR > stageAR) { w = sw; h = sw / imageAR; l = 0; t = (sh - h) / 2; }
    else                   { h = sh; w = sh * imageAR; t = 0; l = (sw - w) / 2; }
    layer.style.left   = l + 'px';
    layer.style.top    = t + 'px';
    layer.style.width  = w + 'px';
    layer.style.height = h + 'px';
  }

  mainImg.addEventListener('load', fitLayer);
  if (mainImg.complete && mainImg.naturalWidth) fitLayer();
  window.addEventListener('resize', fitLayer);
  new ResizeObserver(fitLayer).observe(stage);
</script>
</body>
</html>
