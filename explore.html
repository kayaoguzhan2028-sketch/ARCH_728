<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/webp" href="must-images/favicon/06Başkent.webp">
<title>Atlas — Explore</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black: #0a0a0a; --white: #f5f2eb; --mid: #d4cebc; --muted: rgba(245,242,235,0.45); --border: rgba(245,242,235,0.12); --node-size: 8px; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--black); color: var(--white); font-family: 'EB Garamond', Georgia, serif; display: flex; flex-direction: column; }

  nav { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 2.5rem; height: 52px; border-bottom: 1px solid var(--border); background: var(--black); z-index: 50; }
  .nav-left { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.4; }
  .nav-left a { color: var(--white); text-decoration: none; opacity: 0.6; transition: opacity 0.2s; }
  .nav-left a:hover { opacity: 1; }
  .view-tabs { display: flex; gap: 0; list-style: none; }
  .view-tabs li button { background: none; border: none; border-bottom: 2px solid transparent; padding: 0.4rem 1.4rem; font-family: 'EB Garamond', serif; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--white); opacity: 0.4; cursor: pointer; transition: opacity 0.2s, border-color 0.2s; }
  .view-tabs li button:hover { opacity: 0.75; }
  .view-tabs li button.active { opacity: 1; border-bottom-color: var(--white); }

  .content { flex: 1; position: relative; overflow: hidden; }
  .view { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
  .view.active { display: flex; }

  #view-map { align-items: stretch; }
  .map-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .zoom-controls { position: absolute; bottom: 1.4rem; right: 1.4rem; display: flex; flex-direction: column; gap: 4px; z-index: 1000; }
  .zoom-btn { width: 32px; height: 32px; background: rgba(10,10,10,0.7); border: 1px solid rgba(245,242,235,0.2); color: var(--white); font-family: 'EB Garamond', serif; font-size: 1.1rem; line-height: 1; cursor: pointer; backdrop-filter: blur(4px); transition: border-color 0.2s, opacity 0.2s; opacity: 0.6; display: flex; align-items: center; justify-content: center; }
  .zoom-btn:hover { opacity: 1; border-color: rgba(245,242,235,0.5); }

  .node { position: relative; display: inline-block; pointer-events: all; touch-action: manipulation; cursor: pointer; }
  .node-dot { width: var(--node-size); height: var(--node-size); border-radius: 50%; background: #f5f2eb; border: 1.5px solid #0a0a0a; transition: transform 0.2s; position: relative; z-index: 2; }
  .node-dot::after { content: ''; position: absolute; inset: -5px; border-radius: 50%; border: 1px solid rgba(245,242,235,0.55); animation: pulse 2.5s ease-out infinite; opacity: 0; }
  .node-image .node-dot { width: 20px; height: 20px; background-image: var(--node-img); background-size: cover; background-position: center; }
  @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.7; } 100% { transform: scale(2.2); opacity: 0; } }
  .node:hover .node-dot { transform: scale(1.5); }
  .node-label { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); background: rgba(10,10,10,0.88); border: 1px solid var(--border); padding: 0.35rem 0.75rem; white-space: nowrap; font-size: 0.82rem; letter-spacing: 0.05em; opacity: 0; pointer-events: none; transition: opacity 0.18s; backdrop-filter: blur(4px); }
  .node:hover .node-label { opacity: 1; }

  .node-cluster .cluster-label { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); display: flex; gap: 4px; opacity: 0; pointer-events: none; transition: opacity 0.18s; white-space: nowrap; }
  .node-cluster:hover .cluster-label { opacity: 1; pointer-events: auto; }
  .cluster-link { background: rgba(10,10,10,0.88); border: 1px solid var(--border); padding: 0.35rem 0.75rem; font-size: 0.82rem; letter-spacing: 0.05em; color: var(--white); text-decoration: none; backdrop-filter: blur(4px); transition: border-color 0.15s; }
  .cluster-link:hover { border-color: rgba(245,242,235,0.5); }

  /* Lens radial menu */
  .lens-menu { position: absolute; inset: 0; z-index: 998; pointer-events: none; }
  .lens-arc-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .lens-arc { fill: none; stroke: rgba(245,242,235,0.45); stroke-width: 1; stroke-dasharray: 4 5; }
  .lens-node { position: absolute; transform: translate(-50%, -50%); cursor: pointer; pointer-events: auto; }
  .lens-node-dot { width: calc(var(--node-size) * 1.6); height: calc(var(--node-size) * 1.6); border-radius: 50%; background: #f5f2eb; border: 1.5px solid #0a0a0a; transform: scale(0); opacity: 0; transition: transform 0.32s cubic-bezier(0.34,1.56,0.64,1), opacity 0.32s ease; }
  .lens-node:hover .lens-node-dot { transform: scale(1.2); }
  .lens-node.visible .lens-node-dot { transform: scale(1); opacity: 1; }
  .lens-node.visible:hover .lens-node-dot { transform: scale(1.2); }
  .lens-node-label { position: absolute; background: rgba(10,10,10,0.88); border: 1px solid var(--border); padding: 0.35rem 0.75rem; white-space: nowrap; font-size: 0.82rem; letter-spacing: 0.05em; backdrop-filter: blur(4px); opacity: 0; transition: opacity 0.25s ease; }
  .lens-node.visible .lens-node-label { opacity: 1; }
  .lens-node.label-right .lens-node-label { left: calc(100% + 10px); top: 50%; transform: translateY(-50%); }
  .lens-node.label-left  .lens-node-label { right: calc(100% + 10px); top: 50%; transform: translateY(-50%); }
  .lens-node.label-top    .lens-node-label { left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%); }
  .lens-node.label-bottom .lens-node-label { left: 50%; top: calc(100% + 10px); transform: translateX(-50%); }

  #view-year { align-items: center; justify-content: center; overflow: hidden; }
  .year-video-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
  .year-video { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.55; }

  #dive-in-btn { position: absolute; right: 25%; top: 50%; transform: translateY(-50%); z-index: 10; font-family: 'EB Garamond', serif; font-size: 0.82rem; font-style: italic; letter-spacing: 0.14em; color: var(--white); text-decoration: none; border: 1px solid rgba(245,242,235,0.35); padding: 0.28em 0.75em; opacity: 0.55; transition: opacity 0.35s; animation: dive-pulse 2.4s ease-out infinite; }
  #dive-in-btn:hover { opacity: 1; animation-play-state: paused; }
  @keyframes dive-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(245,242,235,0.4); } 50% { box-shadow: 0 0 0 12px rgba(245,242,235,0); } }

  #view-content { position: absolute; inset: 0; overflow: hidden; cursor: default; }
  .shape { position: absolute; cursor: pointer; transition: transform 0.35s ease, opacity 0.4s ease, filter 0.4s ease; will-change: transform; }
  .shape.selected { transform: scale(1.25) !important; }
  .shape.dimmed { opacity: 0.45; filter: saturate(0.2); }

  #shape-tooltip { position: fixed; background: rgba(10,10,10,0.88); border: 1px solid var(--border); padding: 0.35rem 0.75rem; font-size: 0.82rem; letter-spacing: 0.05em; opacity: 0; pointer-events: none; transition: opacity 0.18s; backdrop-filter: blur(4px); white-space: nowrap; z-index: 20; }
  #shape-tooltip.visible { opacity: 1; }

  footer { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 2.5rem; height: 48px; border-top: 1px solid var(--border); background: var(--black); }
  .footer-meta { font-size: 0.72rem; letter-spacing: 0.1em; color: var(--white); opacity: 0.22; }
  .btn-library { display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.38rem 1.2rem; border: 1px solid rgba(245,242,235,0.25); background: none; color: var(--white); font-family: 'EB Garamond', serif; font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; cursor: pointer; transition: border-color 0.2s, opacity 0.2s; opacity: 0.6; }
  .btn-library:hover { opacity: 1; border-color: rgba(245,242,235,0.6); }
  .btn-library svg { width: 11px; height: 11px; opacity: 0.7; }

  /* Library overlay */
  .library-overlay { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; background: rgba(10,10,10,0.82); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .library-overlay.visible { opacity: 1; pointer-events: auto; }
  .library-panel { position: relative; width: min(440px, 90vw); max-height: 80vh; overflow-y: auto; background: var(--black); border: 1px solid var(--border); padding: 2.2rem 2.2rem; }
  .library-close { position: absolute; top: 0.9rem; right: 1rem; background: none; border: none; color: var(--white); cursor: pointer; opacity: 0.4; font-size: 0.85rem; line-height: 1; padding: 0.2rem; transition: opacity 0.15s; }
  .library-close:hover { opacity: 1; }
  .library-title { font-size: clamp(2.2rem, 6vw, 3.4rem); font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 1.4rem; }
  .library-list { list-style: none; display: flex; flex-direction: column; gap: 0; }
  .library-list a { display: flex; gap: 0.9rem; align-items: baseline; padding: 0.6rem 0.2rem; color: var(--white); text-decoration: none; font-size: 0.95rem; letter-spacing: 0.04em; opacity: 0.65; border-bottom: 1px solid var(--border); transition: opacity 0.18s, padding-left 0.18s; }
  .library-list a:hover { opacity: 1; padding-left: 0.5rem; }
  .library-index { font-size: 0.72rem; letter-spacing: 0.15em; opacity: 0.5; min-width: 1.6em; }

  #leaflet-map { position: absolute; inset: 0; }
  .leaflet-container { background: var(--black); }
  .leaflet-tile-pane { filter: brightness(1.75) contrast(1.05); }
  body.map-light .leaflet-tile-pane { filter: brightness(1) contrast(1); }
  body.map-light .leaflet-container { background: #e8e4da; }
  .leaflet-control-attribution { background: rgba(10,10,10,0.6) !important; color: rgba(245,242,235,0.22) !important; font-size: 0.55rem !important; }
  .leaflet-control-attribution a { color: rgba(245,242,235,0.22) !important; }
  .leaflet-attribution-flag { display: none !important; }

  .map-panel { position: absolute; top: 1.2rem; right: 4.4rem; z-index: 1000; background: rgba(10,10,10,0.88); border: 1px solid var(--border); padding: 0.85rem 1.1rem; width: 220px; backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity 0.22s; }
  .map-panel.visible { opacity: 1; pointer-events: auto; }
  .map-panel-label { font-size: 0.88rem; letter-spacing: 0.06em; margin-bottom: 0.75rem; padding-right: 1rem; line-height: 1.4; opacity: 0.9; }
  .map-panel-close { position: absolute; top: 0.45rem; right: 0.55rem; background: none; border: none; color: var(--white); cursor: pointer; opacity: 0.35; font-size: 0.75rem; line-height: 1; padding: 0.1rem 0.2rem; transition: opacity 0.15s; }
  .map-panel-close:hover { opacity: 0.9; }
  .map-panel-link { display: inline-block; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--white); text-decoration: none; border: 1px solid rgba(245,242,235,0.28); padding: 0.28em 0.7em; opacity: 0.65; transition: opacity 0.18s, border-color 0.18s; }
  .map-panel-link:hover { opacity: 1; border-color: rgba(245,242,235,0.55); }
  .map-panel-actions { display: flex; justify-content: flex-start; align-items: center; margin-top: 0.75rem; gap: 0.5rem; }
  .map-panel-back { display: none; font-family: 'EB Garamond', serif; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; background: none; border: 1px solid rgba(245,242,235,0.28); color: var(--white); cursor: pointer; padding: 0.28em 0.7em; opacity: 0.65; transition: opacity 0.18s, border-color 0.18s; }
  .map-panel-back:hover { opacity: 1; border-color: rgba(245,242,235,0.55); }
  .map-panel-text { margin-top: 0.85rem; padding-top: 0.75rem; border-top: 1px solid var(--border); font-size: 0.78rem; line-height: 1.65; opacity: 0.55; white-space: pre-line; }
  .map-panel-text a { color: var(--white); text-decoration: underline; opacity: 0.8; transition: opacity 0.18s; }
  .map-panel-text a:hover { opacity: 1; }
  .map-panel.mode-geojson .map-panel-close { display: none; }
  .map-panel.mode-geojson .map-panel-back { display: inline-block; }

  #map-theme-btn { background: none; border: 1px solid rgba(245,242,235,0.25); color: var(--white); font-family: 'EB Garamond', serif; font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; padding: 0.2em 0.65em; cursor: pointer; opacity: 0.45; transition: opacity 0.2s; }
  #map-theme-btn:hover { opacity: 1; }

  .leaflet-tooltip.map-shape-tooltip { background: rgba(10,10,10,0.88); border: 1px solid rgba(245,242,235,0.12); color: var(--white); font-family: 'EB Garamond', Georgia, serif; font-size: 0.82rem; letter-spacing: 0.04em; padding: 0.35rem 0.75rem; backdrop-filter: blur(4px); box-shadow: none; border-radius: 0; }
  .leaflet-tooltip.map-shape-tooltip::before { display: none; }
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="index.html">← Atlas</a>
  </div>
  <ul class="view-tabs">

      <video class="year-video" src="must-images/by-year/2026-STG.mp4" autoplay loop muted playsinline></video>

    <svg class="shape" id="shape-2" width="110" height="110" viewBox="0 0 110 110" data-label="Grup 03"><polygon points="55,5 103,40 84,96 26,96 7,40" fill="#8fa3c8"/></svg>

<script>
  // ── Leaflet Map ──
  (function () {
    const BASE = '';
    const DATA = 'data/project_nodes_html_map.json';
    const CENTER = [39.892857, 32.785077];
    const ZOOM = 9;

    window._leafletMap = L.map('leaflet-map', {
      center: CENTER, zoom: ZOOM, zoomControl: false, attributionControl: true,
      minZoom: 5, maxBounds: [[35.8, 25.9], [42.1, 44.8]], maxBoundsViscosity: 1.0
    });

    setTimeout(() => window._leafletMap.invalidateSize(), 0);

    const tileAttrib = '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>';
    let activeTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: tileAttrib, subdomains: 'abcd', maxZoom: 19
    }).addTo(window._leafletMap);

    let isLight = false;
    document.getElementById('map-theme-btn').addEventListener('click', () => {
      isLight = !isLight;
      activeTile.remove();
      activeTile = L.tileLayer(
        isLight ? 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
                : 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        { attribution: tileAttrib, subdomains: 'abcd', maxZoom: 19 }
      ).addTo(window._leafletMap);
      document.body.classList.toggle('map-light', isLight);
      document.getElementById('map-theme-btn').textContent = isLight ? 'dark' : 'bright';
    });

    function makeIcon(html, size = 8) {
      return L.divIcon({ className: '', html, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
    }

    const mapPanel      = document.getElementById('map-panel');
    const mapPanelLabel = document.getElementById('map-panel-label');
    const mapPanelLink  = document.getElementById('map-panel-link');
    const mapPanelBack  = document.getElementById('map-panel-back');
    const mapPanelText  = document.getElementById('map-panel-text');

    let activeShape = null, activeMarkerEl = null, initialBounds = null;
    let prevView = null, mapLocked = false, allMarkers = [], hiddenMarkers = [], lensParent = null;

    function lockMap() {
      mapLocked = true;
      window._leafletMap.dragging.disable(); window._leafletMap.scrollWheelZoom.disable();
      window._leafletMap.touchZoom.disable(); window._leafletMap.doubleClickZoom.disable();
      window._leafletMap.boxZoom.disable(); window._leafletMap.keyboard.disable();
    }
    function unlockMap() {
      mapLocked = false;
      window._leafletMap.dragging.enable(); window._leafletMap.scrollWheelZoom.enable();
      window._leafletMap.touchZoom.enable(); window._leafletMap.doubleClickZoom.enable();
      window._leafletMap.boxZoom.enable(); window._leafletMap.keyboard.enable();
    }
    function clearActive() {
      if (activeShape) { window._leafletMap.removeLayer(activeShape); activeShape = null; }
      if (activeMarkerEl) { activeMarkerEl.style.opacity = ''; activeMarkerEl.style.pointerEvents = ''; activeMarkerEl = null; }
      hiddenMarkers.forEach(m => m.addTo(window._leafletMap));
      hiddenMarkers = [];
      mapPanel.classList.remove('visible', 'mode-geojson');
      mapPanelText.textContent = '';
      closeLensMenu();
      lensParent = null;
      unlockMap();
    }

    document.getElementById('map-panel-close').addEventListener('click', clearActive);
    mapPanelBack.addEventListener('click', () => {
      if (lensParent) {
        openGeojsonNode(lensParent, undefined, null, true);
        return;
      }
      const view = prevView; prevView = null; clearActive();
      if (view) window._leafletMap.flyTo(view.center, view.zoom, { duration: 2.4 });
    });

    // ── Lens radial menu ──
    const LENS_SPREAD_DEG = 360;
    const LENS_RADIUS_RATIO = 0.33;
    const LENS_RADIUS_MIN = 105;
    const LENS_RADIUS_MAX = 330;
    const LENS_FIT_RATIO = 0.7;
    const LENS_STAGGER_MS = 60;

    function getLensRadius() {
      return Math.max(LENS_RADIUS_MIN, Math.min(LENS_RADIUS_MAX, Math.min(window.innerWidth, window.innerHeight) * LENS_RADIUS_RATIO));
    }

    let lensMenuEl = null, lensResizeHandler = null;

    function closeLensMenu() {
      if (!lensMenuEl) return;
      lensMenuEl.remove();
      lensMenuEl = null;
      window.removeEventListener('resize', lensResizeHandler);
      lensResizeHandler = null;
    }

    function showLensMenu(n) {
      closeLensMenu();
      const children = n.lensChildren || [];
      if (!children.length) return;

      const menu = document.createElement('div');
      menu.className = 'lens-menu';
      document.getElementById('map-container').appendChild(menu);
      lensMenuEl = menu;

      function layout() {
        menu.innerHTML = '';
        const pt = window._leafletMap.latLngToContainerPoint([n.lat, n.lng]);
        const ax = pt.x, ay = pt.y;
        const R = getLensRadius();

        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('class', 'lens-arc-svg');
        const circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('class', 'lens-arc');
        circle.setAttribute('cx', ax);
        circle.setAttribute('cy', ay);
        circle.setAttribute('r', R);
        svg.appendChild(circle);
        menu.appendChild(svg);

        children.forEach((child, i) => {
          const phi = (LENS_SPREAD_DEG / children.length) * (i + 0.5) * (Math.PI / 180);
          const dx = Math.sin(phi), dy = -Math.cos(phi);
          const x = ax + R * dx;
          const y = ay + R * dy;
          const labelDir = Math.abs(dx) >= Math.abs(dy)
            ? (dx >= 0 ? 'label-right' : 'label-left')
            : (dy >= 0 ? 'label-bottom' : 'label-top');
          const item = document.createElement('div');
          item.className = 'lens-node ' + labelDir;
          item.style.left = x + 'px';
          item.style.top = y + 'px';
          item.innerHTML = `<div class="lens-node-dot"></div><div class="lens-node-label">${child.label}</div>`;
          item.querySelector('.lens-node-dot').style.transitionDelay = (i * LENS_STAGGER_MS) + 'ms';
          item.querySelector('.lens-node-label').style.transitionDelay = (i * LENS_STAGGER_MS) + 'ms';
          item.addEventListener('click', (e) => {
            e.stopPropagation();
            closeLensMenu();
            openGeojsonNode(child, undefined, n);
          });
          menu.appendChild(item);
          requestAnimationFrame(() => requestAnimationFrame(() => item.classList.add('visible')));
        });
      }

      layout();

      lensResizeHandler = () => layout();
      window.addEventListener('resize', lensResizeHandler);
    }

    function openGeojsonNode(n, marker, parent, isReturning) {
      clearActive();
      lensParent = parent || null;
      if (!parent && !isReturning) {
        prevView = { center: window._leafletMap.getCenter(), zoom: window._leafletMap.getZoom() };
      }
      if (marker) {
        const el = marker.getElement();
        if (el) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; activeMarkerEl = el; }
      }
      hiddenMarkers = allMarkers.filter(m => m !== marker);
      hiddenMarkers.forEach(m => window._leafletMap.removeLayer(m));
      lockMap();
      mapPanelLabel.textContent = n.label;
      mapPanelLink.href = BASE + n.url;
      mapPanelText.textContent = n.description || '';
      if (n.link) {
        mapPanelText.appendChild(document.createElement('br'));
        const linkEl = document.createElement('a');
        linkEl.href = n.link;
        linkEl.target = '_blank';
        linkEl.rel = 'noopener';
        linkEl.textContent = n.link;
        mapPanelText.appendChild(linkEl);
      }
      mapPanel.classList.add('visible', 'mode-geojson');
      const geojsonUrl = DATA.replace(/\/[^/]+$/, '') + '/' + n.geojsonFile + '?v=' + Date.now();
      fetch(geojsonUrl)
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(data => {
          if (!mapPanel.classList.contains('visible')) return;
          const hatchId = 'hatch-' + n.id;
          const svgNS = 'http://www.w3.org/2000/svg';
          const baseStyle = n.style || { color: '#f5f2eb', weight: 1.5, opacity: 1, fillOpacity: 0 };
          if (n.hatch) {
            let defsSvg = document.getElementById('_hatch_defs_svg');
            if (!defsSvg) {
              defsSvg = document.createElementNS(svgNS, 'svg');
              defsSvg.setAttribute('id', '_hatch_defs_svg');
              defsSvg.setAttribute('style', 'position:absolute;width:0;height:0;overflow:hidden');
              document.body.appendChild(defsSvg);
            }
            let defs = defsSvg.querySelector('defs');
            if (!defs) { defs = document.createElementNS(svgNS, 'defs'); defsSvg.appendChild(defs); }
            if (!defs.querySelector('#' + hatchId)) {
              const h = n.hatch; const sp = h.spacing || 6;
              const pat = document.createElementNS(svgNS, 'pattern');
              pat.setAttribute('id', hatchId); pat.setAttribute('patternUnits', 'userSpaceOnUse');
              pat.setAttribute('width', sp); pat.setAttribute('height', sp);
              if (h.type === 'cross') {
                const mkL = (x1, y1, x2, y2) => {
                  const l = document.createElementNS(svgNS, 'line');
                  l.setAttribute('x1', x1); l.setAttribute('y1', y1);
                  l.setAttribute('x2', x2); l.setAttribute('y2', y2);
                  l.setAttribute('stroke', h.color || '#f5f2eb');
                  l.setAttribute('stroke-width', h.width || 1);
                  l.setAttribute('stroke-opacity', h.opacity || 0.7);
                  return l;
                };
                pat.appendChild(mkL(String(sp/2), '0', String(sp/2), String(sp)));
                pat.appendChild(mkL('0', String(sp/2), String(sp), String(sp/2)));
              } else if (h.type === 'dot') {
                const c = document.createElementNS(svgNS, 'circle');
                c.setAttribute('cx', String(sp/2)); c.setAttribute('cy', String(sp/2));
                c.setAttribute('r', String(h.radius || sp * 0.18));
                c.setAttribute('fill', h.color || '#f5f2eb');
                c.setAttribute('fill-opacity', h.opacity || 0.7);
                pat.appendChild(c);
              } else {
                pat.setAttribute('patternTransform', 'rotate(' + (h.angle || 45) + ')');
                const ln = document.createElementNS(svgNS, 'line');
                ln.setAttribute('x1', '0'); ln.setAttribute('y1', '0');
                ln.setAttribute('x2', '0'); ln.setAttribute('y2', sp);
                ln.setAttribute('stroke', h.color || '#f5f2eb');
                ln.setAttribute('stroke-width', h.width || 1.5);
                ln.setAttribute('stroke-opacity', h.opacity || 0.8);
                pat.appendChild(ln);
              }
              defs.appendChild(pat);
            }
          }
          const layer = L.geoJSON(data, {
            interactive: false,
            style: function(feature) {
              const geomType = feature && feature.geometry && feature.geometry.type;
              const isPoly = geomType === 'Polygon' || geomType === 'MultiPolygon';
              if (isPoly) {
                return Object.assign({}, baseStyle, n.polygonStyle || {}, {
                  fillColor:   n.hatch ? ('url(#' + hatchId + ')') : (baseStyle.fillColor || '#f5f2eb'),
                  fillOpacity: n.hatch ? 1 : (baseStyle.fillOpacity || 0),
                });
              }
              return Object.assign({}, baseStyle, n.lineStyle || {});
            }
          }).addTo(window._leafletMap);
          activeShape = layer;
          const bounds = layer.getBounds();
          if (bounds.isValid()) {
            let zoom;
            if (n.zoom !== undefined) {
              zoom = n.zoom;
            } else if (n.lensChildren && n.lensChildren.length) {
              const fitSize = getLensRadius() * 2 * LENS_FIT_RATIO;
              zoom = window._leafletMap.getBoundsZoom(bounds, false, L.point(window.innerWidth - fitSize, window.innerHeight - fitSize));
            } else {
              zoom = window._leafletMap.getBoundsZoom(bounds, false, L.point(40, 40));
            }
            window._leafletMap.flyTo(bounds.getCenter(), zoom, { duration: 1.4 });
          }
          if (n.lensChildren && n.lensChildren.length) {
            setTimeout(() => { if (mapPanel.classList.contains('visible')) showLensMenu(n); }, 1450);
          }
        })
        .catch(err => console.error('[geojson] fetch error:', err));
    }

    fetch(DATA).then(r => r.json()).then(nodes => {
      const markers = [];
      nodes.forEach(n => {
        const type = n.type || 'node';

        if (type === 'node') {
          const html = `<div class="node"><div class="node-dot"></div><div class="node-label">${n.label}</div></div>`;
          const marker = L.marker([n.lat, n.lng], { icon: makeIcon(html) }).addTo(window._leafletMap);
          markers.push(marker);
          marker.on('click', () => {
            clearActive();
            prevView = { center: window._leafletMap.getCenter(), zoom: window._leafletMap.getZoom() };
            const el = marker.getElement();
            if (el) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; activeMarkerEl = el; }
            hiddenMarkers = allMarkers.filter(m => m !== marker);
            hiddenMarkers.forEach(m => window._leafletMap.removeLayer(m));
            lockMap();
            window._leafletMap.flyTo([n.lat, n.lng], n.zoom || 14, { duration: 1.4 });
            mapPanelLabel.textContent = n.label;
            mapPanelLink.href = BASE + n.url;
            mapPanelText.textContent = n.description || '';
            mapPanel.classList.add('visible', 'mode-geojson');
          });

        } else if (type === 'geojson') {
          const shapeClass = n.icon === 'image' ? ' node-image' : '';
          const iconSize = n.icon === 'image' ? 20 : 8;
          const dotAttr = n.icon === 'image' && n.iconImage ? ` style="--node-img: url('${BASE + n.iconImage}')"` : '';
          const html = `<div class="node${shapeClass}"><div class="node-dot"${dotAttr}></div><div class="node-label">${n.label}</div></div>`;
          const marker = L.marker([n.lat, n.lng], { icon: makeIcon(html, iconSize) }).addTo(window._leafletMap);
          markers.push(marker);
          marker.on('click', () => openGeojsonNode(n, marker));

        } else {
          const html = `<div class="node"><div class="node-dot"></div><div class="node-label">${n.label}</div></div>`;
          const marker = L.marker([n.lat, n.lng], { icon: makeIcon(html) }).addTo(window._leafletMap);
          markers.push(marker);
          marker.on('click', () => {
            clearActive();
            prevView = { center: window._leafletMap.getCenter(), zoom: window._leafletMap.getZoom() };
            const el = marker.getElement();
            if (el) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; activeMarkerEl = el; }
            hiddenMarkers = allMarkers.filter(m => m !== marker);
            hiddenMarkers.forEach(m => window._leafletMap.removeLayer(m));
            lockMap();
            window._leafletMap.flyTo([n.lat, n.lng], 15, { duration: 1.4 });
            const shapeStyle = { color: 'rgba(245,242,235,0.75)', weight: 1.5, fillColor: 'rgba(245,242,235,0.08)', fillOpacity: 1 };
            activeShape = type === 'polygon'
              ? L.polygon(n.coordinates, shapeStyle).addTo(window._leafletMap)
              : L.polyline(n.coordinates, { color: 'rgba(245,242,235,0.75)', weight: 2 }).addTo(window._leafletMap);
            if (n.briefing) activeShape.bindTooltip(n.briefing, { sticky: true, className: 'map-shape-tooltip' });
            mapPanelLabel.textContent = n.label;
            mapPanelLink.href = BASE + n.url;
            mapPanelText.textContent = n.description || '';
            mapPanel.classList.add('visible', 'mode-geojson');
          });
        }
      });

      allMarkers = markers;
      if (markers.length) {
        initialBounds = L.featureGroup(markers).getBounds().pad(0.4);
        const fitZoom = window._leafletMap.getBoundsZoom(initialBounds) - 1;
        window._leafletMap.setView(CENTER, fitZoom);
      }
    });

    document.getElementById('zoom-in').addEventListener('click',    () => window._leafletMap.zoomIn());
    document.getElementById('zoom-out').addEventListener('click',   () => window._leafletMap.zoomOut());
    document.getElementById('zoom-reset').addEventListener('click', () => {
      prevView = null; clearActive();
      const z = initialBounds ? window._leafletMap.getBoundsZoom(initialBounds) - 1 : ZOOM;
      window._leafletMap.flyTo(CENTER, z, { duration: 1.4 });
    });
  })();

  // ── View switcher ──
  const buttons = document.querySelectorAll('.view-tabs button');
  const views   = document.querySelectorAll('.view');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.view;
      buttons.forEach(b => b.classList.remove('active'));
      views.forEach(v => v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('view-' + target).classList.add('active');
      if (target === 'map' && window._leafletMap) window._leafletMap.invalidateSize();
    });
  });

  // ── Library overlay ──
  const LIBRARY_PROJECTS = [
    { num: '01', label: 'Çayırhan Ash Lake',           url: 'project-2026-1.html' },
    { num: '02', label: 'Hıdırlık Tepe',               url: 'project-2026-2.html' },
    { num: '03', label: 'Grid',                        url: 'project-2026-3.html' },
    { num: '04', label: 'Bilkent Territory',           url: 'project-2026-4.html' },
    { num: '05', label: 'Ankara Çankaya (vinç) Hotel', url: 'project-2026-5.html' },
    { num: '06', label: 'Cebeci Cemetery',             url: 'project-2026-6.html' },
    { num: '07', label: 'İlker Mahallesi',             url: 'project-2026-7.html' },
    { num: '08', label: 'ÇUBUK I Dam',                 url: 'project-2026-8.html' },
    { num: '09', label: 'The Ground',                  url: 'project-2026-9.html' },
  ];

  const libraryOverlay = document.getElementById('library-overlay');
  const libraryList    = document.getElementById('library-list');

  LIBRARY_PROJECTS.forEach(p => {
    const li = document.createElement('li');
    const a  = document.createElement('a');
    a.href = p.url;
    const index = document.createElement('span');
    index.className = 'library-index';
    index.textContent = p.num;
    const label = document.createElement('span');
    label.textContent = p.label;
    a.appendChild(index);
    a.appendChild(label);
    li.appendChild(a);
    libraryList.appendChild(li);
  });

  function openLibrary()  { libraryOverlay.classList.add('visible'); }
  function closeLibrary() { libraryOverlay.classList.remove('visible'); }

  document.getElementById('library-btn').addEventListener('click', (e) => { e.preventDefault(); openLibrary(); });
  document.getElementById('library-close').addEventListener('click', closeLibrary);
  libraryOverlay.addEventListener('click', (e) => { if (e.target === libraryOverlay) closeLibrary(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLibrary(); });

  // ── Bouncing shapes ──
  const container = document.getElementById('view-content');
  const shapes = [
    { el: document.getElementById('shape-0'), w: 120, h: 120, vx:  0.70, vy:  0.70 },
    { el: document.getElementById('shape-1'), w:  90, h:  90, vx: -0.70, vy:  0.70 },
    { el: document.getElementById('shape-2'), w: 110, h: 110, vx:  0.65, vy: -0.65 },
    { el: document.getElementById('shape-3'), w: 120, h: 104, vx: -0.75, vy:  0.65 },
    { el: document.getElementById('shape-4'), w:  90, h: 158, vx:  0.60, vy: -0.70 },
    { el: document.getElementById('shape-5'), w: 100, h: 100, vx: -0.45, vy:  0.55 },
    { el: document.getElementById('shape-6'), w: 120, h: 120, vx:  0.75, vy:  0.50 },
    { el: document.getElementById('shape-7'), w:  90, h: 120, vx: -0.55, vy: -0.45 },
  ];

  shapes.forEach(s => {
    s.x = Math.random() * Math.max(0, window.innerWidth  - s.w);
    s.y = Math.random() * Math.max(0, window.innerHeight - s.h);
    s.el.style.left = s.x + 'px';
    s.el.style.top  = s.y + 'px';
  });

  const shapeTooltip = document.getElementById('shape-tooltip');
  let hoveredShape = null;
  const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

  shapes.forEach(s => {
    if (s.el.dataset.href) {
      s.el.style.cursor = 'pointer';
      s.el.addEventListener('click', () => { window.location.href = s.el.dataset.href; });
    }
  });

  if (isTouch) {
    shapes.forEach(s => { s.vx *= 0.55; s.vy *= 0.55; });
  } else {
    shapes.forEach(s => {
      s.el.addEventListener('mouseenter', () => {
        hoveredShape = s;
        s.el.classList.add('selected');
        shapes.forEach(other => { if (other.el !== s.el) other.el.classList.add('dimmed'); });
        shapeTooltip.textContent = s.el.dataset.label;
        shapeTooltip.classList.add('visible');
      });
      s.el.addEventListener('mouseleave', () => {
        hoveredShape = null;
        shapes.forEach(other => other.el.classList.remove('selected', 'dimmed'));
        shapeTooltip.classList.remove('visible');
      });
    });
  }

  function animate() {
    const cw = container.clientWidth;
    const ch = container.clientHeight;
    if (cw > 0 && ch > 0) {
      shapes.forEach(s => {
        const isSelected = (s === hoveredShape);
        const spd = isSelected ? 0.5 : 1;
        s.x += s.vx * spd; s.y += s.vy * spd;
        if (s.x <= 0)        { s.x = 0;        s.vx =  Math.abs(s.vx); }
        if (s.x + s.w >= cw) { s.x = cw - s.w; s.vx = -Math.abs(s.vx); }
        if (s.y <= 0)        { s.y = 0;        s.vy =  Math.abs(s.vy); }
        if (s.y + s.h >= ch) { s.y = ch - s.h; s.vy = -Math.abs(s.vy); }
        s.el.style.left = s.x + 'px';
        s.el.style.top  = s.y + 'px';
        if (isSelected && hoveredShape) {
          const tipW = shapeTooltip.offsetWidth || 120;
          const gap  = 14;
          shapeTooltip.style.left      = (s.x + s.w + gap + tipW < cw ? s.x + s.w + gap : Math.max(8, s.x - tipW - gap)) + 'px';
          shapeTooltip.style.top       = (s.y + s.h / 2) + 'px';
          shapeTooltip.style.transform = 'translateY(-50%)';
        }
      });
    }
    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
