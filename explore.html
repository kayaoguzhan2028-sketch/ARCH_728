<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/webp" href="must-images/favicon/Mimfak.webp">
<title>Atlas — Explore</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black: #0a0a0a; --white: #f5f2eb; --mid: #d4cebc; --muted: rgba(245,242,235,0.45); --border: rgba(245,242,235,0.12); --node-size: 8px; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--black); color: var(--white); font-family: 'EB Garamond', Georgia, serif; display: flex; flex-direction: column; }

  nav { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 2.5rem; height: 52px; border-bottom: 1px solid var(--border); background: var(--black); z-index: 50; }
  .nav-left { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.85; }
  .nav-left a { color: var(--white); text-decoration: none; opacity: 0.85; transition: opacity 0.2s; }
  .nav-left a:hover { opacity: 1; }
  .view-tabs { display: flex; gap: 0; list-style: none; }
  .view-tabs li button { background: none; border: none; border-bottom: 2px solid transparent; padding: 0.4rem 1.4rem; font-family: 'EB Garamond', serif; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--white); opacity: 0.4; cursor: pointer; transition: opacity 0.2s, border-color 0.2s; }
  .view-tabs li button:hover { opacity: 0.75; }
  .view-tabs li button.active { opacity: 1; border-bottom-color: var(--white); }

  .content { flex: 1; position: relative; overflow: hidden; }
  .view { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
  .view.active { display: flex; }

  #view-map { align-items: stretch; }
  .map-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .zoom-controls { position: absolute; bottom: 1.4rem; right: 1.4rem; display: flex; flex-direction: column; gap: 4px; z-index: 1000; }
  .zoom-btn { width: 32px; height: 32px; background: rgba(10,10,10,0.7); border: 1px solid rgba(245,242,235,0.2); color: var(--white); font-family: 'EB Garamond', serif; font-size: 1.1rem; line-height: 1; cursor: pointer; backdrop-filter: blur(4px); transition: border-color 0.2s, opacity 0.2s; opacity: 0.6; display: flex; align-items: center; justify-content: center; }
  .zoom-btn:hover { opacity: 1; border-color: rgba(245,242,235,0.5); }

  .node { position: relative; display: inline-block; pointer-events: all; touch-action: manipulation; cursor: pointer; }
  .node-dot { width: var(--node-size); height: var(--node-size); border-radius: 50%; background: #f5f2eb; border: 1.5px solid #0a0a0a; transition: transform 0.2s; position: relative; z-index: 2; }
  .node-dot::after { content: ''; position: absolute; inset: -5px; border-radius: 50%; border: 1px solid rgba(245,242,235,0.55); animation: pulse 2.5s ease-out infinite; opacity: 0; }
  .node-image .node-dot { width: 20px; height: 20px; background-image: var(--node-img); background-size: cover; background-position: center; }
  @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.7; } 100% { transform: scale(2.2); opacity: 0; } }
  .node:hover .node-dot { transform: scale(1.5); }
  .node-label { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); background: rgba(10,10,10,0.88); border: 1px solid var(--border); padding: 0.35rem 0.75rem; white-space: nowrap; font-size: 0.82rem; letter-spacing: 0.05em; opacity: 0; pointer-events: none; transition: opacity 0.18s; backdrop-filter: blur(4px); }
  .node:hover .node-label { opacity: 1; }

  .node-cluster .cluster-label { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); display: flex; gap: 4px; opacity: 0; pointer-events: none; transition: opacity 0.18s; white-space: nowrap; }
  .node-cluster:hover .cluster-label { opacity: 1; pointer-events: auto; }
  .cluster-link { background: rgba(10,10,10,0.88); border: 1px solid var(--border); padding: 0.35rem 0.75rem; font-size: 0.82rem; letter-spacing: 0.05em; color: var(--white); text-decoration: none; backdrop-filter: blur(4px); transition: border-color 0.15s; }
  .cluster-link:hover { border-color: rgba(245,242,235,0.5); }

  /* Lens radial menu */
  .lens-menu { position: absolute; inset: 0; z-index: 998; pointer-events: none; }
  .lens-arc-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .lens-arc { fill: none; stroke: rgba(245,242,235,0.45); stroke-width: 1; stroke-dasharray: 4 5; }
  .lens-node { position: absolute; transform: translate(-50%, -50%); cursor: pointer; pointer-events: auto; }
  .lens-node-dot { width: calc(var(--node-size) * 1.6); height: calc(var(--node-size) * 1.6); border-radius: 50%; background: #f5f2eb; border: 1.5px solid #0a0a0a; transform: scale(0); opacity: 0; transition: transform 0.32s cubic-bezier(0.34,1.56,0.64,1), opacity 0.32s ease; }
  .lens-node:hover .lens-node-dot { transform: scale(1.2); }
  .lens-node.visible .lens-node-dot { transform: scale(1); opacity: 1; }
  .lens-node.visible:hover .lens-node-dot { transform: scale(1.2); }
  .lens-node-label { position: absolute; background: rgba(10,10,10,0.88); border: 1px solid var(--border); padding: 0.35rem 0.75rem; white-space: nowrap; font-size: 0.82rem; letter-spacing: 0.05em; backdrop-filter: blur(4px); opacity: 0; transition: opacity 0.25s ease; }
  .lens-node.visible .lens-node-label { opacity: 1; }
  .lens-node.label-right .lens-node-label { left: calc(100% + 10px); top: 50%; transform: translateY(-50%); }
  .lens-node.label-left  .lens-node-label { right: calc(100% + 10px); top: 50%; transform: translateY(-50%); }
  .lens-node.label-top    .lens-node-label { left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%); }
  .lens-node.label-bottom .lens-node-label { left: 50%; top: calc(100% + 10px); transform: translateX(-50%); }

  #view-content { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; cursor: default; align-items: flex-start; justify-content: center; }

  /* Background layer behind the grid — "Soil" contour lines (topographic/
     strata-style, procedural SVG, no extra asset) with its own slow
     mouse-parallax so the whole scene reads as one space with depth,
     instead of icons floating over a flat void. Moves at a fraction of the
     icon parallax (see CONTENT_BG_RATIO in the JS) — background layers are
     supposed to move less than the foreground, that's what sells the depth;
     it just needed to move *some* to read as intentional. */
  .content-bg { position: absolute; inset: -6%; opacity: 0.16; pointer-events: none; will-change: transform; }
  .content-bg svg { width: 100%; height: 100%; }
  .content-bg path { fill: none; stroke: var(--mid); stroke-width: 1; }

  /* Theme sidebar — same pattern as .century-list in 2026-2-thetimeline.html:
     a fixed, vertically-centered column of names on the left; clicking one
     swaps what's shown on the right (renderCluster() in the JS), instead of
     trying to fit every theme on screen at once. */
  .theme-list { position: absolute; top: 0; bottom: 0; left: 0; width: 150px; display: flex; flex-direction: column; justify-content: center; gap: 1rem; padding-left: 2rem; z-index: 10; }
  .theme-btn { background: none; border: none; color: var(--white); font-family: 'EB Garamond', serif; font-size: 1.1rem; letter-spacing: 0.16em; text-transform: uppercase; text-align: left; cursor: pointer; opacity: 0.32; transition: opacity 0.2s; padding: 0.15rem 0; }
  .theme-btn:hover { opacity: 0.7; }
  .theme-btn.active { opacity: 1; font-weight: 700; }
  @media (max-width: 900px) {
    .theme-list { position: static; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 0.6rem 1.4rem; padding: 1rem 1rem 0; width: 100%; }
  }

  .icon-grid-wrap { position: relative; width: 100%; max-width: 1500px; margin: 0 auto; padding: 1.5rem 2rem; }
  /* perspective lives on the wrap, not the grid itself — matches the Codrops
     original, where every .grid__item is tilted independently in 3D but the
     grid container stays a flat 2D layout. */
  .icon-grid-wrap { perspective: 1400px; }
  .icon-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3rem 2rem; align-items: center; justify-items: center; }
  @media (max-width: 900px) {
    .icon-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 560px) {
    .icon-grid { grid-template-columns: repeat(2, 1fr); }
  }
  /* Scattered layout (desktop only — see .icon-slot below): each icon sits
     at a hand-placed, slightly rotated point instead of a grid cell, like
     pieces laid out loosely on a table. .icon-slot only carries that static
     placement; .icon-cell inside it is still the GSAP target for the 3D
     tilt/parallax, so the two transforms never fight over the same
     element's `transform` property. */
  .icon-grid.scattered { display: block; }
  @media (min-width: 901px) {
    /* Only the active theme's icons are ever rendered (see renderCluster()
       in the JS), so each one gets the full canvas to itself — no more
       splitting the width between simultaneous clusters. Canvas height is
       viewport-fit (100vh minus nav+footer+wrap padding) rather than a
       fixed px value, so it lands on one screen with no scrolling at any
       reasonable window height. Left padding clears .theme-list. */
    #view-content { overflow-y: hidden; }
    .icon-grid-wrap { padding-left: 11rem; }
    .icon-grid.scattered { position: relative; height: calc(100vh - 180px); min-height: 460px; max-height: 720px; }
    .icon-grid.scattered .icon-slot {
      position: absolute; left: var(--sx); top: var(--sy);
      transform: translate(-50%, -50%) rotate(var(--srot));
    }
  }
  /* Icon cell: ported from Codrops "3DGridContentPreview" — each cell tilts
     in 3D based on its position and parallaxes with the cursor (GridItem3D,
     JS below); the icon inside is separately, magnetically pulled toward
     the cursor on hover (MagneticImage, JS below). Both ranges were toned
     down from the original — its full-viewport grid items could travel far
     more than these ~130px icons before it started looking like the whole
     thing was sliding off rather than settling toward the cursor. */
  /* Smaller resting size (more room to fit many more icons later, per plan)
     — MagneticImage's hover scale (1.55x, in JS) is what makes a hovered
     icon prominent again, not the base size. */
  .icon-cell { position: relative; width: 100%; max-width: 82px; cursor: pointer; will-change: transform; transform-style: preserve-3d; }
  /* height:auto here used to make .icon-figure's box follow each source
     image's own (non-square) aspect ratio — which made .icon-glow's circle
     render as a squashed ellipse on anything but a perfectly square source.
     object-fit:contain (paired with .icon-figure's aspect-ratio:1/1 below)
     keeps every icon at its own proportions while guaranteeing the box
     around it — and so the glow "coin" — is always a true circle. */
  .icon-img { display: block; width: 100%; height: 100%; object-fit: contain; will-change: transform; }

  /* Icon figure/shadow — ported from Codrops "TiltHoverEffects"
     (github.com/codrops/TiltHoverEffects): a per-cell hover tilt (rotateX/Y
     relative to THIS cell's own bounds, not the whole window — different
     from GridItem3D's ambient parallax above) plus a soft ellipse shadow
     that fades in underneath — reads as "this icon lifted up off the
     background" rather than flat/pasted on it. (The masked white shine
     sweep from the original effect was dropped — on these small line-art
     icons it read as a ghosted white duplicate of the icon rather than a
     glint of light, not what was wanted here.) */
  .icon-figure { position: relative; aspect-ratio: 1 / 1; transform-style: preserve-3d; will-change: transform; }
  /* Circular glow behind the icon — the original TiltHoverEffects demo used
     square photos that already filled their frame; ours are line-art icons
     floating inside empty space, so there's no "frame" for the tilt/shine
     to play against. This gives them one: a circle "fills up" behind the
     icon on hover. It lives inside .icon-figure (same element GSAP tilts in
     TiltFx below), so it tilts together with the icon automatically — no
     separate JS wiring needed for that part.
     "Coin" fit: the circle circumscribes the (now guaranteed-square, see
     .icon-figure above) frame — its edge passes exactly through the
     square's 4 corners, not its side midpoints. For a square of side S that
     circle's diameter is S·√2 ≈ 141.42% of S, hence the 141.42% width/
     height below. Brightness: 100% at the center down to 40% right at that
     circle's own edge (closest-side sizing on the gradient maps its 100%
     stop to this element's own edge, which is where the square's corners
     now sit). */
  .icon-glow {
    position: absolute; left: 50%; top: 50%; width: 141.42%; height: 141.42%;
    transform: translate(-50%, -50%) translateZ(-2px) scale(0.6);
    border-radius: 50%;
    background: radial-gradient(circle closest-side, rgba(255,138,61,1) 0%, rgba(255,138,61,0.4) 100%);
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease-out, transform 0.4s ease-out;
  }
  /* 1.55 here matches MagneticImage's own hover scale on .icon-img exactly
     (JS below) — the glow's 141.42% "circumscribes the corners" math above
     was computed against the icon's resting size, so growing the glow by
     any other factor than the icon's own growth would throw that
     relationship off at the hovered (grown) size. Uniformly scaling both
     by the same 1.55 keeps the coin's corners-on-the-circle relationship
     true whether the icon is resting or hovered, not just at rest. */
  .icon-cell:hover .icon-glow { opacity: 1; transform: translate(-50%, -50%) translateZ(-2px) scale(1.55); }
  .icon-shadow {
    position: absolute; left: 10%; right: 10%; bottom: -14%; height: 26%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.6), transparent 72%);
    opacity: 0; transition: opacity 0.35s ease-out; pointer-events: none; transform: translateZ(-1px);
  }
  .icon-cell:hover .icon-shadow { opacity: 1; }

  #shape-tooltip { position: fixed; background: rgba(10,10,10,0.88); border: 1px solid var(--border); padding: 0.35rem 0.75rem; font-size: 0.82rem; letter-spacing: 0.05em; opacity: 0; pointer-events: none; transition: opacity 0.18s; backdrop-filter: blur(4px); white-space: nowrap; z-index: 20; }
  #shape-tooltip.visible { opacity: 1; }

  footer { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 2.5rem; height: 48px; border-top: 1px solid var(--border); background: var(--black); }
  .footer-meta { font-size: 0.72rem; letter-spacing: 0.1em; color: var(--white); opacity: 0.22; }
  .btn-library { display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.38rem 1.2rem; border: 1px solid rgba(245,242,235,0.25); background: none; color: var(--white); font-family: 'EB Garamond', serif; font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; cursor: pointer; transition: border-color 0.2s, opacity 0.2s; opacity: 0.6; }
  .btn-library:hover { opacity: 1; border-color: rgba(245,242,235,0.6); }
  .btn-library svg { width: 11px; height: 11px; opacity: 0.7; }

  /* Library overlay */
  .library-overlay { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; background: rgba(10,10,10,0.82); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .library-overlay.visible { opacity: 1; pointer-events: auto; }
  .library-panel { position: relative; width: min(440px, 90vw); max-height: 80vh; overflow-y: auto; background: var(--black); border: 1px solid var(--border); padding: 2.2rem 2.2rem; }
  .library-close { position: absolute; top: 0.9rem; right: 1rem; background: none; border: none; color: var(--white); cursor: pointer; opacity: 0.4; font-size: 0.85rem; line-height: 1; padding: 0.2rem; transition: opacity 0.15s; }
  .library-close:hover { opacity: 1; }
  .library-title { font-size: 1.5rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 0.5rem; }
  .library-subtitle { font-size: 1.2rem; font-style: italic; letter-spacing: 0.04em; color: var(--mid); opacity: 0.7; margin-bottom: 1.8rem; }
  .library-list { list-style: none; display: flex; flex-direction: column; gap: 0; }
  .library-list a { display: flex; gap: 0.9rem; align-items: baseline; padding: 0.6rem 0.2rem; color: var(--white); text-decoration: none; font-size: 0.95rem; letter-spacing: 0.04em; opacity: 0.65; border-bottom: 1px solid var(--border); transition: opacity 0.18s, padding-left 0.18s; }
  .library-list a:hover { opacity: 1; padding-left: 0.5rem; }
  .library-index { font-size: 0.72rem; letter-spacing: 0.15em; opacity: 0.5; min-width: 1.6em; }

  #leaflet-map { position: absolute; inset: 0; }
  .leaflet-container { background: var(--black); }
  .leaflet-tile-pane { filter: brightness(1.75) contrast(1.05); }
  body.map-light .leaflet-tile-pane { filter: brightness(1) contrast(1); }
  body.map-light .leaflet-container { background: #e8e4da; }
  .leaflet-control-attribution { background: rgba(10,10,10,0.6) !important; color: rgba(245,242,235,0.22) !important; font-size: 0.55rem !important; }
  .leaflet-control-attribution a { color: rgba(245,242,235,0.22) !important; }
  .leaflet-attribution-flag { display: none !important; }

  .map-panel { position: absolute; top: 1.2rem; right: 4.4rem; z-index: 1000; background: rgba(10,10,10,0.88); border: 1px solid var(--border); padding: 0.85rem 1.1rem; width: 220px; backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity 0.22s; }
  .map-panel.visible { opacity: 1; pointer-events: auto; }
  .map-panel-label { font-size: 0.88rem; letter-spacing: 0.06em; margin-bottom: 0.75rem; padding-right: 1rem; line-height: 1.4; opacity: 0.9; }
  .map-panel-close { position: absolute; top: 0.45rem; right: 0.55rem; background: none; border: none; color: var(--white); cursor: pointer; opacity: 0.35; font-size: 0.75rem; line-height: 1; padding: 0.1rem 0.2rem; transition: opacity 0.15s; }
  .map-panel-close:hover { opacity: 0.9; }
  .map-panel-link { display: inline-block; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--white); text-decoration: none; border: 1px solid rgba(245,242,235,0.28); padding: 0.28em 0.7em; opacity: 0.65; transition: opacity 0.18s, border-color 0.18s; }
  .map-panel-link:hover { opacity: 1; border-color: rgba(245,242,235,0.55); }
  .map-panel-actions { display: flex; justify-content: flex-start; align-items: center; margin-top: 0.75rem; gap: 0.5rem; }
  .map-panel-back { display: none; font-family: 'EB Garamond', serif; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; background: none; border: 1px solid rgba(245,242,235,0.28); color: var(--white); cursor: pointer; padding: 0.28em 0.7em; opacity: 0.65; transition: opacity 0.18s, border-color 0.18s; }
  .map-panel-back:hover { opacity: 1; border-color: rgba(245,242,235,0.55); }
  .map-panel-text { margin-top: 0.85rem; padding-top: 0.75rem; border-top: 1px solid var(--border); font-size: 0.78rem; line-height: 1.65; opacity: 0.55; white-space: pre-line; }
  .map-panel-text a { color: var(--white); text-decoration: underline; opacity: 0.8; transition: opacity 0.18s; }
  .map-panel-text a:hover { opacity: 1; }
  .map-panel.mode-geojson .map-panel-close { display: none; }
  .map-panel.mode-geojson .map-panel-back { display: inline-block; }

  @media (max-width: 640px) {
    .map-panel { top: auto; bottom: 0; left: 0; right: 0; width: 100%; max-width: none; max-height: 62vh; overflow-y: auto; border: none; border-top: 1px solid var(--border); border-radius: 14px 14px 0 0; padding: 1.1rem 1.3rem 1.6rem; transform: translateY(14px); transition: opacity 0.22s ease, transform 0.22s ease; }
    .map-panel.visible { transform: translateY(0); }
    .map-panel-label { font-size: 1rem; padding-right: 1.6rem; }
    .map-panel-close { top: 0.7rem; right: 0.9rem; font-size: 1rem; padding: 0.3rem; }
    .map-panel-actions { flex-wrap: wrap; }
    .map-panel-link, .map-panel-back { flex: 1 1 auto; text-align: center; padding: 0.6em 0.8em; font-size: 0.72rem; }
    .map-panel-text { font-size: 0.86rem; }
  }
  @media (max-width: 900px), (hover: none) {
    .node::before, .lens-node::before { content: ''; position: absolute; inset: -14px; z-index: 1; }
  }

  #map-theme-btn { background: none; border: 1px solid rgba(245,242,235,0.25); color: var(--white); font-family: 'EB Garamond', serif; font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; padding: 0.2em 0.65em; cursor: pointer; opacity: 0.45; transition: opacity 0.2s; min-width: 4.6rem; text-align: center; }
  #map-theme-btn:hover { opacity: 1; }

  .leaflet-tooltip.map-shape-tooltip { background: rgba(10,10,10,0.88); border: 1px solid rgba(245,242,235,0.12); color: var(--white); font-family: 'EB Garamond', Georgia, serif; font-size: 0.82rem; letter-spacing: 0.04em; padding: 0.35rem 0.75rem; backdrop-filter: blur(4px); box-shadow: none; border-radius: 0; }
  .leaflet-tooltip.map-shape-tooltip::before { display: none; }
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="index.html">← Atlas</a>
  </div>
  <ul class="view-tabs">
    <li><button class="active" data-view="map">By Map</button></li>
    <li><button data-view="content">By Content</button></li>
  </ul>
  <button id="map-theme-btn">bright</button>
</nav>

<div class="content">

  <!-- BY MAP -->
  <div class="view active" id="view-map">
    <div class="map-container" id="map-container">
      <div id="leaflet-map"></div>
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-reset" title="Reset">⌂</button>
        <button class="zoom-btn" id="zoom-in">+</button>
        <button class="zoom-btn" id="zoom-out">−</button>
      </div>
      <div id="map-panel" class="map-panel">
        <button class="map-panel-close" id="map-panel-close">✕</button>
        <div class="map-panel-label" id="map-panel-label"></div>
        <div class="map-panel-actions">
          <button class="map-panel-back" id="map-panel-back">← Back</button>
          <a class="map-panel-link" id="map-panel-link" href="#">Project →</a>
        </div>
        <p class="map-panel-text" id="map-panel-text"></p>
      </div>
    </div>
  </div>

  <!-- BY CONTENT — 3D magnetic grid, ported from Codrops "3DGridContentPreview"
       (github.com/codrops/3DGridContentPreview): each icon parallaxes as the
       cursor moves anywhere on screen, and is magnetically pulled toward the
       cursor on hover. Each icon also gets a local hover tilt + lift shadow,
       ported from Codrops "TiltHoverEffects"
       (github.com/codrops/TiltHoverEffects) — see .icon-figure/.icon-shadow —
       so it visually separates from the background instead of reading as
       flat/pasted onto it. Themes (Soil, Air, Water, Waste — see CLUSTERS in
       the JS below) are picked from the .theme-list on the left, same
       pattern as the century sidebar in 2026-2-thetimeline.html: only the
       active theme's icons are ever in the DOM, so there's no crowding and
       nothing to fit multiple themes into one screen at once. A slow-
       parallax contour-line background sits behind it for depth (see
       .content-bg) — one shared "ground" for every theme, not just Soil.
       The grid markup below is intentionally just an empty mount point —
       see renderCluster()/initIconInteractions() in the JS. -->
  <div class="view" id="view-content">
    <div class="content-bg" id="content-bg">
      <svg viewBox="0 0 1000 700" preserveAspectRatio="none" aria-hidden="true">
        <path d="M -50,120 C 150,60 350,180 550,110 S 900,40 1050,100" />
        <path d="M -50,230 C 180,170 320,290 560,220 S 880,160 1050,210" />
        <path d="M -50,340 C 160,300 380,400 540,330 S 900,280 1050,330" />
        <path d="M -50,450 C 200,390 340,480 580,410 S 860,370 1050,440" />
        <path d="M -50,560 C 170,510 360,600 550,530 S 900,490 1050,550" />
      </svg>
    </div>
    <div class="theme-list" id="theme-list">
      <button class="theme-btn active" data-cluster="Soil">Soil</button>
      <button class="theme-btn" data-cluster="Air">Air</button>
      <button class="theme-btn" data-cluster="Water">Water</button>
      <button class="theme-btn" data-cluster="Waste">Waste</button>
    </div>
    <div class="icon-grid-wrap">
      <div class="icon-grid scattered" id="icon-grid"></div>
    </div>
    <div id="shape-tooltip"></div>
  </div>

</div>

<footer>
  <span class="footer-meta">© 2026 — ODTÜ</span>
  <a href="#" class="btn-library" id="library-btn">
    Open Library
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 6h8M7 3l3 3-3 3"/></svg>
  </a>
</footer>

<div class="library-overlay" id="library-overlay">
  <div class="library-panel">
    <button class="library-close" id="library-close">✕</button>
    <h2 class="library-title">Reflections on Landscape</h2>
    <p class="library-subtitle">Urban Soil Metabolism · Spring 2026</p>
    <ul class="library-list" id="library-list"></ul>
  </div>
</div>

<script>
  // ── Leaflet Map ──
  (function () {
    const BASE = '';
    const DATA = 'data/project_nodes_html_map.json';
    const CENTER = [39.892857, 32.785077];
    const ZOOM = 9;

    window._leafletMap = L.map('leaflet-map', {
      center: CENTER, zoom: ZOOM, zoomControl: false, attributionControl: true,
      minZoom: 5, maxBounds: [[35.8, 25.9], [42.1, 44.8]], maxBoundsViscosity: 1.0
    });

    setTimeout(() => window._leafletMap.invalidateSize(), 0);

    const tileAttrib = '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>';
    let activeTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: tileAttrib, subdomains: 'abcd', maxZoom: 19
    }).addTo(window._leafletMap);

    let isLight = false;
    document.getElementById('map-theme-btn').addEventListener('click', () => {
      isLight = !isLight;
      activeTile.remove();
      activeTile = L.tileLayer(
        isLight ? 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
                : 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        { attribution: tileAttrib, subdomains: 'abcd', maxZoom: 19 }
      ).addTo(window._leafletMap);
      document.body.classList.toggle('map-light', isLight);
      document.getElementById('map-theme-btn').textContent = isLight ? 'dark' : 'bright';
    });

    function makeIcon(html, size = 8) {
      return L.divIcon({ className: '', html, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
    }

    const mapPanel      = document.getElementById('map-panel');
    const mapPanelLabel = document.getElementById('map-panel-label');
    const mapPanelLink  = document.getElementById('map-panel-link');
    const mapPanelBack  = document.getElementById('map-panel-back');
    const mapPanelText  = document.getElementById('map-panel-text');

    let activeShape = null, activeMarkerEl = null, initialBounds = null;
    let prevView = null, mapLocked = false, allMarkers = [], hiddenMarkers = [], lensParent = null;

    function lockMap() {
      mapLocked = true;
      window._leafletMap.dragging.disable(); window._leafletMap.scrollWheelZoom.disable();
      window._leafletMap.touchZoom.disable(); window._leafletMap.doubleClickZoom.disable();
      window._leafletMap.boxZoom.disable(); window._leafletMap.keyboard.disable();
    }
    function unlockMap() {
      mapLocked = false;
      window._leafletMap.dragging.enable(); window._leafletMap.scrollWheelZoom.enable();
      window._leafletMap.touchZoom.enable(); window._leafletMap.doubleClickZoom.enable();
      window._leafletMap.boxZoom.enable(); window._leafletMap.keyboard.enable();
    }
    function clearActive() {
      if (activeShape) { window._leafletMap.removeLayer(activeShape); activeShape = null; }
      if (activeMarkerEl) { activeMarkerEl.style.opacity = ''; activeMarkerEl.style.pointerEvents = ''; activeMarkerEl = null; }
      hiddenMarkers.forEach(m => m.addTo(window._leafletMap));
      hiddenMarkers = [];
      mapPanel.classList.remove('visible', 'mode-geojson');
      mapPanelText.textContent = '';
      closeLensMenu();
      lensParent = null;
      unlockMap();
    }

    document.getElementById('map-panel-close').addEventListener('click', clearActive);
    mapPanelBack.addEventListener('click', () => {
      if (lensParent) {
        openGeojsonNode(lensParent, undefined, null, true);
        return;
      }
      const view = prevView; prevView = null; clearActive();
      if (view) window._leafletMap.flyTo(view.center, view.zoom, { duration: 2.4 });
    });

    // ── Lens radial menu ──
    const LENS_SPREAD_DEG = 360;
    const LENS_RADIUS_RATIO = 0.33;
    const LENS_RADIUS_MIN = 105;
    const LENS_RADIUS_MAX = 330;
    const LENS_FIT_RATIO = 0.7;
    const LENS_STAGGER_MS = 60;

    function getLensRadius() {
      return Math.max(LENS_RADIUS_MIN, Math.min(LENS_RADIUS_MAX, Math.min(window.innerWidth, window.innerHeight) * LENS_RADIUS_RATIO));
    }

    let lensMenuEl = null, lensResizeHandler = null;

    function closeLensMenu() {
      if (!lensMenuEl) return;
      lensMenuEl.remove();
      lensMenuEl = null;
      window.removeEventListener('resize', lensResizeHandler);
      lensResizeHandler = null;
    }

    function showLensMenu(n) {
      closeLensMenu();
      const children = n.lensChildren || [];
      if (!children.length) return;

      const menu = document.createElement('div');
      menu.className = 'lens-menu';
      document.getElementById('map-container').appendChild(menu);
      lensMenuEl = menu;

      function layout() {
        menu.innerHTML = '';
        const pt = window._leafletMap.latLngToContainerPoint([n.lat, n.lng]);
        const ax = pt.x, ay = pt.y;
        const R = getLensRadius();

        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('class', 'lens-arc-svg');
        const circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('class', 'lens-arc');
        circle.setAttribute('cx', ax);
        circle.setAttribute('cy', ay);
        circle.setAttribute('r', R);
        svg.appendChild(circle);
        menu.appendChild(svg);

        children.forEach((child, i) => {
          const phi = (LENS_SPREAD_DEG / children.length) * (i + 0.5) * (Math.PI / 180);
          const dx = Math.sin(phi), dy = -Math.cos(phi);
          const x = ax + R * dx;
          const y = ay + R * dy;
          const labelDir = Math.abs(dx) >= Math.abs(dy)
            ? (dx >= 0 ? 'label-right' : 'label-left')
            : (dy >= 0 ? 'label-bottom' : 'label-top');
          const item = document.createElement('div');
          item.className = 'lens-node ' + labelDir;
          item.style.left = x + 'px';
          item.style.top = y + 'px';
          item.innerHTML = `<div class="lens-node-dot"></div><div class="lens-node-label">${child.label}</div>`;
          item.querySelector('.lens-node-dot').style.transitionDelay = (i * LENS_STAGGER_MS) + 'ms';
          item.querySelector('.lens-node-label').style.transitionDelay = (i * LENS_STAGGER_MS) + 'ms';
          item.addEventListener('click', (e) => {
            e.stopPropagation();
            closeLensMenu();
            openGeojsonNode(child, undefined, n);
          });
          menu.appendChild(item);
          requestAnimationFrame(() => requestAnimationFrame(() => item.classList.add('visible')));
        });
      }

      layout();

      lensResizeHandler = () => layout();
      window.addEventListener('resize', lensResizeHandler);
    }

    function openGeojsonNode(n, marker, parent, isReturning) {
      clearActive();
      lensParent = parent || null;
      if (!parent && !isReturning) {
        prevView = { center: window._leafletMap.getCenter(), zoom: window._leafletMap.getZoom() };
      }
      if (marker) {
        const el = marker.getElement();
        if (el) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; activeMarkerEl = el; }
      }
      hiddenMarkers = allMarkers.filter(m => m !== marker);
      hiddenMarkers.forEach(m => window._leafletMap.removeLayer(m));
      lockMap();
      mapPanelLabel.textContent = n.label;
      mapPanelLink.href = BASE + n.url;
      mapPanelText.textContent = n.description || '';
      if (n.link) {
        mapPanelText.appendChild(document.createElement('br'));
        const linkEl = document.createElement('a');
        linkEl.href = n.link;
        linkEl.target = '_blank';
        linkEl.rel = 'noopener';
        linkEl.textContent = n.link;
        mapPanelText.appendChild(linkEl);
      }
      mapPanel.classList.add('visible', 'mode-geojson');
      const geojsonUrl = DATA.replace(/\/[^/]+$/, '') + '/' + n.geojsonFile + '?v=' + Date.now();
      fetch(geojsonUrl)
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(data => {
          if (!mapPanel.classList.contains('visible')) return;
          const hatchId = 'hatch-' + n.id;
          const svgNS = 'http://www.w3.org/2000/svg';
          const baseStyle = n.style || { color: '#f5f2eb', weight: 1.5, opacity: 1, fillOpacity: 0 };
          if (n.hatch) {
            let defsSvg = document.getElementById('_hatch_defs_svg');
            if (!defsSvg) {
              defsSvg = document.createElementNS(svgNS, 'svg');
              defsSvg.setAttribute('id', '_hatch_defs_svg');
              defsSvg.setAttribute('style', 'position:absolute;width:0;height:0;overflow:hidden');
              document.body.appendChild(defsSvg);
            }
            let defs = defsSvg.querySelector('defs');
            if (!defs) { defs = document.createElementNS(svgNS, 'defs'); defsSvg.appendChild(defs); }
            if (!defs.querySelector('#' + hatchId)) {
              const h = n.hatch; const sp = h.spacing || 6;
              const pat = document.createElementNS(svgNS, 'pattern');
              pat.setAttribute('id', hatchId); pat.setAttribute('patternUnits', 'userSpaceOnUse');
              pat.setAttribute('width', sp); pat.setAttribute('height', sp);
              if (h.type === 'cross') {
                const mkL = (x1, y1, x2, y2) => {
                  const l = document.createElementNS(svgNS, 'line');
                  l.setAttribute('x1', x1); l.setAttribute('y1', y1);
                  l.setAttribute('x2', x2); l.setAttribute('y2', y2);
                  l.setAttribute('stroke', h.color || '#f5f2eb');
                  l.setAttribute('stroke-width', h.width || 1);
                  l.setAttribute('stroke-opacity', h.opacity || 0.7);
                  return l;
                };
                pat.appendChild(mkL(String(sp/2), '0', String(sp/2), String(sp)));
                pat.appendChild(mkL('0', String(sp/2), String(sp), String(sp/2)));
              } else if (h.type === 'dot') {
                const c = document.createElementNS(svgNS, 'circle');
                c.setAttribute('cx', String(sp/2)); c.setAttribute('cy', String(sp/2));
                c.setAttribute('r', String(h.radius || sp * 0.18));
                c.setAttribute('fill', h.color || '#f5f2eb');
                c.setAttribute('fill-opacity', h.opacity || 0.7);
                pat.appendChild(c);
              } else {
                pat.setAttribute('patternTransform', 'rotate(' + (h.angle || 45) + ')');
                const ln = document.createElementNS(svgNS, 'line');
                ln.setAttribute('x1', '0'); ln.setAttribute('y1', '0');
                ln.setAttribute('x2', '0'); ln.setAttribute('y2', sp);
                ln.setAttribute('stroke', h.color || '#f5f2eb');
                ln.setAttribute('stroke-width', h.width || 1.5);
                ln.setAttribute('stroke-opacity', h.opacity || 0.8);
                pat.appendChild(ln);
              }
              defs.appendChild(pat);
            }
          }
          const layer = L.geoJSON(data, {
            interactive: false,
            style: function(feature) {
              const geomType = feature && feature.geometry && feature.geometry.type;
              const isPoly = geomType === 'Polygon' || geomType === 'MultiPolygon';
              if (isPoly) {
                return Object.assign({}, baseStyle, n.polygonStyle || {}, {
                  fillColor:   n.hatch ? ('url(#' + hatchId + ')') : (baseStyle.fillColor || '#f5f2eb'),
                  fillOpacity: n.hatch ? 1 : (baseStyle.fillOpacity || 0),
                });
              }
              return Object.assign({}, baseStyle, n.lineStyle || {});
            }
          }).addTo(window._leafletMap);
          activeShape = layer;
          const bounds = layer.getBounds();
          if (bounds.isValid()) {
            let zoom;
            if (n.zoom !== undefined) {
              zoom = n.zoom;
            } else if (n.lensChildren && n.lensChildren.length) {
              const fitSize = getLensRadius() * 2 * LENS_FIT_RATIO;
              zoom = window._leafletMap.getBoundsZoom(bounds, false, L.point(window.innerWidth - fitSize, window.innerHeight - fitSize));
            } else {
              zoom = window._leafletMap.getBoundsZoom(bounds, false, L.point(40, 40));
            }
            window._leafletMap.flyTo(bounds.getCenter(), zoom, { duration: 1.4 });
          }
          if (n.lensChildren && n.lensChildren.length) {
            setTimeout(() => { if (mapPanel.classList.contains('visible')) showLensMenu(n); }, 1450);
          }
        })
        .catch(err => console.error('[geojson] fetch error:', err));
    }

    fetch(DATA).then(r => r.json()).then(nodes => {
      const markers = [];
      nodes.forEach(n => {
        const type = n.type || 'node';

        if (type === 'node') {
          const html = `<div class="node"><div class="node-dot"></div><div class="node-label">${n.label}</div></div>`;
          const marker = L.marker([n.lat, n.lng], { icon: makeIcon(html) }).addTo(window._leafletMap);
          markers.push(marker);
          marker.on('click', () => {
            clearActive();
            prevView = { center: window._leafletMap.getCenter(), zoom: window._leafletMap.getZoom() };
            const el = marker.getElement();
            if (el) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; activeMarkerEl = el; }
            hiddenMarkers = allMarkers.filter(m => m !== marker);
            hiddenMarkers.forEach(m => window._leafletMap.removeLayer(m));
            lockMap();
            window._leafletMap.flyTo([n.lat, n.lng], n.zoom || 14, { duration: 1.4 });
            mapPanelLabel.textContent = n.label;
            mapPanelLink.href = BASE + n.url;
            mapPanelText.textContent = n.description || '';
            mapPanel.classList.add('visible', 'mode-geojson');
          });

        } else if (type === 'geojson') {
          const shapeClass = n.icon === 'image' ? ' node-image' : '';
          const iconSize = n.icon === 'image' ? 20 : 8;
          const dotAttr = n.icon === 'image' && n.iconImage ? ` style="--node-img: url('${BASE + n.iconImage}')"` : '';
          const html = `<div class="node${shapeClass}"><div class="node-dot"${dotAttr}></div><div class="node-label">${n.label}</div></div>`;
          const marker = L.marker([n.lat, n.lng], { icon: makeIcon(html, iconSize) }).addTo(window._leafletMap);
          markers.push(marker);
          marker.on('click', () => openGeojsonNode(n, marker));

        } else {
          const html = `<div class="node"><div class="node-dot"></div><div class="node-label">${n.label}</div></div>`;
          const marker = L.marker([n.lat, n.lng], { icon: makeIcon(html) }).addTo(window._leafletMap);
          markers.push(marker);
          marker.on('click', () => {
            clearActive();
            prevView = { center: window._leafletMap.getCenter(), zoom: window._leafletMap.getZoom() };
            const el = marker.getElement();
            if (el) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; activeMarkerEl = el; }
            hiddenMarkers = allMarkers.filter(m => m !== marker);
            hiddenMarkers.forEach(m => window._leafletMap.removeLayer(m));
            lockMap();
            window._leafletMap.flyTo([n.lat, n.lng], 15, { duration: 1.4 });
            const shapeStyle = { color: 'rgba(245,242,235,0.75)', weight: 1.5, fillColor: 'rgba(245,242,235,0.08)', fillOpacity: 1 };
            activeShape = type === 'polygon'
              ? L.polygon(n.coordinates, shapeStyle).addTo(window._leafletMap)
              : L.polyline(n.coordinates, { color: 'rgba(245,242,235,0.75)', weight: 2 }).addTo(window._leafletMap);
            if (n.briefing) activeShape.bindTooltip(n.briefing, { sticky: true, className: 'map-shape-tooltip' });
            mapPanelLabel.textContent = n.label;
            mapPanelLink.href = BASE + n.url;
            mapPanelText.textContent = n.description || '';
            mapPanel.classList.add('visible', 'mode-geojson');
          });
        }
      });

      allMarkers = markers;
      if (markers.length) {
        initialBounds = L.featureGroup(markers).getBounds().pad(0.4);
        const fitZoom = window._leafletMap.getBoundsZoom(initialBounds) - 1;
        window._leafletMap.setView(CENTER, fitZoom);
      }
    });

    document.getElementById('zoom-in').addEventListener('click',    () => window._leafletMap.zoomIn());
    document.getElementById('zoom-out').addEventListener('click',   () => window._leafletMap.zoomOut());
    document.getElementById('zoom-reset').addEventListener('click', () => {
      prevView = null; clearActive();
      const z = initialBounds ? window._leafletMap.getBoundsZoom(initialBounds) - 1 : ZOOM;
      window._leafletMap.flyTo(CENTER, z, { duration: 1.4 });
    });
  })();

  // ── View switcher ──
  const buttons = document.querySelectorAll('.view-tabs button');
  const views   = document.querySelectorAll('.view');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.view;
      buttons.forEach(b => b.classList.remove('active'));
      views.forEach(v => v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('view-' + target).classList.add('active');
      if (target === 'map' && window._leafletMap) window._leafletMap.invalidateSize();
      if (target !== 'content' && window._resetContentView) window._resetContentView();
    });
  });

  // ── Library overlay ──
  const LIBRARY_PROJECTS = [
    { num: '01', label: 'Çayırhan Ash Lake',           url: '2026-pages/p1-pages/2026-1.html' },
    { num: '02', label: 'Hıdırlık Tepe',               url: '2026-pages/p2-pages/2026-2.html' },
    { num: '03', label: 'Grid',                        url: '2026-pages/p3-pages/2026-3.html' },
    { num: '04', label: 'Bilkent Territory',           url: '2026-pages/p4-pages/2026-4-proposal&methodology.html' },
    { num: '05', label: 'The Grand Çankaya Hotel', url: '2026-pages/p5-pages/2026-5.html' },
    { num: '06', label: 'Imrahor Valley',              url: '2026-pages/p6-pages/2026-6.html' },
    { num: '07', label: 'Ilker Neighbourhood',         url: '2026-pages/p7-pages/2026-7-info.html' },
    { num: '08', label: 'ÇUBUK I Dam',                 url: '2026-pages/p8-pages/2026-8.html' },
  ];

  const libraryOverlay = document.getElementById('library-overlay');
  const libraryList    = document.getElementById('library-list');

  LIBRARY_PROJECTS.forEach(p => {
    const li = document.createElement('li');
    const a  = document.createElement('a');
    a.href = p.url;
    const index = document.createElement('span');
    index.className = 'library-index';
    index.textContent = p.num;
    const label = document.createElement('span');
    label.textContent = p.label;
    a.appendChild(index);
    a.appendChild(label);
    li.appendChild(a);
    libraryList.appendChild(li);
  });

  function openLibrary()  { libraryOverlay.classList.add('visible'); }
  function closeLibrary() { libraryOverlay.classList.remove('visible'); }

  document.getElementById('library-btn').addEventListener('click', (e) => { e.preventDefault(); openLibrary(); });
  document.getElementById('library-close').addEventListener('click', closeLibrary);
  libraryOverlay.addEventListener('click', (e) => { if (e.target === libraryOverlay) closeLibrary(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLibrary(); });

  // ── Icon grid (By Content) — ported from Codrops "3DGridContentPreview" ──
  // (github.com/codrops/3DGridContentPreview: MagneticFx + GridItem, adapted
  // to plain <script> globals instead of their ES-module/webpack build, and
  // without the click-through "preview" panel since these icons already
  // link straight to real project pages.)
  // ── Cluster data + renderer ──
  // This is the actual answer to "how does this scale as new projects come
  // in": every icon on this page is one entry in CLUSTERS below, not
  // hand-written markup. Adding project #9 to Soil, or a whole new theme,
  // means adding one object here. Only the ACTIVE theme's icons are ever in
  // the DOM at once (renderCluster() below, switched via .theme-list in the
  // HTML) — same left-sidebar-picks-what's-shown pattern as the century
  // list in 2026-2-thetimeline.html — so each theme gets the full canvas
  // to itself instead of every theme competing for space on one screen.
  function svgIcon(inner) {
    return 'data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' + inner + '</svg>'
    );
  }
  // Air/Water/Waste placeholder art — invented line-icons (same thin
  // white-stroke language as the real Soil icons) just to demo the layout;
  // swap for real project images once those projects exist.
  const A = 'stroke="#f5f2eb" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  const AIR_ICONS = {
    wind:    svgIcon('<path d="M10,30 Q30,20 50,30 T90,30" ' + A + '/><path d="M10,50 Q30,40 50,50 T85,50" ' + A + '/><path d="M10,70 Q30,60 50,70 T75,70" ' + A + '/>'),
    cloud:   svgIcon('<g ' + A + '><circle cx="35" cy="55" r="18"/><circle cx="58" cy="42" r="22"/><circle cx="80" cy="58" r="13"/><path d="M20,66 h68"/></g>'),
    bird:    svgIcon('<path d="M8,55 Q35,28 50,50 Q65,28 92,55" ' + A + '/>'),
    balloon: svgIcon('<g ' + A + '><ellipse cx="50" cy="38" rx="22" ry="28"/><path d="M42,64 L58,64 L50,74 Z"/><line x1="50" y1="74" x2="50" y2="95"/></g>'),
    kite:    svgIcon('<g ' + A + '><path d="M50,8 L76,45 L50,92 L24,45 Z"/><path d="M24,45 L76,45 M50,8 L50,92"/><path d="M50,92 q6,5 0,10 q-6,5 0,10"/></g>'),
    turbine: svgIcon('<g ' + A + '><circle cx="50" cy="50" r="4" fill="#f5f2eb"/><path d="M50,50 Q40,20 56,8"/><path d="M50,50 Q76,60 90,40"/><path d="M50,50 Q34,76 16,68"/></g>'),
    chimney: svgIcon('<g ' + A + '><rect x="30" y="45" width="24" height="45"/><path d="M42,45 Q34,30 45,22 Q56,14 48,4"/></g>'),
    breath:  svgIcon('<g ' + A + '><path d="M50,14 v26"/><path d="M50,40 Q28,46 24,72 Q21,92 35,89 Q46,86 50,58"/><path d="M50,40 Q72,46 76,72 Q79,92 65,89 Q54,86 50,58"/></g>'),
  };
  const WATER_ICONS = {
    droplet: svgIcon('<path d="M50,10 C65,35 78,52 78,66 a28,28 0 1,1 -56,0 C22,52 35,35 50,10 Z" ' + A + '/>'),
    wave:    svgIcon('<path d="M8,45 Q25,30 42,45 T76,45 T92,45" ' + A + '/><path d="M8,65 Q25,50 42,65 T76,65 T92,65" ' + A + '/>'),
    river:   svgIcon('<path d="M15,20 Q35,35 25,50 Q15,65 40,75 Q65,85 55,60 Q48,45 70,40 Q88,36 85,15" ' + A + '/>'),
    well:    svgIcon('<g ' + A + '><ellipse cx="50" cy="35" rx="26" ry="10"/><path d="M24,35 v18 a26,10 0 0,0 52,0 v-18"/><line x1="50" y1="14" x2="50" y2="35"/><path d="M38,8 h24"/></g>'),
    rain:    svgIcon('<g ' + A + '><path d="M25,50 a15,15 0 0,1 0,-30 a20,20 0 0,1 40,-4 a15,15 0 0,1 3,34 z"/><line x1="35" y1="66" x2="30" y2="80"/><line x1="50" y1="66" x2="45" y2="84"/><line x1="65" y1="66" x2="60" y2="80"/></g>'),
    glacier: svgIcon('<path d="M10,80 L30,40 L45,60 L60,25 L75,55 L90,80 Z" ' + A + '/>'),
    tap:     svgIcon('<g ' + A + '><path d="M25,30 h35 a10,10 0 0,1 10,10 v10"/><line x1="70" y1="50" x2="70" y2="60"/><path d="M62,60 h16 l-8,14 z"/><line x1="30" y1="30" x2="30" y2="15"/></g>'),
  };
  const WASTE_ICONS = {
    bin:      svgIcon('<g ' + A + '><path d="M30,30 h40 l-4,50 a4,4 0 0,1 -4,4 h-24 a4,4 0 0,1 -4,-4 Z"/><line x1="24" y1="30" x2="76" y2="30"/><path d="M40,30 v-6 a4,4 0 0,1 4,-4 h12 a4,4 0 0,1 4,4 v6"/><line x1="42" y1="40" x2="44" y2="72"/><line x1="58" y1="40" x2="56" y2="72"/></g>'),
    recycle:  svgIcon('<g ' + A + '><path d="M35,25 Q55,15 68,32"/><path d="M62,26 l6,6 l8,-3"/><path d="M75,55 Q80,75 60,82"/><path d="M68,78 l-8,4 l2,-9"/><path d="M35,75 Q15,68 20,45"/><path d="M14,52 l-2,-9 l9,3"/></g>'),
    landfill: svgIcon('<g ' + A + '><path d="M10,80 Q30,30 50,80 Q70,30 90,80 Z"/><line x1="35" y1="60" x2="42" y2="65"/><line x1="55" y1="55" x2="60" y2="62"/></g>'),
    bottle:   svgIcon('<g ' + A + '><path d="M42,10 h16 v14 l8,10 v50 a6,6 0 0,1 -6,6 h-20 a6,6 0 0,1 -6,-6 v-50 l8,-10 Z"/><line x1="42" y1="10" x2="42" y2="4"/><line x1="58" y1="10" x2="58" y2="4"/></g>'),
    pile:     svgIcon('<g ' + A + '><path d="M10,75 h30 l-6,-16 h20 l8,16 h22"/><rect x="30" y="45" width="14" height="14" transform="rotate(15 37 52)"/><circle cx="65" cy="50" r="8"/></g>'),
    pipe:     svgIcon('<g ' + A + '><path d="M15,35 h40 a15,15 0 0,1 15,15 v35"/><ellipse cx="15" cy="35" rx="6" ry="10"/><ellipse cx="70" cy="85" rx="10" ry="6"/></g>'),
    decay:    svgIcon('<g ' + A + ' stroke-width="3"><circle cx="50" cy="50" r="30" stroke-width="4"/><path d="M35,35 l10,10 -6,8 M60,32 l6,14 -10,4 M40,65 l14,-4 2,12"/></g>'),
  };

  // Full canvas per active theme — a 4-col x 2-row scatter with hand jitter,
  // sx/sy/rot in %/deg (see .icon-slot in the CSS). Soil is real content;
  // Air/Water/Waste are the invented placeholders above.
  const CLUSTERS = [
    {
      name: 'Soil',
      items: [
        { id: 'shape-0', label: 'The Powerplant', href: '2026-pages/p1-pages/2026-1.html', img: 'must-images/by-content/Soil - Group 1 - The Powerplant.webp', size: 98, sx: '14%', sy: '20%', rot: -6 },
        { id: 'shape-1', label: 'The Model', href: '2026-pages/p2-pages/2026-2.html', img: 'must-images/by-content/Soil - Group 2 - The Model.webp', size: 130, sx: '37%', sy: '30%', rot: 5 },
        { id: 'shape-2', label: 'The Sifters', href: '2026-pages/p3-pages/2026-3.html', img: 'must-images/by-content/Soil - Group 3 - The Sifters.webp', sx: '60%', sy: '16%', rot: 8 },
        { id: 'shape-3', label: 'The Reeds', href: '2026-pages/p4-pages/2026-4-proposal&methodology.html', img: 'must-images/by-content/Soil - Group 4 - The Reeds.webp', size: 98, sx: '83%', sy: '26%', rot: -4 },
        { id: 'shape-4', label: 'The Hotel', href: '2026-pages/p5-pages/2026-5.html', img: 'must-images/by-content/Soil - Group 5 - The Hotel.webp', size: 74, opacity: 0.8, sx: '18%', sy: '72%', rot: 6 },
        { id: 'shape-5', label: 'The Timeline', href: '2026-pages/p6-pages/2026-6.html', img: 'must-images/by-content/Soil - Group 6 - The Timeline.webp', filter: 'grayscale(1) brightness(1.5)', sx: '40%', sy: '82%', rot: -9 },
        { id: 'shape-6', label: 'The Migrant', href: '2026-pages/p7-pages/2026-7-info.html', img: 'must-images/by-content/Soil - Group 7 - The Migrant.webp', sx: '63%', sy: '68%', rot: 3 },
        { id: 'shape-7', label: 'The Helical', href: '2026-pages/p8-pages/2026-8.html', img: 'must-images/by-content/Soil - Group 8 - The Hellical.webp', sx: '86%', sy: '78%', rot: -5 },
      ],
    },
    {
      // Placeholder content only — no href, clicking these does nothing.
      name: 'Air',
      items: [
        { id: 'air-0', label: 'The Wind', img: AIR_ICONS.wind, sx: '12%', sy: '24%', rot: 4 },
        { id: 'air-1', label: 'The Cloud', img: AIR_ICONS.cloud, sx: '35%', sy: '14%', rot: -6 },
        { id: 'air-2', label: 'The Bird', img: AIR_ICONS.bird, sx: '58%', sy: '28%', rot: 7 },
        { id: 'air-3', label: 'The Balloon', img: AIR_ICONS.balloon, sx: '82%', sy: '18%', rot: -3 },
        { id: 'air-4', label: 'The Kite', img: AIR_ICONS.kite, sx: '16%', sy: '76%', rot: 5 },
        { id: 'air-5', label: 'The Turbine', img: AIR_ICONS.turbine, sx: '38%', sy: '66%', rot: -8 },
        { id: 'air-6', label: 'The Chimney', img: AIR_ICONS.chimney, sx: '61%', sy: '80%', rot: 6 },
        { id: 'air-7', label: 'The Breath', img: AIR_ICONS.breath, sx: '85%', sy: '70%', rot: -4 },
      ],
    },
    {
      name: 'Water',
      items: [
        { id: 'water-0', label: 'The Droplet', img: WATER_ICONS.droplet, sx: '14%', sy: '18%', rot: -5 },
        { id: 'water-1', label: 'The Wave', img: WATER_ICONS.wave, sx: '38%', sy: '30%', rot: 6 },
        { id: 'water-2', label: 'The River', img: WATER_ICONS.river, sx: '62%', sy: '16%', rot: -7 },
        { id: 'water-3', label: 'The Well', img: WATER_ICONS.well, sx: '84%', sy: '28%', rot: 4 },
        { id: 'water-4', label: 'The Rain', img: WATER_ICONS.rain, sx: '24%', sy: '72%', rot: -6 },
        { id: 'water-5', label: 'The Glacier', img: WATER_ICONS.glacier, sx: '50%', sy: '80%', rot: 5 },
        { id: 'water-6', label: 'The Tap', img: WATER_ICONS.tap, sx: '74%', sy: '68%', rot: -4 },
      ],
    },
    {
      name: 'Waste',
      items: [
        { id: 'waste-0', label: 'The Bin', img: WASTE_ICONS.bin, sx: '14%', sy: '20%', rot: 5 },
        { id: 'waste-1', label: 'The Recycle', img: WASTE_ICONS.recycle, sx: '38%', sy: '32%', rot: -6 },
        { id: 'waste-2', label: 'The Landfill', img: WASTE_ICONS.landfill, sx: '62%', sy: '14%', rot: 7 },
        { id: 'waste-3', label: 'The Bottle', img: WASTE_ICONS.bottle, sx: '84%', sy: '26%', rot: -4 },
        { id: 'waste-4', label: 'The Pile', img: WASTE_ICONS.pile, sx: '24%', sy: '72%', rot: 6 },
        { id: 'waste-5', label: 'The Pipe', img: WASTE_ICONS.pipe, sx: '50%', sy: '82%', rot: -5 },
        { id: 'waste-6', label: 'The Decay', img: WASTE_ICONS.decay, sx: '74%', sy: '66%', rot: 4 },
      ],
    },
  ];

  // Builds only the given cluster's icons into #icon-grid, discarding
  // whatever was there before — the previous cluster's rAF loops notice
  // their cell is no longer in the document (see the isConnected checks in
  // MagneticImage.render/GridItem3D.move below) and stop themselves, so
  // nothing keeps running for a theme that isn't showing.
  function renderCluster(name) {
    const grid = document.getElementById('icon-grid');
    grid.innerHTML = '';
    const cluster = CLUSTERS.find(c => c.name === name);
    if (!cluster) return;

    cluster.items.forEach(item => {
      const slot = document.createElement('div');
      slot.className = 'icon-slot';
      slot.style.setProperty('--sx', item.sx);
      slot.style.setProperty('--sy', item.sy);
      slot.style.setProperty('--srot', item.rot + 'deg');

      const cell = document.createElement('div');
      cell.className = 'icon-cell';
      cell.id = item.id;
      cell.dataset.label = item.label;
      if (item.href) cell.dataset.href = item.href;
      if (item.size) cell.style.maxWidth = item.size + 'px';
      if (item.opacity !== undefined) cell.style.opacity = item.opacity;

      const figure = document.createElement('div');
      figure.className = 'icon-figure';
      const glow = document.createElement('div');
      glow.className = 'icon-glow';
      const shadow = document.createElement('div');
      shadow.className = 'icon-shadow';
      const img = document.createElement('img');
      img.className = 'icon-img';
      img.src = item.img;
      img.draggable = false;
      img.alt = item.label;
      if (item.filter) img.style.filter = item.filter;

      figure.appendChild(glow);
      figure.appendChild(shadow);
      figure.appendChild(img);
      cell.appendChild(figure);
      slot.appendChild(cell);
      grid.appendChild(slot);
    });
  }

  const shapeTooltip = document.getElementById('shape-tooltip');
  const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  const contentView = document.getElementById('view-content');

  function lerp(a, b, n) { return (1 - n) * a + n * b; }
  function mapRange(x, a, b, c, d) { return (x - a) * (d - c) / (b - a) + c; }
  function calcWinsize() { return { width: window.innerWidth, height: window.innerHeight }; }

  let winsize = calcWinsize();
  window.addEventListener('resize', () => winsize = calcWinsize());

  // shared cursor position — every cell's rAF loop below reads this same
  // value, exactly like the original's single window-level mousemove.
  let mousepos = { x: winsize.width / 2, y: winsize.height / 2 };
  window.addEventListener('mousemove', (e) => { mousepos = { x: e.clientX, y: e.clientY }; });

  // MagneticFx: the icon inside a hovered cell is pulled toward the
  // cursor (amt 0.04 lerp, same as the original) and scales up; on
  // mouseleave it eases back to (0,0) scale 1 with GSAP's power4 ease.
  class MagneticImage {
    constructor(el) {
      this.el = el;
      this.rendered = { tx: { previous: 0, current: 0 }, ty: { previous: 0, current: 0 } };
      const cell = el.closest('.icon-cell');
      cell.addEventListener('mouseenter', () => {
        this.hoverTimeout = setTimeout(() => {
          // Recompute fresh right as the hover starts, instead of relying
          // on a rect cached at page-load — a couple of icons were
          // overshooting far more than the rest because their cached rect
          // (taken before webp images had finished loading/settling into
          // the scattered layout) no longer matched the element's real
          // position, so the "distance to cursor" math was off.
          this.rect = this.el.getBoundingClientRect();
          this.rendered.tx.previous = gsap.getProperty(this.el, 'x');
          this.rendered.ty.previous = gsap.getProperty(this.el, 'y');
          this.loopRender();
          if (this.outTl) this.outTl.kill();
          this.inTl = gsap.timeline().to(this.el, { duration: 0.5, ease: 'expo', scale: 1.55 });
        }, 10);
      });
      cell.addEventListener('mouseleave', () => {
        if (this.hoverTimeout) clearTimeout(this.hoverTimeout);
        this.stopRendering();
        if (this.inTl) this.inTl.kill();
        this.outTl = gsap.timeline().to(this.el, { duration: 1, ease: 'power4', x: 0, y: 0, scale: 1 });
      });
    }
    loopRender() { if (!this.raf) this.raf = requestAnimationFrame(() => this.render()); }
    stopRendering() { if (this.raf) { cancelAnimationFrame(this.raf); this.raf = undefined; } }
    render() {
      this.raf = undefined;
      if (!this.el.isConnected) return; // theme was switched away mid-hover — stop, don't reschedule
      // 0.14 instead of the original's 0.3 — at that strength a hovered
      // icon could travel most of its own width just from where inside
      // it the cursor happened to land. Also hard-clamped to ±26px as a
      // safety net so no icon can ever travel further than that,
      // regardless of cursor position within it.
      const rawX = (mousepos.x - (this.rect.left + this.rect.width / 2)) * 0.14;
      const rawY = (mousepos.y - (this.rect.top + this.rect.height / 2)) * 0.14;
      this.rendered.tx.current = Math.max(-26, Math.min(26, rawX));
      this.rendered.ty.current = Math.max(-26, Math.min(26, rawY));
      this.rendered.tx.previous = lerp(this.rendered.tx.previous, this.rendered.tx.current, 0.04);
      this.rendered.ty.previous = lerp(this.rendered.ty.previous, this.rendered.ty.current, 0.04);
      gsap.set(this.el, { x: this.rendered.tx.previous, y: this.rendered.ty.previous });
      this.loopRender();
    }
  }

  // GridItem: on load, each cell is tilted based on its quadrant of the
  // viewport (further from center = more rotated + pushed back in Z, the
  // "concave wall" look), then continuously parallaxes as the cursor
  // moves anywhere on the page — not just while hovering that cell.
  class GridItem3D {
    constructor(cell) {
      this.cell = cell;
      this.rotationVals = { x: 0, y: 0 };
      this.rxstart = 3;
      this.rystart = 5;
      new MagneticImage(cell.querySelector('.icon-img'));
      this.layout();
      this.loop();
    }
    layout() {
      const rect = this.cell.getBoundingClientRect();
      this.isLeft = rect.left + rect.width / 2 < winsize.width / 2;
      this.isTop = rect.top + rect.height / 2 < winsize.height / 2;
      this.rY = this.isLeft
        ? mapRange(rect.left + rect.width / 2, 0, winsize.width / 2, this.rystart, 0)
        : mapRange(rect.left + rect.width / 2, winsize.width / 2, winsize.width, 0, -this.rystart);
      this.rX = this.isTop
        ? mapRange(rect.top + rect.height / 2, 0, winsize.height / 2, -this.rxstart, 0)
        : mapRange(rect.top + rect.height / 2, winsize.height / 2, winsize.height, 0, this.rxstart);
      this.tZ = this.isLeft
        ? mapRange(rect.left + rect.width / 2, 0, winsize.width / 2, -30, -70)
        : mapRange(rect.left + rect.width / 2, winsize.width / 2, winsize.width, -70, -30);
      gsap.set(this.cell, { rotationX: this.rX, rotationY: this.rY, z: this.tZ });
    }
    loop() { if (!this.raf) this.raf = requestAnimationFrame(() => this.move()); }
    move() {
      this.raf = undefined;
      if (!this.cell.isConnected) return; // theme was switched away — stop looping for this cell
      // skip the work while the "By Content" tab isn't visible — the loop
      // still ticks (cheap) but doesn't touch layout/style until it is.
      if (contentView.classList.contains('active')) {
        // Rotation only — no shared x/y translation here anymore. That
        // translation used the same mousepos-to-range formula for every
        // cell, so every icon slid in the exact same direction by the
        // exact same amount at once; the per-icon sliding people actually
        // want to see already comes from MagneticImage above, which reacts
        // to each icon's own position relative to the cursor.
        this.rotationVals.x = this.isTop
          ? lerp(this.rotationVals.x, mapRange(mousepos.y, 0, winsize.height / 2, this.rxstart, 0), 0.04)
          : lerp(this.rotationVals.x, mapRange(mousepos.y, winsize.height / 2, winsize.height, 0, -this.rxstart), 0.04);
        this.rotationVals.y = this.isLeft
          ? lerp(this.rotationVals.y, mapRange(mousepos.x, 0, winsize.width / 2, -this.rystart, 0), 0.04)
          : lerp(this.rotationVals.y, mapRange(mousepos.x, winsize.width / 2, winsize.width, 0, this.rystart), 0.04);
        gsap.set(this.cell, {
          rotationX: -this.rX - this.rotationVals.x,
          rotationY: -this.rY - this.rotationVals.y,
        });
      }
      this.loop();
    }
  }

  // TiltFx — ported from Codrops "TiltHoverEffects"
  // (github.com/codrops/TiltHoverEffects): unlike GridItem3D above (whole-
  // window mouse position, ambient/always-on) or MagneticImage (pulls the
  // icon *toward* the cursor), this reacts only to the cursor's position
  // *inside this one cell* while hovering it, tilting the .icon-figure
  // layer and lifting it toward the camera (translateZ) with a shadow
  // fading in underneath — the combination that makes a hovered icon read as
  // separated from the flat background instead of pasted onto it. Targets
  // .icon-figure (not .icon-cell, which GridItem3D already animates, and
  // not .icon-img, which MagneticImage already animates) so none of the
  // three systems ever fight over the same element's transform.
  class TiltFx {
    constructor(cell) {
      this.cell = cell;
      this.figure = cell.querySelector('.icon-figure');
      if (!this.figure) return;
      cell.addEventListener('mousemove', (e) => this.onMove(e));
      cell.addEventListener('mouseleave', () => this.onLeave());
    }
    onMove(e) {
      const b = this.cell.getBoundingClientRect();
      const px = (e.clientX - b.left) / b.width;
      const py = (e.clientY - b.top) / b.height;
      gsap.set(this.figure, {
        rotateX: (0.5 - py) * 16,
        rotateY: (px - 0.5) * 16,
        z: 16,
        transformPerspective: 400,
      });
    }
    onLeave() {
      gsap.to(this.figure, { duration: 1, ease: 'elastic.out(1, 0.4)', rotateX: 0, rotateY: 0, z: 0 });
    }
  }

  // Wires GridItem3D/TiltFx/click/tooltip onto whatever .icon-cell elements
  // are currently in #icon-grid — called once at startup and again every
  // time the active theme changes (renderCluster() replaces the DOM, so
  // this has to re-select and re-wire fresh each time).
  function initIconInteractions() {
    const shapes = Array.from(document.querySelectorAll('.icon-grid .icon-cell'));

    if (!isTouch && window.gsap) {
      shapes.forEach(cell => { new GridItem3D(cell); new TiltFx(cell); });
    }

    shapes.forEach(el => {
      if (el.dataset.href) {
        el.addEventListener('click', () => { window.location.href = el.dataset.href; });
      }
    });

    if (!isTouch) {
      shapes.forEach(el => {
        el.addEventListener('mouseenter', () => {
          shapeTooltip.textContent = el.dataset.label;
          shapeTooltip.classList.add('visible');
        });
        el.addEventListener('mousemove', (e) => {
          shapeTooltip.style.left = (e.clientX + 16) + 'px';
          shapeTooltip.style.top  = (e.clientY - 10) + 'px';
          shapeTooltip.style.transform = 'none';
        });
        el.addEventListener('mouseleave', () => {
          shapeTooltip.classList.remove('visible');
        });
      });
    }
  }

  // Theme sidebar — same interaction pattern as .century-btn in
  // 2026-2-thetimeline.html: click swaps .active and reloads what's shown.
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.classList.contains('active')) return;
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCluster(btn.dataset.cluster);
      initIconInteractions();
    });
  });

  renderCluster('Soil');
  initIconInteractions();

  if (!isTouch && window.gsap) {
    // Background parallax: the contour-line layer behind the grid moves
    // too, just far less than the icons (BG_RATIO vs. the icons' own
    // ranges above) — a background is supposed to move less than the
    // foreground, it just wasn't moving *at all* before, which is what
    // made the icon motion feel disconnected from the scene around it.
    // Independent of which theme is active, so it's set up once here.
    const bgEl = document.getElementById('content-bg');
    const BG_RATIO = 0.012;
    let bgPos = { x: 0, y: 0 };
    (function loopBg() {
      if (contentView.classList.contains('active')) {
        const tx = (mousepos.x - winsize.width / 2) * BG_RATIO;
        const ty = (mousepos.y - winsize.height / 2) * BG_RATIO;
        bgPos.x = lerp(bgPos.x, tx, 0.03);
        bgPos.y = lerp(bgPos.y, ty, 0.03);
        gsap.set(bgEl, { x: bgPos.x + '%', y: bgPos.y + '%' });
      }
      requestAnimationFrame(loopBg);
    })();
  }
</script>
